</style></head><body><div class="app">

<div class="progress"><div id="bar" class="bar"></div></div><main id="main"></main>

</div>
<script>
const INTRO="";
const SECTIONS=[{"name": "Amends", "reading": "The Ninth Step is not a step that can be neatly contained within a particular time frame. We don't write our Eighth Step list and then resolutely start making amends, crossing off \"completed\" ones like we would items on a shopping list. In fact, many of our amends will never be \"finished\"; our efforts will go on throughout our recovery. For instance, if we owe our families amends, we will spend the rest of our lives practicing the spiritual principles that will bring real change to the way we treat people. There may be one day when we sit our families down and make a commitment to treat them differently than we have in the past, but that won't be the end of our amends. Each day that we make an effort to refrain from hurting our families and try to practice loving behavior with them is a day when we've continued our amends to our families. Even such relatively concrete amends as paying a past-due debt aren't likely to be done once and for all when the debt is paid off. Living our Ninth Step requires that we try not to incur new debts that we can't pay. On a deeper level, we may need to look at the varieties of debt we incur-for instance, taking favor after favor from friends but never reciprocating, or overextending the patience of people with whom we share responsibilities by not assuming our fair share. Avoiding such liabilities in the future is just as much a part of our amends process as making regular payments on past-due debts.", "count": 2}, {"name": "Fears and Expectations", "reading": "Making amends isn't always a nerve-wracking, joyless experience. Often, we will feel excited about the prospect of healing a relationship. We may find that we're happily anticipating the relief of having made an amends. For most of us, however, we will feel fearful about at least some of our amends. We may be afraid that if we make financial amends, we won't have enough for ourselves. We may be afraid of rejection, retaliation, or something else. If we've never had any experience with the Ninth Step before, we're really venturing into the unknown. We're not sure how we're going to feel immediately before the amends, during the amends, and after the amends. We may feel wildly overconfident at one moment and then, the next moment, feel totally unable to go on with the Ninth Step. This is a time when it's very important to understand that the ways things feel is not necessarily the way things are. Just because we feel afraid doesn't mean there's truly something to fear. On the other hand, feeling excited and happy won't necessarily reflect the reality of making our amends. It's best to let go of all our expectations about how our amends will be received.", "count": 3}, {"name": "Amends - Direct and Indirect", "reading": "We in NA tend to think it's best to make direct, face-to4ace amends, and indeed, this step says we should do so wherever possible. But direct amends are not the only way to make amends, and in some cases, they may be the worst way. Before we provide some examples, it is very important to note that these are only examples. This guide is not meant to take the place of a sponsor in going over each amends with a sponsee and working together to decide what's best. Some situations are more complicated than they appear at first glance. We may think the solution is obvious, but we should always take the time for further reflection. For instance, there may be a situation where the person or people we've harmed are not aware of what we did, and learning what we did might possibly harm them more. We may have some friends, relatives, or an employer who were unaware of our addiction. To tell them might harm them. Our sponsor will help us look at our motives for wanting to tell people about our addiction. Do they need to know? What good purpose will be served by sharing such information? What damage could such information do? But what if this same situation was complicated by our theft of some money from our friends? And what if someone else was accused of taking the money? Wouldn't we then need to tell about our addiction, along with admitting the theft and paying the money back? Possibly, but perhaps not. Each of these kinds of situations needs to be taken on an individual basis. Again, our sponsor will help us decide how best to handle each one. In our discussion with our sponsor, if we are open-minded, we're sure to think about these kinds of situations in ways we haven't thought about them before. We may see how what we first thought was the obvious method of making amends may not be right after all. It's very helpful to prepare for this discussion by listing all the circumstances for these difficult amends so that it will be right in front of us when we talk to our sponsor.", "count": 6}, {"name": "Forgiveness", "reading": "The spiritual growth we get from making direct amends often depends on how much we put into our spiritual preparation. We start with getting rid of any beliefs we have that may be causmg us to hesitate or might inhibit our ability to approach our amends with humility, acceptance, and faith. Something that seems to be a problem for many of us is that we often owe amends to people who have also harmed us. This may be a parent or other relative who abused us, a friend who let us down somehow, an employer who didn't treat us fairly, and so on. We've done a lot of work in the previous steps to separate what they did to us from what we did to them. We know exactly what our part in these situations was, and we know why we are making amends. As we prepare to make direct, face-to-face amends, we need to be perfectly clear that we are making amends for our part in these conflicts. We're not making amends to coerce or manipulate a reciprocal amends. We're not responsible for cleaning up anything not on our side of the street. Keeping this in mind throughout our amends will help us keep focused on our purpose no matter how our amends are received and whether or not we receive amends in return for harm done to us. Sometimes, though, the wrong done to us was so extreme that it's better to postpone making our amends until a later time. For instance, many of us were emotionally, physically, or sexually abused as children by an older relative. Though we had no part in that situation and owe no amends because of it, we may have stolen money or caused physical or property damage to the relative at some other time. So we owe amends for the theft, physical harm, or vandalism. The question that arises in this situation is not whether to make amends, but when and how. It may take a long time before we are ready to make an appropriate amends, and that's okay. We wait, and we work with our sponsor. We need to try to forgive the people who have harmed us before we make amends to them. We don't want to sit down with someone with whom we're furious and try to make amends. Our attitude will be apparent, no matter how much we try to hide it. Amends are a time when it's not usually very productive to \"act as if.\" There's a big difference between situations when we were harmed against our will and situations in which our behavior contributed to the way we were treated. For many of our amends, when we're angry at someone who treated us badly, we need to ask ourselves if anything we did could have caused them to treat us as they did. For instance, we may be enraged at our parents for not trusting us to go out on a weekend-to an NA dance! -but when we think about how many times we lied before about where we were going and always used drugs wherever we went, it may help us see that our parents can't help treating us with mistrust and that we may have to spend more time earning their trust. Or we may have been selfish and withdrawn with some of our friends day after day, week after week; then when we needed them and they weren't available, we became angry and resentful. Reminding ourselves that we engineered much of our own misery may help us forgive those who hurt us. Another way we may find forgiveness for those who hurt us is by getting out of ourselves and thinking about what other people's lives are like. Maybe the people who hurt us did so because they had problems that made them less sensitive to the needs of others. Maybe our sponsor didn't return our phone calls for a week because his youngest child was in jail. Maybe our best friend told us our relationship was unhealthy and we should get out of it-immediately following her own divorce. Maybe our employer didn't praise our work because he was worried about being able to meet payroll that week. We usually feel petty and small when we find out that a person we resented had some painful problem. Maybe we can be more forgiving and loving if we just assume from the start that most people's intentions are good and that if someone is unkind to us, it may be because he or she is in a lot of pain and very distracted by it. First and foremost, preparing ourselves spiritually to make amends requires that we tap into our Higher Power's strength and love. Contemplating a loving God's forgiveness of the times when we hurt people will help us approach people with an attitude of love and forgiveness. Using our Higher Power as a sort of protective force will ensure that negative reactions to our amends don't cause us to lose hope. We can center ourselves by praying and meditating before each amends.", "count": 4}, {"name": "Making Amends", "reading": "Now we're ready to make our amends. We've discussed each person or institution on our Eighth Step list with our sponsor and made a plan for how we would go about making each amends. We've talked to the God of our understanding, and we've prayed for the willingness, serenity, courage, and wisdom to go through with our amends. Now we need to follow through with our amends. We need to continue amending our behavior, and we need to keep whatever commitments we've made to the people on our amends list. This is where it can get difficult. When we first make an amends, we're usually feeling as if we could float away on a cloud of freedom. We feel a heightened sense of self-respect and the initial euphoria that comes along with the disappearance of a large chunk of remorse. We feel like good people, like we're on equal footing with the rest of humanity. This feeling is extremely powerful, and if it's our first time feeling it, it might seem like more than we can handle. We shouldn't worry. The feelings won't be so intense for long, though there will be some permanent change in our feelings about ourselves. After the first glow of making amends fades, we'll face the truly challenging part of making amends: the follow-through. For instance, a year after we approach a lending institution to which we owe money and promise to pay back a certain amount every month, we may not find it \"spiritually inspiring\" to hand over a portion of every hard-earned paycheck, especially if we're going to be making the same payment for several more years. Asking ourselves one simple question should help us continue with our amends: How free do we want to be? To continue with all aspects of our recovery, making amends included, makes our freedom grow day by day.", "count": 4}, {"name": "Spiritual Principles", "reading": "In the Ninth Step, we will focus on humility, love, and forgiveness. The humility we've gained in this step has resulted from getting a good look at the damage we did to others and accepting responsibility for it. We acknowledge to ourselves, \"Yes, this is what I've done. I'm responsible for the harm I caused and for making it right.\" We may have been led to this awareness by the experience of having someone tearfully tell us how much we hurt them. We may have found ourselves on the receiving end of some hurt we had inflicted on someone else, and been so jarred by such an experience that we were able to see on a deeper level how we hurt people. Then again, it may have been only the process of the previous steps, coupled with the experience of making amends that led us to experience increased humility.", "count": 2}, {"name": "Moving On", "reading": "Many of us find it helpful to reflect on our amends after making each one. Some of us do this by writing about how it felt to make the amends and what we learned from the experience.", "count": 6}];
const QUESTIONS=[{"sectionIndex": 0, "text": "How has my work on the previous eight steps prepared me to work the Ninth Step? How does honesty help in working this step?"}, {"sectionIndex": 0, "text": "How does humility help in working this step?"}, {"sectionIndex": 1, "text": "What does \"making amends\" mean?"}, {"sectionIndex": 1, "text": "Why does making amends mean that I have to do more than say \"I'm sorry\"?"}, {"sectionIndex": 1, "text": "How is making amends a commitment to a continuous process of change?"}, {"sectionIndex": 2, "text": "What fears do I have about making amends? Am I worried that someone will take revenge or reject me?"}, {"sectionIndex": 2, "text": "How does the Ninth Step require a new level of surrender to the program?"}, {"sectionIndex": 2, "text": "What about financial amends? Do I have faith that the God of my understanding will ensure I have what I need even though I am sacrificing to make amends?"}, {"sectionIndex": 2, "text": "What other fears or expectations do I have about my amends?"}, {"sectionIndex": 2, "text": "Why doesn't it matter how my amends are received? What does this have to do with the spiritual purpose of the Ninth Step?"}, {"sectionIndex": 2, "text": "How can I use other addicts, my sponsor, and my Higher Power as sources of strength in this process?"}, {"sectionIndex": 3, "text": "Which names on my Eighth Step list are complicated by circumstances like the ones above?"}, {"sectionIndex": 3, "text": "What were the specific circumstances? A problem that presents difficulty for many of us is that we owe amends that will likely result in us losing our jobs, going to jail, or some other serious consequence. For instance, if we turn ourselves in for a crime we committed, we may indeed go to jail. So what effect would that have on our lives? Would we lose our job? Would that compromise anyone’s security besides our own-say, our family's? On the other hand, if we are a fugitive from justice, what effect might a sudden arrest have on our lives and our families?"}, {"sectionIndex": 3, "text": "Do I owe any amends that might have serious consequences if I made them? What are they?"}, {"sectionIndex": 3, "text": "Do I owe amends to anyone who is dead? What was special about that person that I might be able to use in planning my amends? We've been emphasizing the need to check each and every amends with our sponsor before proceeding. While important, there's no need for us to become mindless robots, afraid to think for ourselves or act without asking our sponsor about it. Many of our members have had the experience of running into a person from our past who we had not put on our Eighth Step list, but might belong there. Sometimes the amends owed are so clear, we would be foolish not to avail ourselves of such a lucky coincidence. Other times, we may run into a person and experience very uncomfortable feelings but not know what's causing them. If this happens, it's better to take the relationship through the Fourth and Fifth Step process in order to gain more clarity about it. In any event, we should never consider our Eighth Step list \"closed.\" Chances are we'll be adding new names to it throughout our lives. What about people we can't find? Should we go ahead and make indirect amends to them, too? Perhaps, although many of our members have had the experience of running across someone we thought we'd never be able to find, usually in a location in which we'd never expect to find them. We can certainly draw the conclusion that a Higher Power is at work when such coincidences happen, but even if not, we certainly shouldn't ignore the opportunity to make direct amends. If we can't find someone on our amends list, we may want to wait. We should continue making every effort to find the person, we should make an effort not to cause the same type of harm to someone else, and we should remain willing. A spirit of willingness can often serve the purpose of the amends when we cannot make the actual amends. After considering the complications involved in making indirect amends, it may seem as though making direct amends is easy, or at least more straightforward. We did something that hurt someone. We need to apologize and repair the harm. That's it, right?"}, {"sectionIndex": 4, "text": "What behavior do I need to amend? What about those direct amends, the ones we make when we sit someone down, acknowledge and accept responsibility for the harm we caused, and accept whatever response we get?"}, {"sectionIndex": 4, "text": "Am I spiritually prepared for making any difficult amends and dealing with the results?"}, {"sectionIndex": 4, "text": "What have I done to prepare myself?"}, {"sectionIndex": 4, "text": "Do I owe amends to people who have also harmed me?"}, {"sectionIndex": 5, "text": "Have I forgiven them all? Which ones have I not forgiven yet? Have I tried all of the above ways of generating a spirit of forgiveness? What does my sponsor say about it?"}, {"sectionIndex": 5, "text": "Are there amends with which I'm having trouble following through? What am I doing to recommit myself to making these amends?"}, {"sectionIndex": 6, "text": "What are my immediate plans for making amends to myself? Do I have any long-range goals that might also fit as amends to myself? What are they? What can I do to follow through?"}, {"sectionIndex": 6, "text": "Have I accepted responsibility for the harm I caused and for repairing that harm?"}, {"sectionIndex": 6, "text": "What experiences have I had that led me to see the harm I caused more clearly? How has that contributed to an increase in my humility?"}, {"sectionIndex": 6, "text": "How am I giving of myself or being of service to others?"}, {"sectionIndex": 6, "text": "What are the benefits to me of practicing the principle of forgiveness? What are some situations in which I've been able to practice this principle?"}, {"sectionIndex": 6, "text": "For what have I forgiven myself?"}, {"sectionIndex": 7, "text": "How did it feel to make this amends? What did I learn from it?"}];
const PREFIX="step-nine-v1-";
const STATE="step-nine-v1-resume-state";
let mode="intro",si=0,qi=0;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function cleanReading(s){return s.replace(/\s+/g," ").trim();}
function saveAnswer(){const a=document.getElementById("answer");if(a)localStorage.setItem(PREFIX+qi,a.value)}
function getState(){try{return JSON.parse(localStorage.getItem(STATE)||"null")}catch(e){return null}}
function saveState(){localStorage.setItem(STATE,JSON.stringify({mode:mode,si:si,qi:qi}))}
function hasAnswers(){return QUESTIONS.some((_,i)=>localStorage.getItem(PREFIX+i))}
function update(){document.getElementById("bar").style.width=(mode==="intro"?0:mode==="reading"?((si)/SECTIONS.length*100):((qi+1)/QUESTIONS.length*100))+"%";}

function getResumeState(){
 try{
   const raw=localStorage.getItem(STATE);
   return raw ? JSON.parse(raw) : null;
 }catch(e){ return null; }
}
function saveResumeState(){
 if(mode==="question" || mode==="reading"){
   localStorage.setItem(STATE,JSON.stringify({mode:mode,si:si,qi:qi}));
 }
}
function toc(){
 mode="toc";
 main.innerHTML='<div class="eyebrow">Narcotics Anonymous</div><h1>Table of Contents</h1>'+
   '<div class="card"><div class="reading">Choose a step to begin or continue your work. You can return here at any time.</div></div>'+
   '<div id="tocList"></div>';
 const list=document.getElementById("tocList");
 const steps=["One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve"];
 steps.forEach(function(name,idx){
   const n=idx+1;
   const b=document.createElement("button");
   b.textContent="Step "+name;
   b.style.cssText="display:block;width:100%;text-align:left;margin:10px 0;padding:16px 18px;font-size:17px";
   b.onclick=function(){window.location.href="NA_Step_"+n+"_WORKING_COPY.html"};
   list.appendChild(b);
 });
 back.disabled=true;
 next.textContent="Begin Step Nine →";
 update();
}
function intro(){
 mode="intro";
  document.querySelector("header .sub").textContent="Step Nine";
  document.title="An Interactive Working Guide to the 12 Steps of NA — Step Nine";
 const saved=getResumeState();
 let resumeText="";
 if(saved && saved.mode!=="intro"){
   if(saved.mode==="question"){
     const q=QUESTIONS[saved.qi];
     const first=QUESTIONS.findIndex(x=>x.sectionIndex===saved.si); resumeText=SECTIONS[q.sectionIndex].name+" — Question "+(saved.qi-first+1)+" of "+SECTIONS[q.sectionIndex].count;
   } else {
     resumeText=SECTIONS[saved.si].name+" — Reading";
   }
 }
 main.innerHTML=
   '<div class="eyebrow">Step 9</div><h1>Step 9</h1>'+
   '<div class="card"><div class="reading">'+esc(cleanReading(INTRO))+'</div></div>'+
   (resumeText?
     '<div class="resume" style="border:1px solid #ddd;border-radius:14px;padding:16px;background:#fafafa;margin:18px 0">'+
       '<div class="eyebrow">Continue Where You Left Off</div>'+
       '<div style="font-size:17px;line-height:1.4;margin-bottom:12px">'+esc(resumeText)+'</div>'+
       '<button id="continue">Continue Step 9 →</button>'+
     '</div>':'');
 if(saved && resumeText){
   document.getElementById("continue").onclick=function(){
     mode=saved.mode; si=saved.si; qi=saved.qi; render();
   };
 }
 back.disabled=true;
 next.textContent=resumeText?"Restart Step 9":"Begin Step 9 →";
 update();
}
function reading(){
 mode="reading";saveResumeState();const s=SECTIONS[si];
 main.innerHTML='<div class="eyebrow">Section '+(si+1)+' of '+SECTIONS.length+'</div><h1>'+esc(s.name)+'</h1><div class="card"><div class="reading">'+esc(cleanReading(s.reading))+'</div></div><button id="begin">Begin this section’s questions →</button>';
 document.getElementById("begin").onclick=function(){qi=QUESTIONS.findIndex(q=>q.sectionIndex===si);mode="question";render()};
 back.disabled=si===0;next.textContent="Questions →";update();
}
function question(){
 mode="question";saveResumeState();const q=QUESTIONS[qi],ans=localStorage.getItem(PREFIX+qi)||"";
 const sec=SECTIONS[q.sectionIndex]; const first=QUESTIONS.findIndex(x=>x.sectionIndex===q.sectionIndex); const num=qi-first+1; main.innerHTML='<div class="eyebrow">'+esc(sec.name)+' • Question '+num+' of '+sec.count+'</div><div class="question">• '+esc(q.text)+'</div><textarea id="answer" placeholder="Type your answer here...">'+esc(ans)+'</textarea><div class="status">Saved automatically on this device.</div>';
 const a=document.getElementById("answer");a.addEventListener("input",function(){localStorage.setItem(PREFIX+qi,a.value);saveState()});
 back.disabled=qi===0;next.textContent=qi===QUESTIONS.length-1?"Finish Step 9":"Save & Next →";update();
}
function render(){
  if(mode==="welcome")welcome();
  else if(mode==="toc")toc();
  else if(mode==="intro")intro();
  else if(mode==="reading")reading();
  else question();
  saveResumeState();
  update();
}
home.onclick=function(){if(mode==="question")saveAnswer();mode="intro";render()};
back.onclick=function(){
 if(mode==="question"){saveAnswer();const current=QUESTIONS[qi].sectionIndex,first=QUESTIONS.findIndex(q=>q.sectionIndex===current);if(qi===first){si=current;mode="reading"}else qi--;render()}
 else if(mode==="reading"){if(si===0)mode="intro";else si--;render()}
 else if(mode==="toc"){mode="welcome";render()}
};
next.onclick=function(){
  if(mode==="intro"){
   const saved=getResumeState();
   if(saved && next.textContent==="Restart Step 9"){
     if(confirm("Restart Step 9? Your saved answers will remain on this device.")){
       si=0;qi=0;mode="reading";render();
     }
   }else{
     si=0;qi=0;mode="reading";render();
   }
   return;
}
 if(mode==="reading"){qi=QUESTIONS.findIndex(q=>q.sectionIndex===si);mode="question";render();return}
 saveAnswer();
 if(qi<QUESTIONS.length-1){const old=QUESTIONS[qi].sectionIndex;qi++;if(QUESTIONS[qi].sectionIndex!==old){si=QUESTIONS[qi].sectionIndex;mode="reading"}render()}
 else{alert("Step 9 is complete. Your answers remain saved on this device. Moving to Step 10.");window.location.href="NA_Step_10_WORKING_COPY.html"}
};
render();
</script>
<script>
(function(){
  function reviewAnswers(){
    var overlay=document.createElement("div");
    overlay.id="reviewOverlay";
    overlay.style.cssText="position:fixed;inset:0;background:#fff;z-index:99999;overflow:auto;padding:22px 18px 110px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202124";

    var close=document.createElement("button");
    close.textContent="← Home";
    close.className="secondary";
    close.onclick=function(){overlay.remove()};
    overlay.appendChild(close);

    var h=document.createElement("h1");
    h.textContent="Step 9 — Review My Answers";
    overlay.appendChild(h);

    // Review / Share tabs for the Review My Answers page.
    var tabBar=document.createElement("div");
    tabBar.style.cssText="display:flex;gap:8px;margin:14px 0 20px;border-bottom:1px solid #ddd;padding-bottom:10px";
    var reviewTab=document.createElement("button");
    reviewTab.textContent="Review My Answers";
    reviewTab.className="secondary";
    var shareTab=document.createElement("button");
    shareTab.textContent="Share";
    shareTab.className="secondary";
    tabBar.appendChild(reviewTab); tabBar.appendChild(shareTab);
    overlay.appendChild(tabBar);

    var reviewContent=document.createElement("div");
    overlay.appendChild(reviewContent);

    var shareContent=document.createElement("div");
    shareContent.style.display="none";
    shareContent.className="card";
    var shareTitle=document.createElement("h2");
    shareTitle.textContent="Share Step 9 — My Review Answers";
    shareContent.appendChild(shareTitle);
    var shareIntro=document.createElement("p");
    shareIntro.textContent="Choose how you would like to share your saved answers with your sponsor or another person.";
    shareContent.appendChild(shareIntro);
    var shareButtons=document.createElement("div");
    shareButtons.style.cssText="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px";
    var emailBtn=document.createElement("button"); emailBtn.textContent="Email";
    var textBtn=document.createElement("button"); textBtn.textContent="Text Message";
    var clipBtn=document.createElement("button"); clipBtn.textContent="Copy to Clipboard";
    shareButtons.appendChild(emailBtn); shareButtons.appendChild(textBtn); shareButtons.appendChild(clipBtn);
    shareContent.appendChild(shareButtons);
    var shareStatus=document.createElement("div");
    shareStatus.style.cssText="margin-top:12px;color:#666";
    shareContent.appendChild(shareStatus);
    overlay.appendChild(shareContent);

    function buildReviewShareText(){
      var lines=["An Interactive Working Guide to the 12 Steps of NA","Step 9 — My Review Answers",""];
      var has=false;
      SECTIONS.forEach(function(section,si){
        var sectionHas=false;
        var sectionLines=[];
        QUESTIONS.forEach(function(q,index){
          if(q.sectionIndex===si){
            var a=localStorage.getItem(PREFIX+index)||"";
            if(a.trim()!==""){
              has=true; sectionHas=true;
              sectionLines.push("• "+q.text);
              sectionLines.push("My Answer:");
              sectionLines.push(a.trim());
              sectionLines.push("");
            }
          }
        });
        if(sectionHas){ lines.push(section.name.toUpperCase()); lines.push(""); lines=lines.concat(sectionLines); }
      });
      if(!has) lines.push("No answers have been saved yet.");
      return lines.join("\n").trim();
    }

    reviewTab.onclick=function(){ reviewContent.style.display="block"; shareContent.style.display="none"; };
    shareTab.onclick=function(){ reviewContent.style.display="none"; shareContent.style.display="block"; };

    textBtn.onclick=function(){ window.location.href="sms:?&body="+encodeURIComponent(buildReviewShareText()); };
    clipBtn.onclick=function(){
      var txt=buildReviewShareText();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){shareStatus.textContent="Your review answers have been copied to the clipboard.";}).catch(function(){shareStatus.textContent="Clipboard access was not available on this device.";});
      } else {
        var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.left="-9999px"; document.body.appendChild(ta); ta.select();
        try{document.execCommand("copy"); shareStatus.textContent="Your review answers have been copied to the clipboard.";}catch(e){shareStatus.textContent="Clipboard access was not available on this device.";}
        document.body.removeChild(ta);

    var found=false;

          reviewContent.appendChild(card);
        });
      }
    });

    if(!found){

    }

  var observer=new MutationObserver(function(){addButton()});

<script>
(function(){
  
  function restoreAnswers(file){
    if(!file){
      alert("No backup file was selected.");
      return;
    }

    var reader=new FileReader();

    reader.onerror=function(){
      alert("Safari could not read that backup file.");
    };

    reader.onload=function(){
      try{
        var data=JSON.parse(reader.result);

        if(!data || !data.answers || typeof data.answers!=="object"){
          throw new Error("Invalid backup format");
        }

        var restored=0;
        if(data.notes && typeof data.notes==="object"){
          Object.keys(data.notes).forEach(function(si){
            if(typeof SECTIONS!=="undefined" && SECTIONS[Number(si)]){
              localStorage.setItem(NOTES_PREFIX+si,String(data.notes[si]||""));
            }
          });
        }

        Object.keys(data.answers).forEach(function(index){
          var n=Number(index);
          if(Number.isInteger(n) && typeof QUESTIONS!=="undefined" && QUESTIONS[n]){
            localStorage.setItem(PREFIX+n,String(data.answers[index]));
            restored++;
          }
        });

        if(restored===0){
          throw new Error("No matching answers");
        }

        alert(restored+" saved answer"+(restored===1?"":"s")+" restored.");
        if(typeof render==="function") render();

      }catch(e){
        alert("That file could not be restored. Please choose a Step 9 backup file created by this app.");
      }
    };

    reader.readAsText(file);
  }
  function addBackupButtons(){
    if(typeof mode==="undefined" || mode!=="intro") return;
    var nextButton=document.getElementById("next");
    if(!nextButton) return;


    if(!document.getElementById("restoreAnswersWrap")){
      var wrap=document.createElement("div");
      wrap.id="restoreAnswersWrap";
      wrap.style.cssText="margin-top:8px";

      var label=document.createElement("label");
      label.className="secondary";
      label.textContent="Restore My Answers";
      label.style.cssText="display:inline-block;cursor:pointer";

      var input=document.createElement("input");
      input.type="file";
      input.accept=".json,application/json,text/plain";
      input.style.cssText="display:block;margin-top:8px;max-width:100%";
      input.onchange=function(){
        if(input.files && input.files.length){
          restoreAnswers(input.files[0]);
        }
      };

      wrap.appendChild(label);
      wrap.appendChild(input);
      nextButton.parentNode.insertBefore(wrap,nextButton);
    }
  }
  var observer=new MutationObserver(function(){addBackupButtons()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addBackupButtons,100);
})();
</script>


<script>
(function(){
  function addCompletionSystem(){
    if(typeof SECTIONS==="undefined" || typeof QUESTIONS==="undefined") return;

    function sectionStats(si){
      var answered=0,total=0;
      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex===si){
          total++;
          if((localStorage.getItem(PREFIX+index)||"").trim()!=="") answered++;
        }
      });
      return {answered:answered,total:total,complete:total>0 && answered===total};
    }

    // Enhance the existing My Progress overlay after it is opened.
    var originalShowProgress=window.showProgress;
    if(typeof originalShowProgress!=="function" || originalShowProgress.__completionEnhanced) return;

    function enhancedProgress(){
      originalShowProgress();

      setTimeout(function(){
        var overlay=document.getElementById("progressOverlay");
        if(!overlay) return;

        var cards=overlay.querySelectorAll(".card");
        var sectionCards=[];
        cards.forEach(function(card){
          var title=card.querySelector("div");
          if(title && title.textContent && title.textContent!=="Overall Progress"){
            sectionCards.push(card);
          }
        });

        SECTIONS.forEach(function(section,si){
          var stats=sectionStats(si);
          var card=sectionCards[si];
          if(!card) return;

          var badge=card.querySelector(".completionBadge");
          if(!badge){
            badge=document.createElement("div");
            badge.className="completionBadge";
            badge.style.cssText="font-size:12px;font-weight:750;letter-spacing:.07em;margin-top:9px";
            card.appendChild(badge);
          }

          if(stats.complete){
            badge.textContent="✓ COMPLETED";
            badge.style.color="#2f6b3f";
          }else if(stats.answered>0){
            badge.textContent="IN PROGRESS";
            badge.style.color="#666";
          }else{
            badge.textContent="NOT STARTED";
            badge.style.color="#999";
          }
        });

        var allComplete=SECTIONS.every(function(_,si){return sectionStats(si).complete;});
        if(allComplete){
          var done=document.createElement("div");
          done.className="card";
          done.style.marginTop="18px";
          done.innerHTML="<strong>✓ STEP NINE COMPLETED</strong><div style='margin-top:8px;font-size:16px;line-height:1.5'>You have answered every Step 9 question.</div>";
          overlay.appendChild(done);
        }
      },0);
    }

    enhancedProgress.__completionEnhanced=true;
    window.showProgress=enhancedProgress;
  }

  var observer=new MutationObserver(function(){addCompletionSystem()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addCompletionSystem,100);
})();
</script>

<script>
function getStepReviewText() {
  const step = 9;
  let lines = [];
  lines.push("An Interactive Working Guide to the 12 Steps of NA");
  lines.push("Step " + step + " — My Review Answers");
  lines.push("");
  const root = document.body;
  // Collect visible question/answer pairs from the current Step 9 review.
  // Prefer review containers and textarea/input values, while avoiding navigation controls.
  const fields = Array.from(root.querySelectorAll("textarea, input[type='text'], input:not([type])"));
  let q = 0;
  fields.forEach(el => {
    if (!el.offsetParent) return;
    const value = (el.value || "").trim();
    if (!value) return;
    const prev = el.closest(".question, .q, .card, .section, div");
    let label = "";
    if (prev) {
      const heading = prev.querySelector("h1,h2,h3,h4,strong,label");
      if (heading) label = heading.textContent.trim();
    }
    if (!label) {
      q++;
      label = "Answer " + q;
    }
    lines.push(label + ":");
    lines.push(value);
    lines.push("");
  });
  // If the review page has generated text, include it as a fallback.
  if (lines.length <= 4) {
    const review = document.querySelector("#review, .review, [id*='review']");
    if (review) {
      const clone = review.cloneNode(true);
      clone.querySelectorAll("button, script, style").forEach(x => x.remove());
      const body = clone.innerText.trim();
      if (body) lines.push(body);
    }
  }
  return lines.join("\n").trim();
}

function shareReview() {
  const panel = document.getElementById("sharePanel");
  if (panel) panel.classList.toggle("show");
}

function shareByEmail() {
  const body = encodeURIComponent(getStepReviewText());
  window.location.href = "mailto:?subject=" + encodeURIComponent("NA Step 9 — My Review Answers") + "&body=" + body;
}

function shareByText() {
  const body = encodeURIComponent(getStepReviewText());
  // sms: works across common iOS/Android configurations; the user selects the recipient.
  window.location.href = "sms:?&body=" + body;
}

async function copyReviewToClipboard() {
  const text = getStepReviewText();
  try {
    await navigator.clipboard.writeText(text);
    const status = document.getElementById("shareStatus");
    if (status) status.textContent = "Review answers copied to the clipboard.";
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      const status = document.getElementById("shareStatus");
      if (status) status.textContent = "Review answers copied to the clipboard.";
    } finally {
      document.body.removeChild(ta);
    }
  }
}
</script>
