<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff"><title>An Interactive Working Guide to the 12 Steps of NA — Step 11</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}header{position:sticky;top:0;z-index:5;background:#fffffff5;backdrop-filter:blur(10px);border-bottom:1px solid #ddd;padding:14px 18px}
.title{font-size:22px;font-weight:750}.sub{font-size:13px;color:#666;margin-top:2px}.progress{height:4px;background:#eee}.bar{height:100%;background:#444;width:0;transition:.2s}
main{padding:22px 18px 120px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#666;font-weight:750;margin-bottom:8px}
h1{font-size:29px;line-height:1.18;margin:0 0 18px}.reading{font-size:17px;line-height:1.68;white-space:pre-line;color:#303238}
.card{background:#fafafa;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:20px}
.question{font-size:21px;line-height:1.45;font-weight:650;margin:12px 0 18px}textarea{width:100%;min-height:300px;border:1px solid #aaa;border-radius:12px;padding:15px;font:17px/1.5 inherit;resize:vertical;outline:none}
textarea:focus{border-color:#333;box-shadow:0 0 0 3px #0001}button{border:0;border-radius:10px;padding:12px 15px;background:#222;color:#fff;font-size:15px;cursor:pointer}
button.secondary{background:#e8e9ec;color:#222}button:disabled{opacity:.35;cursor:default}.bottom{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fffffff8;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.status{font-size:12px;color:#666;margin-top:8px}.resume{border:1px solid #ddd;border-radius:14px;padding:16px;background:#fafafa;margin:18px 0}

.share-panel{display:none;margin-top:16px;padding:16px;border:1px solid #ddd;border-radius:12px;background:#fafafa}
.share-panel.show{display:block}
.share-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.share-actions button{min-width:150px}
.share-status{margin-top:10px;font-size:.92rem;color:#555}
</style></head><body><div class="app">
<header><div class="title">An Interactive Working Guide to the 12 Steps of NA</div><div class="sub"></div></header>
<div class="progress"><div id="bar" class="bar"></div></div><main id="main"></main>
<div class="bottom"><button id="home" class="secondary">Home</button><button id="back" class="secondary">← Back</button><button id="next">Begin Step 11 →</button></div>
</div>
<script>
const INTRO="\"We sought through prayer and meditation to improve our conscious contact with God as we understood Him, praying only for knowledge of His will for us and the power to carry that out.\" Step Eleven says that we already have a conscious contact with the God of our understanding, and that the task before us now is to improve that contact. We began to develop our conscious awareness of a Higher Power in Step Two, learned to trust that Power for guidance in Step Three, and relied on that Power many times for many other reasons in the process of working through the steps. Each time we called upon our Higher Power for help, we improved our relationship with our Higher Power. Step Eleven recognizes that reaching out to the God of our understanding, referred to most simply as prayer, is one of the most effective means for building a relationship with God. The other means put forth in this step is meditation. In this step, we will need to explore our own concepts of prayer and meditation, and make sure they reflect our spiritual path.";
const SECTIONS=[{"name": "Our Own Spiritual Path", "reading": "The Eleventh Step allows us the opportunity to find our own spiritual path, or further refine our path if we've already embarked on one. The steps we take toward finding or refining our path, and the way we walk down it, will depend to a large degree on the culture in which we live, previous experiences with spirituality, and what best suits our personal nature. Our spirituality has been developing since we first came to NA. We are constantly changing, and so is our spirituality. New territory, new people, and new situations have their effect on us, and our spirituality needs to respond. Exploring our spirituality in the Eleventh Step is a wonderful and illuminating experience. We will be exposed to many new ideas, and we'll find that many of these new ideas come directly from our own knowledge of spiritual matters. Because we've developed a frame of reference about spirituality in the previous ten steps, we find that our insight has grown along with our capacity to comprehend new information about ourselves and our world. Spiritual exploration is wide open, and we will learn and find personal truths both in our concentrated efforts to understand more and in the most mundane details of our lives. Many of us find that when we get to NA, we really need to \"change Gods.\" Some of us believed in something we vaguely referred to as \"God,\" but we didn't really understand anything about it, except that it seemed to be out to get us. We probably did some work in Steps Two and Three aimed at uncovering unhealthy ideas about our Higher Power, and then we tried to form some new ideas that allowed for a loving, caring Higher Power. For many of us, simply believing that we had a Higher Power that cared about us as individuals was enough to get us through the following steps. We didn't feel any need to develop our ideas any further. But our ideas were developing anyway, even without our conscious effort. Each specific experience with working the steps provided us with clues about the nature of our Higher Power. We sensed truths about our Higher Power rather than understanding them intellectually. The moment we sat down with our sponsor to share our Fifth Step, many of us were suddenly filled with a quiet certainty that we could trust our sponsor, trust this process, and go forward; this was a moment in which many of us felt the presence of our Higher Power. This, along with the work we did in Steps Eight and Nine, implanted in many of us a growing awareness of our Higher Power's will for us.", "count": 9}, {"name": "Prayer and Meditation", "reading": "Members of NA often describe prayer as talking to God, and meditation as listening to God. This description has been part of the collective wisdom of NA for a long time because it captures the distinct meanings of prayer and meditation so well. We are building a relationship with our Higher Power, and we need to have a dialogue with that Power, not merely a monologue aimed in its direction. Prayer is talking to our Higher Power, though not always in the form of actual speech. We worked on developing a form of prayer that felt right to us in the Second Step. We may find by now that we've further refined our approach to prayer to fit with our spiritual path. One of the forms of prayer in which virtually every NA member engages is the closing or opening prayer said at most NA meetings. Ultimately, the manner in which we pray is up to us as individuals. How often should we pray? Many of us set aside a specific time in our day - the beginning is fairly common-to pray. These prayers usually involve asking our Higher Power for another day clean or, as we will explore more fully later in this chapter, knowledge of God's will for us. When we communicate with our Higher Power at the end of our day, it is usually to express gratitude. Many of us try to incorporate prayer throughout our day. It is very good practice to pray regularly. It helps us form a habit of communicating with our Higher Power that may save our recovery some day.", "count": 8}, {"name": "Conscious Contact", "reading": "To many of us, \"conscious contact\" sounds like something very mysterious, implying some kind of cosmic union with God. But it's really very simple. It just means that we have a conscious awareness of our link to a Higher Power. We notice the presence of that Power, and see some of the ways it works in our life. There are so many ways our members have experienced the presence of a loving God: when we experience something in nature, such as a forest or an ocean; through the unconditional love of our sponsor or other NA members; through the feeling of being anchored during difficult times; through feelings of peace and warmth; through a coincidence that later on we see having led to some great good; through the simple fact of our recovery in NA; through our ability to listen to others at a meeting; and countless other means. The point is that we are looking, and we are willing to acknowledge that our Higher Power is active in our lives.", "count": 2}, {"name": "The Power to Carry That Out", "reading": "In addition to praying for knowledge of God's will for us, we're also asking for the power to carry out that will. In this context, power doesn't refer only to forceful qualities. There are many different qualities we may need to carry out our Higher Power's will: humility, a sense of compassion, honesty, integrity, or an ability to persevere and the patience to wait for results over a long period. A strong sense of justice and an ability to be assertive might be what's called for in a certain situation. Sometimes eagerness is required, and other times only a sense of caution will do. Courage and fortitude are qualities that we will often be called upon to display. Sometimes, the best quality to promote God's will is a sense of humor. Most likely we will need all of these qualities at various times in our lives. When we pray for the power to carry out God's will for us, we probably won't know exactly what qualities we need. We have to trust that the ones we need will be provided. It may be tempting for us to demand from our Higher Power the things we think we need, but we usually can't see the \"big picture\" or the long-term effects of something that seems very reasonable at the moment.", "count": 4}, {"name": "Spiritual Principles", "reading": "In the Eleventh Step, we will focus on commitment, humility, courage, and faith. We need to make a commitment to the practice of regular prayer and meditation. Many of us find that our first experiences with prayer and meditation have us feeling kind of silly. We glance around the room to see if anyone is looking, and wonder just what we're supposed to be feeling, anyway. As we continue with our commitment, this feeling will pass, as will the consuming feelings of frustration when the results aren't what we expect, and the boredom that sets in when the things we're doing become routine. The point is that we need to continue, no matter how we feel about it. The long-term results of peace of mind and a deeper relationship with our Higher Power are worth waiting for.", "count": 5}, {"name": "Moving On", "reading": "Our practices in this step show up in every area of our lives. From the regular practice of meditation, we may notice that we are able to listen more attentively to what others have to say in meetings. We have some experience with quieting our minds and so are able to do so in many places. We no longer find ourselves so consumed with planning what we'll say when it's our turn that we are unable to listen to others. We begin to be satisfied with our lives. We no longer feel such an urgency to control things. We're focused on a higher purpose instead of on ourselves. Our regrets begin to disappear. Our active addiction no longer seems like such a tragedy and a waste as we see how we can use that experience to serve a higher purpose: carrying the message to the addict who still suffers. In", "count": 0}];
const QUESTIONS=[{"sectionIndex": 0, "text": "What experiences have I had with the previous steps or elsewhere in life that gave me some inkling of what my Higher Power is like? What did I come to understand about my Higher Power from those experiences?"}, {"sectionIndex": 0, "text": "What qualities does my Higher Power have? Can I use those qualities for myself-can I experience their transformative power in my life?"}, {"sectionIndex": 0, "text": "How has my understanding of a Higher Power changed since coming to NA?"}, {"sectionIndex": 0, "text": "Do I have a specific spiritual path?"}, {"sectionIndex": 0, "text": "What are the differences between religion and spirituality? What have I done to explore my own spirituality?"}, {"sectionIndex": 0, "text": "Have I encountered any prejudice in Narcotics Anonymous while exploring my spirituality? How did that make me feel? What have I done to adhere to my beliefs?"}, {"sectionIndex": 0, "text": "No matter what spiritual path I am following, am I still keeping up my involvement with NA?"}, {"sectionIndex": 0, "text": "How does my involvement in NA complement my spiritual journey?"}, {"sectionIndex": 0, "text": "How does my spiritual path contribute to my recovery?"}, {"sectionIndex": 1, "text": "How do I pray?"}, {"sectionIndex": 1, "text": "How do I feel about praying?"}, {"sectionIndex": 1, "text": "When do I usually pray? When I am hurting? When I want something? Regularly?"}, {"sectionIndex": 1, "text": "How is it helpful to use spontaneous prayer throughout the day? How does prayer help me put things in perspective?"}, {"sectionIndex": 1, "text": "How do I meditate?"}, {"sectionIndex": 1, "text": "When do I meditate?"}, {"sectionIndex": 1, "text": "How do I feel about meditating?"}, {"sectionIndex": 1, "text": "If I have been meditating consistently for some time, in what ways have I seen changes in myself or my life as a result of meditating?"}, {"sectionIndex": 2, "text": "In what circumstances do I notice the presence of my Higher Power? What do I feel?"}, {"sectionIndex": 2, "text": "What am I doing to improve my conscious contact with the God of my understanding?"}, {"sectionIndex": 3, "text": "What are some situations I can identify from my own life where I acted on self-will? What were the results?"}, {"sectionIndex": 3, "text": "What are some situations I can identify from my own life where I tried to align my will with God's will? What were the results?"}, {"sectionIndex": 3, "text": "What are some examples of how I live with purpose and dignity? What is my vision of God's will for me?"}, {"sectionIndex": 3, "text": "Why do we pray only for knowledge of God's will for us and the power to carry that out? How does humility apply to this?"}, {"sectionIndex": 4, "text": "How do I show my commitment to working the Eleventh Step and to my recovery?"}, {"sectionIndex": 4, "text": "Have I prayed and meditated today?"}, {"sectionIndex": 4, "text": "Have I ever prayed for a specific thing and then wished I didn't have it after all? Expand on this."}, {"sectionIndex": 4, "text": "Have I ever been faced with a situation that required me to stand up for my beliefs at some personal cost? How did I respond? What were the results?"}, {"sectionIndex": 4, "text": "Have I, so far, been given what I need? What have I received?"}];
const PREFIX="step-eleven-v1-";
const STATE="step-eleven-v1-resume-state";
let mode="intro",si=0,qi=0;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function cleanReading(s){return s.replace(/\s+/g," ").trim();}
function saveAnswer(){const a=document.getElementById("answer");if(a)localStorage.setItem(PREFIX+qi,a.value)}
function getState(){try{return JSON.parse(localStorage.getItem(STATE)||"null")}catch(e){return null}}
function saveState(){localStorage.setItem(STATE,JSON.stringify({mode:mode,si:si,qi:qi}))}
function hasAnswers(){return QUESTIONS.some((_,i)=>localStorage.getItem(PREFIX+i))}
function update(){document.getElementById("bar").style.width=(mode==="intro"?0:mode==="reading"?((si)/SECTIONS.length*100):((qi+1)/QUESTIONS.length*100))+"%";}

function getResumeState(){
 try{
   const raw=localStorage.getItem(STATE);
   return raw ? JSON.parse(raw) : null;
 }catch(e){ return null; }
}
function saveResumeState(){
 if(mode==="question" || mode==="reading"){
   localStorage.setItem(STATE,JSON.stringify({mode:mode,si:si,qi:qi}));
 }
}
function toc(){
 mode="toc";
 main.innerHTML='<div class="eyebrow">Narcotics Anonymous</div><h1>Table of Contents</h1>'+
   '<div class="card"><div class="reading">Choose a step to begin or continue your work. You can return here at any time.</div></div>'+
   '<div id="tocList"></div>';
 const list=document.getElementById("tocList");
 const steps=["One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve"];
 steps.forEach(function(name,idx){
   const n=idx+1;
   const b=document.createElement("button");
   b.textContent="Step "+name;
   b.style.cssText="display:block;width:100%;text-align:left;margin:10px 0;padding:16px 18px;font-size:17px";
   b.onclick=function(){window.location.href="NA_Step_"+n+"_WORKING_COPY.html"};
   list.appendChild(b);
 });
 back.disabled=true;
 next.textContent="Begin Step Eleven →";
 update();
}
function intro(){
 mode="intro";
  document.querySelector("header .sub").textContent="Step Eleven";
  document.title="An Interactive Working Guide to the 12 Steps of NA — Step Eleven";
 const saved=getResumeState();
 let resumeText="";
 if(saved && saved.mode!=="intro"){
   if(saved.mode==="question"){
     const q=QUESTIONS[saved.qi];
     const first=QUESTIONS.findIndex(x=>x.sectionIndex===saved.si); resumeText=SECTIONS[q.sectionIndex].name+" — Question "+(saved.qi-first+1)+" of "+SECTIONS[q.sectionIndex].count;
   } else {
     resumeText=SECTIONS[saved.si].name+" — Reading";
   }
 }
 main.innerHTML=
   '<div class="eyebrow">Step 11</div><h1>Step 11</h1>'+
   '<div class="card"><div class="reading">'+esc(cleanReading(INTRO))+'</div></div>'+
   (resumeText?
     '<div class="resume" style="border:1px solid #ddd;border-radius:14px;padding:16px;background:#fafafa;margin:18px 0">'+
       '<div class="eyebrow">Continue Where You Left Off</div>'+
       '<div style="font-size:17px;line-height:1.4;margin-bottom:12px">'+esc(resumeText)+'</div>'+
       '<button id="continue">Continue Step 11 →</button>'+
     '</div>':'');
 if(saved && resumeText){
   document.getElementById("continue").onclick=function(){
     mode=saved.mode; si=saved.si; qi=saved.qi; render();
   };
 }
 back.disabled=true;
 next.textContent=resumeText?"Restart Step 11":"Begin Step 11 →";
 update();
}
function reading(){
 mode="reading";saveResumeState();const s=SECTIONS[si];
 main.innerHTML='<div class="eyebrow">Section '+(si+1)+' of '+SECTIONS.length+'</div><h1>'+esc(s.name)+'</h1><div class="card"><div class="reading">'+esc(cleanReading(s.reading))+'</div></div><button id="begin">Begin this section’s questions →</button>';
 document.getElementById("begin").onclick=function(){qi=QUESTIONS.findIndex(q=>q.sectionIndex===si);mode="question";render()};
 back.disabled=si===0;next.textContent="Questions →";update();
}
function question(){
 mode="question";saveResumeState();const q=QUESTIONS[qi],ans=localStorage.getItem(PREFIX+qi)||"";
 const sec=SECTIONS[q.sectionIndex]; const first=QUESTIONS.findIndex(x=>x.sectionIndex===q.sectionIndex); const num=qi-first+1; main.innerHTML='<div class="eyebrow">'+esc(sec.name)+' • Question '+num+' of '+sec.count+'</div><div class="question">• '+esc(q.text)+'</div><textarea id="answer" placeholder="Type your answer here...">'+esc(ans)+'</textarea><div class="status">Saved automatically on this device.</div>';
 const a=document.getElementById("answer");a.addEventListener("input",function(){localStorage.setItem(PREFIX+qi,a.value);saveState()});
 back.disabled=qi===0;next.textContent=qi===QUESTIONS.length-1?"Finish Step 11":"Save & Next →";update();
}
function render(){
  if(mode==="welcome")welcome();
  else if(mode==="toc")toc();
  else if(mode==="intro")intro();
  else if(mode==="reading")reading();
  else question();
  saveResumeState();
  update();
}
home.onclick=function(){if(mode==="question")saveAnswer();mode="intro";render()};
back.onclick=function(){
 if(mode==="question"){saveAnswer();const current=QUESTIONS[qi].sectionIndex,first=QUESTIONS.findIndex(q=>q.sectionIndex===current);if(qi===first){si=current;mode="reading"}else qi--;render()}
 else if(mode==="reading"){if(si===0)mode="intro";else si--;render()}
 else if(mode==="toc"){mode="welcome";render()}
};
next.onclick=function(){
  if(mode==="intro"){
   const saved=getResumeState();
   if(saved && next.textContent==="Restart Step 11"){
     if(confirm("Restart Step 11? Your saved answers will remain on this device.")){
       si=0;qi=0;mode="reading";render();
     }
   }else{
     si=0;qi=0;mode="reading";render();
   }
   return;
}
 if(mode==="reading"){qi=QUESTIONS.findIndex(q=>q.sectionIndex===si);mode="question";render();return}
 saveAnswer();
 if(qi<QUESTIONS.length-1){const old=QUESTIONS[qi].sectionIndex;qi++;if(QUESTIONS[qi].sectionIndex!==old){si=QUESTIONS[qi].sectionIndex;mode="reading"}render()}
 else{alert("Step 11 is complete. Your answers remain saved on this device. Moving to Step 12.");window.location.href="NA_Step_12_WORKING_COPY.html"}
};
render();
</script>
<script>
(function(){
  function reviewAnswers(){
    var overlay=document.createElement("div");
    overlay.id="reviewOverlay";
    overlay.style.cssText="position:fixed;inset:0;background:#fff;z-index:99999;overflow:auto;padding:22px 18px 110px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202124";

    var close=document.createElement("button");
    close.textContent="← Home";
    close.className="secondary";
    close.onclick=function(){overlay.remove()};
    overlay.appendChild(close);

    var h=document.createElement("h1");
    h.textContent="Step 11 — Review My Answers";
    overlay.appendChild(h);

    // Review / Share tabs for the Review My Answers page.
    var tabBar=document.createElement("div");
    tabBar.style.cssText="display:flex;gap:8px;margin:14px 0 20px;border-bottom:1px solid #ddd;padding-bottom:10px";
    var reviewTab=document.createElement("button");
    reviewTab.textContent="Review My Answers";
    reviewTab.className="secondary";
    var shareTab=document.createElement("button");
    shareTab.textContent="Share";
    shareTab.className="secondary";
    tabBar.appendChild(reviewTab); tabBar.appendChild(shareTab);
    overlay.appendChild(tabBar);

    var reviewContent=document.createElement("div");
    overlay.appendChild(reviewContent);

    var shareContent=document.createElement("div");
    shareContent.style.display="none";
    shareContent.className="card";
    var shareTitle=document.createElement("h2");
    shareTitle.textContent="Share Step 11 — My Review Answers";
    shareContent.appendChild(shareTitle);
    var shareIntro=document.createElement("p");
    shareIntro.textContent="Choose how you would like to share your saved answers with your sponsor or another person.";
    shareContent.appendChild(shareIntro);
    var shareButtons=document.createElement("div");
    shareButtons.style.cssText="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px";
    var emailBtn=document.createElement("button"); emailBtn.textContent="Email";
    var textBtn=document.createElement("button"); textBtn.textContent="Text Message";
    var clipBtn=document.createElement("button"); clipBtn.textContent="Copy to Clipboard";
    shareButtons.appendChild(emailBtn); shareButtons.appendChild(textBtn); shareButtons.appendChild(clipBtn);
    shareContent.appendChild(shareButtons);
    var shareStatus=document.createElement("div");
    shareStatus.style.cssText="margin-top:12px;color:#666";
    shareContent.appendChild(shareStatus);
    overlay.appendChild(shareContent);

    function buildReviewShareText(){
      var lines=["An Interactive Working Guide to the 12 Steps of NA","Step 11 — My Review Answers",""];
      var has=false;
      SECTIONS.forEach(function(section,si){
        var sectionHas=false;
        var sectionLines=[];
        QUESTIONS.forEach(function(q,index){
          if(q.sectionIndex===si){
            var a=localStorage.getItem(PREFIX+index)||"";
            if(a.trim()!==""){
              has=true; sectionHas=true;
              sectionLines.push("• "+q.text);
              sectionLines.push("My Answer:");
              sectionLines.push(a.trim());
              sectionLines.push("");
            }
          }
        });
        if(sectionHas){ lines.push(section.name.toUpperCase()); lines.push(""); lines=lines.concat(sectionLines); }
      });
      if(!has) lines.push("No answers have been saved yet.");
      return lines.join("\n").trim();
    }

    reviewTab.onclick=function(){ reviewContent.style.display="block"; shareContent.style.display="none"; };
    shareTab.onclick=function(){ reviewContent.style.display="none"; shareContent.style.display="block"; };
    emailBtn.onclick=function(){ window.location.href="mailto:?subject="+encodeURIComponent("NA Step 11 — My Review Answers")+"&body="+encodeURIComponent(buildReviewShareText()); };
    textBtn.onclick=function(){ window.location.href="sms:?&body="+encodeURIComponent(buildReviewShareText()); };
    clipBtn.onclick=function(){
      var txt=buildReviewShareText();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){shareStatus.textContent="Your review answers have been copied to the clipboard.";}).catch(function(){shareStatus.textContent="Clipboard access was not available on this device.";});
      } else {
        var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.left="-9999px"; document.body.appendChild(ta); ta.select();
        try{document.execCommand("copy"); shareStatus.textContent="Your review answers have been copied to the clipboard.";}catch(e){shareStatus.textContent="Clipboard access was not available on this device.";}
        document.body.removeChild(ta);
      }
    };

    var found=false;

    SECTIONS.forEach(function(section,si){
      var answered=[];
      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex===si){
          var a=localStorage.getItem(PREFIX+index)||"";
          if(a.trim()!=="") answered.push({q:q,index:index,a:a});
        }
      });

      if(answered.length){
        found=true;
        var sh=document.createElement("div");
        sh.className="eyebrow";
        sh.style.marginTop="28px";
        sh.textContent=section.name;
        reviewContent.appendChild(sh);

        answered.forEach(function(item){
          var card=document.createElement("div");
          card.className="card";

          var q=document.createElement("div");
          q.className="question";
          q.textContent="• "+item.q.text;
          card.appendChild(q);

          var label=document.createElement("div");
          label.className="status";
          label.textContent="MY ANSWER";
          label.style.cssText="font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#666;font-weight:750;margin:10px 0 7px";
          card.appendChild(label);

          var ans=document.createElement("div");
          ans.style.cssText="white-space:pre-line;font-size:17px;line-height:1.55;border-top:1px solid #ddd;padding-top:10px";
          ans.textContent=item.a;
          card.appendChild(ans);

          var edit=document.createElement("button");
          edit.className="secondary";
          edit.textContent="Edit Answer";
          edit.style.marginTop="14px";
          edit.onclick=function(){
            overlay.remove();
            qi=item.index;
            si=item.q.sectionIndex;
            mode="question";
            render();
          };
          card.appendChild(edit);

          reviewContent.appendChild(card);
        });
      }
    });

    if(!found){
      var empty=document.createElement("div");
      empty.className="card";
      empty.textContent="You have not saved any answers yet.";
      reviewContent.appendChild(empty);
    }

    document.body.appendChild(overlay);
  }

  function addButton(){
    if(document.getElementById("reviewAnswersButton")) return;
    if(typeof mode==="undefined" || mode!=="intro") return;

    var buttons=document.querySelectorAll(".bottom button");
    var nextButton=document.getElementById("next");
    if(!nextButton) return;

    var b=document.createElement("button");
    b.id="reviewAnswersButton";
    b.className="secondary";
    b.textContent="Step 11 — Review My Answers";
    b.onclick=reviewAnswers;

    nextButton.parentNode.insertBefore(b,nextButton);
  }

  // The existing app calls render() dynamically, so observe the Home screen.
  var observer=new MutationObserver(function(){addButton()});
  observer.observe(document.body,{childList:true,subtree:true});

<script>
(function(){
  
  function restoreAnswers(file){
    if(!file){
      alert("No backup file was selected.");
      return;
    }

    var reader=new FileReader();

    reader.onerror=function(){
      alert("Safari could not read that backup file.");
    };

    reader.onload=function(){
      try{
        var data=JSON.parse(reader.result);

        if(!data || !data.answers || typeof data.answers!=="object"){
          throw new Error("Invalid backup format");
        }

        var restored=0;
        if(data.notes && typeof data.notes==="object"){
          Object.keys(data.notes).forEach(function(si){
            if(typeof SECTIONS!=="undefined" && SECTIONS[Number(si)]){
              localStorage.setItem(NOTES_PREFIX+si,String(data.notes[si]||""));
            }
          });
        }

        Object.keys(data.answers).forEach(function(index){
          var n=Number(index);
          if(Number.isInteger(n) && typeof QUESTIONS!=="undefined" && QUESTIONS[n]){
            localStorage.setItem(PREFIX+n,String(data.answers[index]));
            restored++;
          }
        });

        if(restored===0){
          throw new Error("No matching answers");
        }

        alert(restored+" saved answer"+(restored===1?"":"s")+" restored.");
        if(typeof render==="function") render();

      }catch(e){
        alert("That file could not be restored. Please choose a Step 11 backup file created by this app.");
      }
    };

    reader.readAsText(file);
  }
  function addBackupButtons(){
    if(typeof mode==="undefined" || mode!=="intro") return;
    var nextButton=document.getElementById("next");
    if(!nextButton) return;


    if(!document.getElementById("restoreAnswersWrap")){
      var wrap=document.createElement("div");
      wrap.id="restoreAnswersWrap";
      wrap.style.cssText="margin-top:8px";

      var label=document.createElement("label");
      label.className="secondary";
      label.textContent="Restore My Answers";
      label.style.cssText="display:inline-block;cursor:pointer";

      var input=document.createElement("input");
      input.type="file";
      input.accept=".json,application/json,text/plain";
      input.style.cssText="display:block;margin-top:8px;max-width:100%";
      input.onchange=function(){
        if(input.files && input.files.length){
          restoreAnswers(input.files[0]);
        }
      };

      wrap.appendChild(label);
      wrap.appendChild(input);
      nextButton.parentNode.insertBefore(wrap,nextButton);
    }
  }
  var observer=new MutationObserver(function(){addBackupButtons()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addBackupButtons,100);
})();
</script>


<script>
(function(){
  function addCompletionSystem(){
    if(typeof SECTIONS==="undefined" || typeof QUESTIONS==="undefined") return;

    function sectionStats(si){
      var answered=0,total=0;
      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex===si){
          total++;
          if((localStorage.getItem(PREFIX+index)||"").trim()!=="") answered++;
        }
      });
      return {answered:answered,total:total,complete:total>0 && answered===total};
    }

    // Enhance the existing My Progress overlay after it is opened.
    var originalShowProgress=window.showProgress;
    if(typeof originalShowProgress!=="function" || originalShowProgress.__completionEnhanced) return;

    function enhancedProgress(){
      originalShowProgress();

      setTimeout(function(){
        var overlay=document.getElementById("progressOverlay");
        if(!overlay) return;

        var cards=overlay.querySelectorAll(".card");
        var sectionCards=[];
        cards.forEach(function(card){
          var title=card.querySelector("div");
          if(title && title.textContent && title.textContent!=="Overall Progress"){
            sectionCards.push(card);
          }
        });

        SECTIONS.forEach(function(section,si){
          var stats=sectionStats(si);
          var card=sectionCards[si];
          if(!card) return;

          var badge=card.querySelector(".completionBadge");
          if(!badge){
            badge=document.createElement("div");
            badge.className="completionBadge";
            badge.style.cssText="font-size:12px;font-weight:750;letter-spacing:.07em;margin-top:9px";
            card.appendChild(badge);
          }

          if(stats.complete){
            badge.textContent="✓ COMPLETED";
            badge.style.color="#2f6b3f";
          }else if(stats.answered>0){
            badge.textContent="IN PROGRESS";
            badge.style.color="#666";
          }else{
            badge.textContent="NOT STARTED";
            badge.style.color="#999";
          }
        });

        var allComplete=SECTIONS.every(function(_,si){return sectionStats(si).complete;});
        if(allComplete){
          var done=document.createElement("div");
          done.className="card";
          done.style.marginTop="18px";
          done.innerHTML="<strong>✓ STEP ELEVEN COMPLETED</strong><div style='margin-top:8px;font-size:16px;line-height:1.5'>You have answered every Step 11 question.</div>";
          overlay.appendChild(done);
        }
      },0);
    }

    enhancedProgress.__completionEnhanced=true;
    window.showProgress=enhancedProgress;
  }

  var observer=new MutationObserver(function(){addCompletionSystem()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addCompletionSystem,100);
})();
</script>

<button id="shareReview" type="button" onclick="shareReview()" style="margin:10px 0;">Share</button>
<div id="sharePanel" class="share-panel">
  <strong>Share Step 11 — Review My Answers</strong>
  <div class="share-actions">
    <button type="button" onclick="shareByEmail()">Email</button>
    <button type="button" onclick="shareByText()">Text Message</button>
    <button type="button" onclick="copyReviewToClipboard()">Copy to Clipboard</button>
  </div>
  <div id="shareStatus" class="share-status"></div>
</div>

<script>
function getStepReviewText() {
  const step = 11;
  let lines = [];
  lines.push("An Interactive Working Guide to the 12 Steps of NA");
  lines.push("Step " + step + " — My Review Answers");
  lines.push("");
  const root = document.body;
  // Collect visible question/answer pairs from the current Step 11 review.
  // Prefer review containers and textarea/input values, while avoiding navigation controls.
  const fields = Array.from(root.querySelectorAll("textarea, input[type='text'], input:not([type])"));
  let q = 0;
  fields.forEach(el => {
    if (!el.offsetParent) return;
    const value = (el.value || "").trim();
    if (!value) return;
    const prev = el.closest(".question, .q, .card, .section, div");
    let label = "";
    if (prev) {
      const heading = prev.querySelector("h1,h2,h3,h4,strong,label");
      if (heading) label = heading.textContent.trim();
    }
    if (!label) {
      q++;
      label = "Answer " + q;
    }
    lines.push(label + ":");
    lines.push(value);
    lines.push("");
  });
  // If the review page has generated text, include it as a fallback.
  if (lines.length <= 4) {
    const review = document.querySelector("#review, .review, [id*='review']");
    if (review) {
      const clone = review.cloneNode(true);
      clone.querySelectorAll("button, script, style").forEach(x => x.remove());
      const body = clone.innerText.trim();
      if (body) lines.push(body);
    }
  }
  return lines.join("\n").trim();
}

function shareReview() {
  const panel = document.getElementById("sharePanel");
  if (panel) panel.classList.toggle("show");
}

function shareByEmail() {
  const body = encodeURIComponent(getStepReviewText());
  window.location.href = "mailto:?subject=" + encodeURIComponent("NA Step 11 — My Review Answers") + "&body=" + body;
}

function shareByText() {
  const body = encodeURIComponent(getStepReviewText());
  // sms: works across common iOS/Android configurations; the user selects the recipient.
  window.location.href = "sms:?&body=" + body;
}

async function copyReviewToClipboard() {
  const text = getStepReviewText();
  try {
    await navigator.clipboard.writeText(text);
    const status = document.getElementById("shareStatus");
    if (status) status.textContent = "Review answers copied to the clipboard.";
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      const status = document.getElementById("shareStatus");
      if (status) status.textContent = "Review answers copied to the clipboard.";
    } finally {
      document.body.removeChild(ta);
    }
  }
}
</script>
