</style></head><body><div class="app">
<header><div class="title">An Interactive Working Guide to the 12 Steps of NA</div><div class="sub"></div></header>
<div class="progress"><div id="bar" class="bar"></div></div><main id="main"></main>
<div class="bottom"><button id="home" class="secondary">Home</button><button id="back" class="secondary">← Back</button><button id="next">Begin Step 12 →</button></div>
</div>
<script>
const INTRO="\"Having had a spiritual awakening as a result of these steps, we tried to carry this message to addicts, and to practice these principles in all our affairs.\" If we've made it to this point, we've had a spiritual awakening. Though the nature of our awakening is as individual and personal as our spiritual path, the similarities in our experiences are striking. Almost without exception, our members speak of feeling free, of feeling more light-hearted more of the time, of caring more about others, and of the ever- increasing ability to step outside ourselves and participate fully in life. The way this looks to others is astonishing. People who knew us when we were in our active addiction, often appearing withdrawn and angry, tell us that we're different people. Indeed, many of us feel as if we've begun a second life. We know the importance of remembering where we came from, so we make an effort not to forget, but the way we lived and the things that motivated us seem increasingly bizarre the longer we stay clean. The change in us didn't happen overnight. It happened slowly and gradually as we worked the steps. Our spirits awakened a bit at a time. It became increasingly more natural for us to practice spiritual principles and increasingly more uncomfortable to act out on character defects. Notwithstanding the powerful, one-of-a-kind experiences some of us have had, we've all slowly and painstakingly built a relationship with a Power greater than ourselves. That power, whether it's our own best and highest nature or a force outside ourselves, has become ours to tap into whenever we want. It guides our actions and provides inspiration for our continued growth. \u0001 What is my overall experience as a result of working the steps? \u0001 What has my spiritual awakening been like? \u0001 What lasting changes have resulted from my spiritual awakening? Each time we work through the Twelve Steps we will have a different experience. Subtleties of meaning for each of the spiritual principles will become apparent, and we will find that as our understanding grows, we are also growing in new ways and in new areas. The ways in which we are able to be honest, for instance, will expand along with our basic understanding of what it means to be honest. We will see how practicing the principle of honesty must first be applied to ourselves before we are able to be honest with others. We will see that honesty can be an expression of our personal integrity. As our understanding of the spiritual principles grows, so will the depth of our spiritual awakening. Which spiritual principles have been connected to which steps, for me, and how have those contributed to my spiritual awakening? \u0001 What does the phrase \"spiritual awakening\" mean to me?";
const SECTIONS=[{"name": "We Tried To Carry This Message", "reading": "Many of us recall the first time we heard the words, \"You never have to use again if you don't want to.\" For many of us, hearing this message was shocking. Perhaps we'd never thought in terms of \"having\" to use before, and were surprised to find out just how much truth that statement held. Of course, we thought, using drugs ceased to be a choice for me a long time ago. Although just hearing this message may or may not have resulted in us immediately getting clean, we still heard the message. Someone carried it to us. Some of us had the experience of believing that we could stay clean in NA, but when it came to recovery, that seemed beyond us. Gaining a sense of self-respect, making friends, being able to carry ourselves out in the \"real world\" without it being obvious that we were addicts all seemed like more than we could actually expect from NA. The day we began to believe that this program could do more for us than just help us stay clean was a tune we remember as a turning point in our recovery. What happened to give us that sense of hope was that someone gave us a reason to believe. Maybe it was someone sharing at a meeting with whom we identified in a very personal way. Maybe it was the cumulative effects of hearing many addicts share that recovery was possible. Maybe it was the unconditional love and quiet insistence of our sponsor that we could recover. In whichever way we heard it, it was the message, and someone carried it to us. Some of us have the experience of staying clean for a long time and finding joy in recovery. Then we experience a tragedy. Maybe it's the breakup of a long-term committed relationship or the death of a loved one. Maybe it's the relapse and death of someone with whom we have been friends in NA. Maybe it's that we find ourselves destitute. Maybe it's simply that we've realized that other NA members aren't perfect, and so they're capable of hurting us. Because of whatever crisis we've experienced, we find that we've lost our faith. We no longer believe that NA holds the answer for us. The bargain we thought we had made-we'd stay clean and try to do the right thing and, consequently, our lives would be happy - had been breached, and we were left wondering about our purpose m life all over again. At some point, we began to believe again. Maybe someone who had been through the same crisis reached out to us and helped us through in a way no one else could have. Again, someone carried the message to us.", "count": 6}, {"name": "To Addicts", "reading": "Why does the Twelfth Step specify that we carry the message to addicts? Why did NA work for us when nothing else had? Almost every one of us had someone - a teacher, a counselor, a family member, a police officer - tell us that using drugs was killing us and destroying all we cared about, that if we just stayed away from our using friends and otherwise limited our access to drugs, we'd be able to change our lives. Most of us probably even agreed on some level, unless we were in complete denial. So why couldn't we find relief until we found Narcotics Anonymous? What did those other NA members have that made us believe recovery was possible? In a word: credibility. We knew that they, who were just like us, had stopped using and found a new way to live. They didn't care what we had or didn't have. It even said in the readings we heard at the beginning of the meeting that it didn't matter what or how much we used. Most of us were grateful to find out that we qualified. We knew we'd suffered enough, but we wanted to be accepted. And we were. The addicts who were there for us when we first started coming to meetings made us feel welcome. They offered their phone numbers and encouraged us to call any time. But what we really found important was the identification. Members who had used just like we did shared their experience with getting clean. Members who knew from personal experience exactly how isolated and alone we felt seemed to know instinctively that a simple, loving hug was what we needed. It seemed as if the whole group knew exactly what we needed without us having to ask. We often say to one another that we're fortunate to have this program; it gives us a way to cope with life on life's terms. After we stay clean for a time, we realize that the principles of Narcotics Anonymous are actually completely universal and could probably change the world if everyone practiced them. We may begin to wonder why we don't open up NA to all those who have any kind of problem. As we learned from our predecessors, having a single purpose is probably one of the most effective ways of ensuring that the opportunity will remain for an addict to find the identification he or she needs. If NA tried to be all things to all people, an addict might walk in, wanting only to know how to stop using drugs, and not be able to find anyone who knew.", "count": 9}, {"name": "Practicing These Principles in All Our Affairs", "reading": "When we talk about practicing the principles of recovery in all our affairs, the key word is \"practice.\" We just need to keep trying to apply spiritual principles to our lives, not be able to do it perfectly in every situation. The spiritual benefits we derive from working this step depend on our effort, not our success. For instance, we try to practice the principle of compassion in every situation in our lives. It's probably relatively easy to practice the principle of compassion with a still-using addict who has just walked into her first NA meeting, no matter how belligerent or needy that newcomer is. But what about someone who has just returned from a relapse, or a multiple relapser? What if he walks in blaming NA for his relapse? What if she casually walks back into the rooms projecting an attitude that seems to take recovery for granted? What if it's someone we sponsored? We may find that practicing the principle of compassion doesn't come as easily as it used to. We don't feel compassionate toward the person, but we can still practice the principle of compassion. All we have to do is continue to carry the message without conditions. Our sponsor can help us learn how to be compassionate without giving the impression that we think relapsing is okay. We can pray and meditate, asking our Higher Power to help us be compassionate. This step calls upon us to practice principles in all our affairs. Many of us would like to separate our careers, our romantic relationships, or another area of our lives from this requirement because we're not sure we can get what we want if we have to practice spiritual principles. For instance, it may very well lead to apparent success and financial reward if we compromise our principles at work. We may be asked to meet a production deadline that results in profits for the company but produces an inferior product that could compromise the safety of the people who purchase it. So what do we do? We practice the spiritual principles of our recovery. There are probably many different choices about the specific action to take in response to our principles; the important thing is that we respond to our principles. What about NA service? Strangely enough, some of us reserve NA service as the one place where we forget our principles. We cease giving people the benefit of the doubt in a service setting. We openly accuse others of hatching plots, and we say cruel things because we're not practicing the principle of kindness. We set up impossible processes for those we elect to do a job because we're not practicing the principle of trust. We become self-righteous, belligerent, and sarcastic. It's ironic that we seem to want to attack those whom we trust with our very lives in recovery meetings. We need to remember to practice spiritual principles in any meeting, whether service or recovery. Service gives us many opportunities to practice spiritual principles. Knowing which spiritual principle to practice in any given situation is difficult, but it is usually the opposite of the character defect we would normally be acting out on. For instance, if we feel compelled to exert absolute control over a situation, we can practice the principle of trust. If we would usually be self-righteous in a certain situation, we can practice the principle of humility. If our first impulse is to withdraw and isolate, we can reach out instead. The work we did in the Seventh Step on finding the opposites of our character defects and the work we did at the beginning of this step on identifying the spiritual principles in the previous steps will give us some additional ideas about the principles we need to practice. Though most of us will wind up with very similar lists of spiritual principles, the attention we devote to certain ones will reflect our individual needs.", "count": 3}, {"name": "Spiritual Principles", "reading": "Even in the step that asks us to practice spiritual principles, there are specific principles connected to the step itself. We will focus on unconditional love, selflessness, and steadfastness. Practicing the principle of unconditional love in the Twelfth Step is essential. Nobody needs love without conditions more than a suffering addict. We don't ask anything of the people to whom we are trying to carry the message. We don't ask for money. We don't ask for gratitude. We don't even ask that they stay clean. We simply extend ourselves. This doesn't mean we shouldn't take reasonable precautions. If we believe it isn't safe to bring a suffering addict to our home, we shouldn't do it. Twelfth Step calls should always be done with another NA member. Nor does practicing the principle of unconditional love require that we allow ourselves to be abused. Sometimes the best way of loving and helping is to stop enabling someone else to use.", "count": 6}, {"name": "Moving On", "reading": "Before we get too excited about the prospect of being finished with the Twelve Steps, we should realize that we're not-finished, that is. Not only will we continue trying to practice the spiritual principles of all Twelve Steps, which many of us call \"living the program,\" but we will formally revisit each of the steps, probably many times, throughout our lives. Some of us may immediately begin working through the steps again with the perspective that we've gained from our journey thus far. Others wait for a time or concentrate on certain aspects of the steps. However we do it, the point is that whenever we find ourselves powerless over our addiction, whenever more has been revealed about our shortcomings or people we've harmed, the steps are available as our path to recovery. We should feel good about what we've done. We have, in many cases for the first time, followed a process all the way through. This is an amazing accomplishment, something about which we should be very proud. In fact, one of the rewards of working an NA program is finding that our self-esteem has grown a great deal. We find ourselves joining society. We can do things that seemed beyond us before: exchanging hellos with a neighbor or the clerk at our local market, taking on positions of leadership in our communities, joining in social events with people who don't know we're addicts and not feeling \"less than.\" In fact, we may have looked with contempt upon such things in the past because we felt we'd never be able to fit in, but now we know we can. We become approachable. People may even seek out our advice and counsel on professional matters. When we think about where we've come from and what our recovery has brought to our lives; we can only be overwhelmed with gratitude. As it says in It Works, gratitude becomes the underlying force in all that we do. Our very lives can be an expression of our gratitude; it all depends on how we choose to live. Each one of us has something very special and unique to offer in gratitude.", "count": 1}];
const QUESTIONS=[{"sectionIndex": 0, "text": "What is my overall experience as a result of working the steps?"}, {"sectionIndex": 0, "text": "What has my spiritual awakening been like?"}, {"sectionIndex": 0, "text": "What lasting changes have resulted from my spiritual awakening?"}, {"sectionIndex": 0, "text": "What does the phrase \"spiritual awakening\" mean to me?"}, {"sectionIndex": 0, "text": "What are the different ways in which I've experienced the message?"}, {"sectionIndex": 0, "text": "What kind of service work am I doing to carry the message?"}, {"sectionIndex": 1, "text": "What are some different ways of carrying the message? Which ones do I personally participate in?"}, {"sectionIndex": 1, "text": "What is my personal style of sponsorship?"}, {"sectionIndex": 1, "text": "What is the difference between attraction and promotion?"}, {"sectionIndex": 1, "text": "What does it do for me to carry the message?"}, {"sectionIndex": 1, "text": "How are the Fifth Tradition and the Twelfth Step tied together?"}, {"sectionIndex": 1, "text": "What keeps me coming back and trusting the NA program? What is selfless service? How do I practice it?"}, {"sectionIndex": 1, "text": "Why was an NA member able to reach me in a way that no one else ever had? Describe the experience."}, {"sectionIndex": 1, "text": "What is the therapeutic value of one addict helping another?"}, {"sectionIndex": 1, "text": "Why is identification so important?"}, {"sectionIndex": 2, "text": "How can I practice principles in the different areas of my life?"}, {"sectionIndex": 2, "text": "When do I find it difficult to practice principles?"}, {"sectionIndex": 2, "text": "Which spiritual principles do I have a particularly hard time practicing?"}, {"sectionIndex": 3, "text": "How am I practicing the principle of unconditional love with the addicts I am trying to help?"}, {"sectionIndex": 3, "text": "What is my attitude about sponsorship? Do I encourage my sponsees to make their own decisions and grow as a result? Do I give advice, or do I share my experience?"}, {"sectionIndex": 3, "text": "What is my attitude about service? Could NA survive without me?"}, {"sectionIndex": 3, "text": "How am I practicing the principle of selflessness in my efforts to be of service?"}, {"sectionIndex": 3, "text": "Am I committed to my recovery? What am I doing to maintain it?"}, {"sectionIndex": 3, "text": "Do I practice spiritual principles regardless of how I feel?"}, {"sectionIndex": 4, "text": "How will I express my gratitude?"}];
const PREFIX="step-twelve-v1-";
const STATE="step-twelve-v1-resume-state";
let mode="intro",si=0,qi=0;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function cleanReading(s){return s.replace(/\s+/g," ").trim();}
function saveAnswer(){const a=document.getElementById("answer");if(a)localStorage.setItem(PREFIX+qi,a.value)}
function getState(){try{return JSON.parse(localStorage.getItem(STATE)||"null")}catch(e){return null}}
function saveState(){localStorage.setItem(STATE,JSON.stringify({mode:mode,si:si,qi:qi}))}
function hasAnswers(){return QUESTIONS.some((_,i)=>localStorage.getItem(PREFIX+i))}
function update(){document.getElementById("bar").style.width=(mode==="intro"?0:mode==="reading"?((si)/SECTIONS.length*100):((qi+1)/QUESTIONS.length*100))+"%";}

function getResumeState(){
 try{
   const raw=localStorage.getItem(STATE);
   return raw ? JSON.parse(raw) : null;
 }catch(e){ return null; }
}
function saveResumeState(){
 if(mode==="question" || mode==="reading"){
   localStorage.setItem(STATE,JSON.stringify({mode:mode,si:si,qi:qi}));
 }
}
function toc(){
 mode="toc";
 main.innerHTML='<div class="eyebrow">Narcotics Anonymous</div><h1>Table of Contents</h1>'+
   '<div class="card"><div class="reading">Choose a step to begin or continue your work. You can return here at any time.</div></div>'+
   '<div id="tocList"></div>';
 const list=document.getElementById("tocList");
 const steps=["One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve"];
 steps.forEach(function(name,idx){
   const n=idx+1;
   const b=document.createElement("button");
   b.textContent="Step "+name;
   b.style.cssText="display:block;width:100%;text-align:left;margin:10px 0;padding:16px 18px;font-size:17px";
   b.onclick=function(){window.location.href="NA_Step_"+n+"_WORKING_COPY.html"};
   list.appendChild(b);
 });
 back.disabled=true;
 next.textContent="Begin Step Twelve →";
 update();
}
function intro(){
 mode="intro";
  document.querySelector("header .sub").textContent="Step Twelve";
  document.title="An Interactive Working Guide to the 12 Steps of NA — Step Twelve";
 const saved=getResumeState();
 let resumeText="";
 if(saved && saved.mode!=="intro"){
   if(saved.mode==="question"){
     const q=QUESTIONS[saved.qi];
     const first=QUESTIONS.findIndex(x=>x.sectionIndex===saved.si); resumeText=SECTIONS[q.sectionIndex].name+" — Question "+(saved.qi-first+1)+" of "+SECTIONS[q.sectionIndex].count;
   } else {
     resumeText=SECTIONS[saved.si].name+" — Reading";
   }
 }
 main.innerHTML=
   '<div class="eyebrow">Step 12</div><h1>Step 12</h1>'+
   '<div class="card"><div class="reading">'+esc(cleanReading(INTRO))+'</div></div>'+
   (resumeText?
     '<div class="resume" style="border:1px solid #ddd;border-radius:14px;padding:16px;background:#fafafa;margin:18px 0">'+
       '<div class="eyebrow">Continue Where You Left Off</div>'+
       '<div style="font-size:17px;line-height:1.4;margin-bottom:12px">'+esc(resumeText)+'</div>'+
       '<button id="continue">Continue Step 12 →</button>'+
     '</div>':'');
 if(saved && resumeText){
   document.getElementById("continue").onclick=function(){
     mode=saved.mode; si=saved.si; qi=saved.qi; render();
   };
 }
 back.disabled=true;
 next.textContent=resumeText?"Restart Step 12":"Begin Step 12 →";
 update();
}
function reading(){
 mode="reading";saveResumeState();const s=SECTIONS[si];
 main.innerHTML='<div class="eyebrow">Section '+(si+1)+' of '+SECTIONS.length+'</div><h1>'+esc(s.name)+'</h1><div class="card"><div class="reading">'+esc(cleanReading(s.reading))+'</div></div><button id="begin">Begin this section’s questions →</button>';
 document.getElementById("begin").onclick=function(){qi=QUESTIONS.findIndex(q=>q.sectionIndex===si);mode="question";render()};
 back.disabled=si===0;next.textContent="Questions →";update();
}
function question(){
 mode="question";saveResumeState();const q=QUESTIONS[qi],ans=localStorage.getItem(PREFIX+qi)||"";
 const sec=SECTIONS[q.sectionIndex]; const first=QUESTIONS.findIndex(x=>x.sectionIndex===q.sectionIndex); const num=qi-first+1; main.innerHTML='<div class="eyebrow">'+esc(sec.name)+' • Question '+num+' of '+sec.count+'</div><div class="question">• '+esc(q.text)+'</div><textarea id="answer" placeholder="Type your answer here...">'+esc(ans)+'</textarea><div class="status">Saved automatically on this device.</div>';
 const a=document.getElementById("answer");a.addEventListener("input",function(){localStorage.setItem(PREFIX+qi,a.value);saveState()});
 back.disabled=qi===0;next.textContent=qi===QUESTIONS.length-1?"Finish Step 12":"Save & Next →";update();
}
function render(){
  if(mode==="welcome")welcome();
  else if(mode==="toc")toc();
  else if(mode==="intro")intro();
  else if(mode==="reading")reading();
  else question();
  saveResumeState();
  update();
}
home.onclick=function(){if(mode==="question")saveAnswer();mode="intro";render()};
back.onclick=function(){
 if(mode==="question"){saveAnswer();const current=QUESTIONS[qi].sectionIndex,first=QUESTIONS.findIndex(q=>q.sectionIndex===current);if(qi===first){si=current;mode="reading"}else qi--;render()}
 else if(mode==="reading"){if(si===0)mode="intro";else si--;render()}
 else if(mode==="toc"){mode="welcome";render()}
};
next.onclick=function(){
  if(mode==="intro"){
   const saved=getResumeState();
   if(saved && next.textContent==="Restart Step 12"){
     if(confirm("Restart Step 12? Your saved answers will remain on this device.")){
       si=0;qi=0;mode="reading";render();
     }
   }else{
     si=0;qi=0;mode="reading";render();
   }
   return;
}
 if(mode==="reading"){qi=QUESTIONS.findIndex(q=>q.sectionIndex===si);mode="question";render();return}
 saveAnswer();
 if(qi<QUESTIONS.length-1){const old=QUESTIONS[qi].sectionIndex;qi++;if(QUESTIONS[qi].sectionIndex!==old){si=QUESTIONS[qi].sectionIndex;mode="reading"}render()}
 else{alert("Step 12 is complete. Your answers remain saved on this device. You have completed all twelve steps.");mode="intro";render()}
};
render();
</script>
<script>
(function(){
  function reviewAnswers(){
    var overlay=document.createElement("div");
    overlay.id="reviewOverlay";
    overlay.style.cssText="position:fixed;inset:0;background:#fff;z-index:99999;overflow:auto;padding:22px 18px 110px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202124";

    var close=document.createElement("button");
    close.textContent="← Home";
    close.className="secondary";
    close.onclick=function(){overlay.remove()};
    overlay.appendChild(close);

    var h=document.createElement("h1");
    h.textContent="Step 12 — Review My Answers";
    overlay.appendChild(h);

    // Review / Share tabs for the Review My Answers page.
    var tabBar=document.createElement("div");
    tabBar.style.cssText="display:flex;gap:8px;margin:14px 0 20px;border-bottom:1px solid #ddd;padding-bottom:10px";
    var reviewTab=document.createElement("button");
    reviewTab.textContent="Review My Answers";

    function buildReviewShareText(){
      var lines=["An Interactive Working Guide to the 12 Steps of NA","Step 12 — My Review Answers",""];
      var has=false;
      SECTIONS.forEach(function(section,si){
        var sectionHas=false;
        var sectionLines=[];
        QUESTIONS.forEach(function(q,index){
          if(q.sectionIndex===si){
            var a=localStorage.getItem(PREFIX+index)||"";
            if(a.trim()!==""){
              has=true; sectionHas=true;
              sectionLines.push("• "+q.text);
              sectionLines.push("My Answer:");
              sectionLines.push(a.trim());
              sectionLines.push("");
            }
          }
        });
        if(sectionHas){ lines.push(section.name.toUpperCase()); lines.push(""); lines=lines.concat(sectionLines); }
      });
      if(!has) lines.push("No answers have been saved yet.");
      return lines.join("\n").trim();
    }

    shareTab.onclick=function(){ reviewContent.style.display="none"; shareContent.style.display="block"; };

    clipBtn.onclick=function(){

      } else {
        var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.left="-9999px"; document.body.appendChild(ta); ta.select();

            si=item.q.sectionIndex;
            mode="question";
            render();
          };
          card.appendChild(edit);

          reviewContent.appendChild(card);
        });
      }
    });

    if(!found){
      var empty=document.createElement("div");
      empty.className="card";
      empty.textContent="You have not saved any answers yet.";
      reviewContent.appendChild(empty);
    }

    document.body.appendChild(overlay);

  // The existing app calls render() dynamically, so observe the Home screen.
  var observer=new MutationObserver(function(){addButton()});
  observer.observe(document.body,{childList:true,subtree:true});

})();

<script>
(function(){
  
  function restoreAnswers(file){
    if(!file){
      alert("No backup file was selected.");
      return;
    }

    var reader=new FileReader();

    reader.onerror=function(){
      alert("Safari could not read that backup file.");
    };

    reader.onload=function(){
      try{
        var data=JSON.parse(reader.result);

        if(!data || !data.answers || typeof data.answers!=="object"){
          throw new Error("Invalid backup format");
        }

        var restored=0;
        if(data.notes && typeof data.notes==="object"){
          Object.keys(data.notes).forEach(function(si){
            if(typeof SECTIONS!=="undefined" && SECTIONS[Number(si)]){
              localStorage.setItem(NOTES_PREFIX+si,String(data.notes[si]||""));
            }
          });
        }

        Object.keys(data.answers).forEach(function(index){
          var n=Number(index);
          if(Number.isInteger(n) && typeof QUESTIONS!=="undefined" && QUESTIONS[n]){
            localStorage.setItem(PREFIX+n,String(data.answers[index]));
            restored++;
          }
        });

        if(restored===0){
          throw new Error("No matching answers");
        }

        alert(restored+" saved answer"+(restored===1?"":"s")+" restored.");
        if(typeof render==="function") render();

      }catch(e){
        alert("That file could not be restored. Please choose a Step 12 backup file created by this app.");
      }
    };

    reader.readAsText(file);
  }
  function addBackupButtons(){
    if(typeof mode==="undefined" || mode!=="intro") return;
    var nextButton=document.getElementById("next");
    if(!nextButton) return;


    if(!document.getElementById("restoreAnswersWrap")){
      var wrap=document.createElement("div");
      wrap.id="restoreAnswersWrap";
      wrap.style.cssText="margin-top:8px";

      var label=document.createElement("label");
      label.className="secondary";
      label.textContent="Restore My Answers";
      label.style.cssText="display:inline-block;cursor:pointer";

      var input=document.createElement("input");
      input.type="file";
      input.accept=".json,application/json,text/plain";
      input.style.cssText="display:block;margin-top:8px;max-width:100%";
      input.onchange=function(){
        if(input.files && input.files.length){
          restoreAnswers(input.files[0]);
        }
      };

      wrap.appendChild(label);
      wrap.appendChild(input);
      nextButton.parentNode.insertBefore(wrap,nextButton);
    }
  }
  var observer=new MutationObserver(function(){addBackupButtons()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addBackupButtons,100);
})();
</script>


<script>
(function(){
  function addCompletionSystem(){
    if(typeof SECTIONS==="undefined" || typeof QUESTIONS==="undefined") return;

    function sectionStats(si){
      var answered=0,total=0;
      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex===si){
          total++;
          if((localStorage.getItem(PREFIX+index)||"").trim()!=="") answered++;
        }
      });
      return {answered:answered,total:total,complete:total>0 && answered===total};
    }

    // Enhance the existing My Progress overlay after it is opened.
    var originalShowProgress=window.showProgress;
    if(typeof originalShowProgress!=="function" || originalShowProgress.__completionEnhanced) return;

    function enhancedProgress(){
      originalShowProgress();

      setTimeout(function(){
        var overlay=document.getElementById("progressOverlay");
        if(!overlay) return;

        var cards=overlay.querySelectorAll(".card");
        var sectionCards=[];
        cards.forEach(function(card){
          var title=card.querySelector("div");
          if(title && title.textContent && title.textContent!=="Overall Progress"){
            sectionCards.push(card);
          }
        });

        SECTIONS.forEach(function(section,si){
          var stats=sectionStats(si);
          var card=sectionCards[si];
          if(!card) return;

          var badge=card.querySelector(".completionBadge");
          if(!badge){
            badge=document.createElement("div");
            badge.className="completionBadge";
            badge.style.cssText="font-size:12px;font-weight:750;letter-spacing:.07em;margin-top:9px";
            card.appendChild(badge);
          }

          if(stats.complete){
            badge.textContent="✓ COMPLETED";
            badge.style.color="#2f6b3f";
          }else if(stats.answered>0){
            badge.textContent="IN PROGRESS";
            badge.style.color="#666";
          }else{
            badge.textContent="NOT STARTED";
            badge.style.color="#999";
          }
        });

        var allComplete=SECTIONS.every(function(_,si){return sectionStats(si).complete;});
        if(allComplete){
          var done=document.createElement("div");
          done.className="card";
          done.style.marginTop="18px";
          done.innerHTML="<strong>✓ STEP TWELVE COMPLETED</strong><div style='margin-top:8px;font-size:16px;line-height:1.5'>You have answered every Step 12 question.</div>";
          overlay.appendChild(done);
        }
      },0);
    }

    enhancedProgress.__completionEnhanced=true;
    window.showProgress=enhancedProgress;
  }

  var observer=new MutationObserver(function(){addCompletionSystem()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addCompletionSystem,100);
})();
</script>

<script>
(function(){
  function buildSummary(){

    summaryShareCard.appendChild(shareHeading);

    var shareHelp=document.createElement("div");
    shareHelp.textContent="Share your saved answers by email, text message, or copy them to the clipboard.";
    shareHelp.style.cssText="font-size:15px;line-height:1.45;margin-bottom:12px";
    summaryShareCard.appendChild(shareHelp);

    var summaryShareActions=document.createElement("div");
    summaryShareActions.style.cssText="display:flex;flex-wrap:wrap;gap:8px";

    function buildSummaryShareText(){
      var lines=["An Interactive Working Guide to the 12 Steps of NA","Step 12 — My Review Answers",""];
      var any=false;
      SECTIONS.forEach(function(section,si){
        var sectionLines=[];
        QUESTIONS.forEach(function(q,index){
          if(q.sectionIndex!==si) return;
          var a=(localStorage.getItem(PREFIX+index)||"").trim();

          }
        });
        if(sectionLines.length){
          lines.push(section.name.toUpperCase());
          lines.push("");
          lines=lines.concat(sectionLines);
        }
      });
      if(!any) lines.push("No answers have been saved yet.");
      return lines.join("\n").trim();

    };

    var summaryText=document.createElement("button");
    summaryText.className="secondary";
    summaryText.textContent="Text Message";
    summaryText.onclick=function(){
      window.location.href="sms:?&body="+encodeURIComponent(buildSummaryShareText());
    };

        navigator.clipboard.writeText(txt).then(ok).catch(function(){
          var ta=document.createElement("textarea");
          ta.value=txt; ta.style.position="fixed"; ta.style.left="-9999px";
          document.body.appendChild(ta); ta.select();
          try{document.execCommand("copy"); ok();}catch(e){fail();}
          document.body.removeChild(ta);
        });
      }else{
        var ta=document.createElement("textarea");
        ta.value=txt; ta.style.position="fixed"; ta.style.left="-9999px";
        document.body.appendChild(ta); ta.select();
        try{document.execCommand("copy"); ok();}catch(e){fail();}
        document.body.removeChild(ta);
      }
    };

    summaryShareActions.appendChild(summaryEmail);
    summaryShareActions.appendChild(summaryText);
    summaryShareActions.appendChild(summaryCopy);
    summaryShareCard.appendChild(summaryShareActions);

    var summaryShareStatus=document.createElement("div");
    summaryShareStatus.style.cssText="margin-top:9px;color:#666;font-size:14px";
    summaryShareCard.appendChild(summaryShareStatus);

    overlay.appendChild(summaryShareCard);

    SECTIONS.forEach(function(section,si){
      var card=document.createElement("div");
      card.className="card";

      var heading=document.createElement("div");
      heading.style.cssText="font-size:19px;font-weight:700;margin-bottom:12px";
      heading.textContent=section.name;
      card.appendChild(heading);

      var hasContent=false;

      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex!==si) return;
        var a=(localStorage.getItem(PREFIX+index)||"").trim();
        if(!a) return;

        hasContent=true;

        var qbox=document.createElement("div");
        qbox.style.cssText="font-weight:700;margin-top:14px";
        qbox.textContent="• "+q.text;
        card.appendChild(qbox);

        var abox=document.createElement("div");
        abox.style.cssText="white-space:pre-line;margin-top:7px;padding:10px;border-left:3px solid #ddd;line-height:1.5";
        abox.textContent=a;
        card.appendChild(abox);
      });

      var note=localStorage.getItem("step12Notes_"+si)||"";
      if(note.trim()){
        hasContent=true;
        var nh=document.createElement("div");
        nh.style.cssText="font-weight:700;margin-top:20px";
        nh.textContent="My Notes";
        card.appendChild(nh);

        var nb=document.createElement("div");
        nb.style.cssText="white-space:pre-line;margin-top:7px;padding:10px;border-left:3px solid #ddd;line-height:1.5";
        nb.textContent=note;
        card.appendChild(nb);
      }

      if(hasContent) overlay.appendChild(card);
    });

    var print=document.createElement("button");
    print.className="secondary";
    print.textContent="Print / Save as PDF";
    print.style.marginTop="18px";
    print.onclick=function(){window.print()};
    overlay.appendChild(print);

    document.body.appendChild(overlay);
  }

  function addSummaryButton(){
    if(document.getElementById("summaryButton")) return;
    if(typeof mode==="undefined" || mode!=="intro") return;

    var nextButton=document.getElementById("next");
    if(!nextButton) return;

    var b=document.createElement("button");
    b.id="summaryButton";
    b.className="secondary";
    b.textContent="Step 12 Summary";
    b.onclick=buildSummary;
    nextButton.parentNode.insertBefore(b,nextButton);
  }

  var observer=new MutationObserver(function(){addSummaryButton()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addSummaryButton,100);
})();
</script>


<button id="shareReview" type="button" onclick="shareReview()" style="margin:10px 0;">Share</button>
<div id="sharePanel" class="share-panel">
  <strong>Share Step 12 — Review My Answers</strong>
  <div class="share-actions">
    <button type="button" onclick="shareByEmail()">Email</button>
    <button type="button" onclick="shareByText()">Text Message</button>
    <button type="button" onclick="copyReviewToClipboard()">Copy to Clipboard</button>
  </div>
  <div id="shareStatus" class="share-status"></div>
</div>

<script>
function getStepReviewText() {
  const step = 12;
  let lines = [];
  lines.push("An Interactive Working Guide to the 12 Steps of NA");
  lines.push("Step " + step + " — My Review Answers");
  lines.push("");
  const root = document.body;
  // Collect visible question/answer pairs from the current Step 12 review.
  // Prefer review containers and textarea/input values, while avoiding navigation controls.
  const fields = Array.from(root.querySelectorAll("textarea, input[type='text'], input:not([type])"));
  let q = 0;
  fields.forEach(el => {
    if (!el.offsetParent) return;
    const value = (el.value || "").trim();
    if (!value) return;
    const prev = el.closest(".question, .q, .card, .section, div");
    let label = "";
    if (prev) {
      const heading = prev.querySelector("h1,h2,h3,h4,strong,label");
      if (heading) label = heading.textContent.trim();
    }
    if (!label) {
      q++;
      label = "Answer " + q;
    }
    lines.push(label + ":");
    lines.push(value);
    lines.push("");
  });
  // If the review page has generated text, include it as a fallback.
  if (lines.length <= 4) {
    const review = document.querySelector("#review, .review, [id*='review']");
    if (review) {
      const clone = review.cloneNode(true);
      clone.querySelectorAll("button, script, style").forEach(x => x.remove());
      const body = clone.innerText.trim();
      if (body) lines.push(body);
    }
  }
  return lines.join("\n").trim();
}

function shareReview() {
  const panel = document.getElementById("sharePanel");
  if (panel) panel.classList.toggle("show");
}

function shareByEmail() {
  const body = encodeURIComponent(getStepReviewText());
  window.location.href = "mailto:?subject=" + encodeURIComponent("NA Step 12 — My Review Answers") + "&body=" + body;
}

function shareByText() {
  const body = encodeURIComponent(getStepReviewText());
  // sms: works across common iOS/Android configurations; the user selects the recipient.
  window.location.href = "sms:?&body=" + body;
}

async function copyReviewToClipboard() {
  const text = getStepReviewText();
  try {
    await navigator.clipboard.writeText(text);
    const status = document.getElementById("shareStatus");
    if (status) status.textContent = "Review answers copied to the clipboard.";
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      const status = document.getElementById("shareStatus");
      if (status) status.textContent = "Review answers copied to the clipboard.";
    } finally {
      document.body.removeChild(ta);
    }
  }
}
</script>

<script>
(function(){
  const STEP_NO = (document.title.match(/Step (\\d+)/i)||[])[1] || (document.body.innerText.match(/Step (\\d+)/i)||[])[1] || "";
  const ANSWER_PREFIX = (typeof PREFIX !== "undefined") ? PREFIX : "";
  const NOTES_PREFIX_LOCAL = (typeof NOTES_PREFIX !== "undefined") ? NOTES_PREFIX : ("step"+STEP_NO+"Notes_");
  const STATE_KEY_LOCAL = (typeof STATE !== "undefined") ? STATE : "";
  const STEP_KEYS = {
    1:{prefix:"step-one-complete-v4-",notes:"stepOneNotes_",state:"step-one-v4-resume-state"},
    2:{prefix:"step-two-complete-v1-",notes:"stepOneNotes_",state:"step-two-v1-resume-state"},
    3:{prefix:"step-three-complete-v1-",notes:"stepOneNotes_",state:"step-three-v1-resume-state"},
    4:{prefix:"step-four-complete-v1-",notes:"stepOneNotes_",state:"step-four-v1-resume-state"},
    5:{prefix:"step-five-complete-v1-",notes:"stepOneNotes_",state:"step-five-v1-resume-state"},
    6:{prefix:"step-six-complete-v1-",notes:"stepOneNotes_",state:"step-six-v1-resume-state"},
    7:{prefix:"step-seven-v1-",notes:"step7Notes_",state:"step-seven-v1-resume-state"},
    8:{prefix:"step-eight-v1-",notes:"step8Notes_",state:"step-eight-v1-resume-state"},
    9:{prefix:"step-nine-v1-",notes:"step9Notes_",state:"step-nine-v1-resume-state"},
    10:{prefix:"step-ten-v1-",notes:"step10Notes_",state:"step-ten-v1-resume-state"},
    11:{prefix:"step-eleven-v1-",notes:"step11Notes_",state:"step-eleven-v1-resume-state"},
    12:{prefix:"step-twelve-v1-",notes:"step12Notes_",state:"step-twelve-v1-resume-state"}
  };
  function collect(){
    const data={format:"NA-Step-Working-Guide-Backup",version:1,created:new Date().toISOString(),steps:{}};
    for(let n=1;n<=12;n++){
      const cfg=STEP_KEYS[n], answers={}, notes={};
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k && k.indexOf(cfg.prefix)===0) answers[k.slice(cfg.prefix.length)]=localStorage.getItem(k);
        if(k && k.indexOf(cfg.notes)===0) notes[k.slice(cfg.notes.length)]=localStorage.getItem(k);
      }
      data.steps[n]={answers,notes,state:localStorage.getItem(cfg.state)};
    }
    return data;
  }
  function download(){
    const blob=new Blob([JSON.stringify(collect(),null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="NA-Step-Working-Guide-Backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  function restore(file){
    const reader=new FileReader();
    reader.onerror=()=>alert("The backup file could not be read.");
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        if(data.format!=="NA-Step-Working-Guide-Backup" || !data.steps) throw new Error();
        let restored=0;
        for(let n=1;n<=12;n++){
          const cfg=STEP_KEYS[n], s=data.steps[n]||data.steps[String(n)];
          if(!s) continue;
          if(s.answers) Object.keys(s.answers).forEach(k=>{localStorage.setItem(cfg.prefix+k,String(s.answers[k]??""));restored++;});
          if(s.notes) Object.keys(s.notes).forEach(k=>localStorage.setItem(cfg.notes+k,String(s.notes[k]??"")));
          if(s.state) localStorage.setItem(cfg.state,String(s.state));
        }
        if(!restored) throw new Error();
        alert("Backup restored successfully. "+restored+" answer entries were restored across the workbook.");
        if(typeof render==="function") render();
      }catch(e){ alert("That file is not a valid NA Step Working Guide backup."); }
    };
    reader.readAsText(file);
  }
  function addPanel(){
    if(typeof mode==="undefined" || mode!=="intro" || document.getElementById("backupPanel")) return;
    const next=document.getElementById("next"); if(!next) return;
    const wrap=document.createElement("div"); wrap.id="backupPanel";
    wrap.style.cssText="margin:18px 0 8px;padding:16px;border:1px solid #ddd;border-radius:14px;background:#f7f7f8;text-align:left";
    wrap.innerHTML='<div style="font-size:18px;font-weight:700;margin-bottom:6px">Backup & Restore</div><div style="font-size:14px;line-height:1.45;margin-bottom:12px">Your answers save automatically on this device. Create a backup file if you want to keep a copy or move your work to another device.</div>';
    const exp=document.createElement("button"); exp.className="secondary"; exp.textContent="Export My Answers"; exp.style.margin="4px 6px 4px 0"; exp.onclick=download;
    const label=document.createElement("label"); label.textContent="Restore My Answers"; label.style.cssText="display:inline-block;border-radius:10px;padding:12px 15px;background:#222;color:#fff;font-size:15px;cursor:pointer;margin:4px 0";
    const input=document.createElement("input"); input.type="file"; input.accept=".json,application/json,text/plain"; input.style.display="none"; input.onchange=()=>{if(input.files&&input.files[0]) restore(input.files[0]);};
    label.appendChild(input); wrap.appendChild(exp); wrap.appendChild(label); next.parentNode.insertBefore(wrap,next);
  }
  const old=document.createElement('style'); old.textContent='#restoreAnswersWrap{display:none!important}'; document.head.appendChild(old);
  new MutationObserver(addPanel).observe(document.body,{childList:true,subtree:true}); setTimeout(addPanel,100);
})();
</script>

<script id="naCompactNav">
(function(){
  function txt(el){return (el.innerText||el.textContent||"").trim().replace(/\s+/g," ");}
  function setup(){
    var bottom=document.querySelector(".bottom");
    if(!bottom)return;
    var home=document.getElementById("home"), back=document.getElementById("back"), next=document.getElementById("next");
    if(!home||!back||!next)return;

    var drawer=document.getElementById("naToolsDrawer");
    if(!drawer){
      drawer=document.createElement("div");
      drawer.id="naToolsDrawer";
      drawer.innerHTML='<div class="tools-title">Step Tools</div>';
      document.body.appendChild(drawer);
    }
    var tools=document.getElementById("mobileToolsButton");
    if(!tools){
      tools=document.createElement("button");
      tools.id="mobileToolsButton";
      tools.type="button";
      tools.className="secondary";
      tools.textContent="Tools";
      tools.onclick=function(e){e.stopPropagation();drawer.classList.toggle("open");};
    }
    if(tools.parentNode!==bottom) bottom.insertBefore(tools,next);

    var primary=[home,back,tools,next];
    Array.prototype.slice.call(bottom.children).forEach(function(el){
      if(primary.indexOf(el)!==-1)return;
      el.classList.add("tool-item");
      drawer.appendChild(el);
    });

    var panel=document.getElementById("backupPanel");
    if(panel && panel.parentNode!==drawer){
      drawer.appendChild(panel);
    }
  }
  function run(){setup();}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run);else run();
  [100,300,700,1200].forEach(function(ms){setTimeout(run,ms);});
  new MutationObserver(run).observe(document.body,{childList:true,subtree:true});
  document.addEventListener("click",function(e){
    var drawer=document.getElementById("naToolsDrawer"),tools=document.getElementById("mobileToolsButton");
    if(drawer&&drawer.classList.contains("open")&&!drawer.contains(e.target)&&e.target!==tools)drawer.classList.remove("open");
  });
})();
</script>
