<meta name="theme-color" content="#fff"><title>An Interactive Working Guide to the 12 Steps of NA — Step 6</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}header{position:sticky;top:0;z-index:5;background:#fffffff5;backdrop-filter:blur(10px);border-bottom:1px solid #ddd;padding:14px 18px}
.title{font-size:22px;font-weight:750}.sub{font-size:13px;color:#666;margin-top:2px}.progress{height:4px;background:#eee}.bar{height:100%;background:#444;width:0;transition:.2s}
main{padding:22px 18px 120px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#666;font-weight:750;margin-bottom:8px}
h1{font-size:29px;line-height:1.18;margin:0 0 18px}.reading{font-size:17px;line-height:1.68;white-space:pre-line;color:#303238}
.card{background:#fafafa;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:20px}
.question{font-size:21px;line-height:1.45;font-weight:650;margin:12px 0 18px}textarea{width:100%;min-height:300px;border:1px solid #aaa;border-radius:12px;padding:15px;font:17px/1.5 inherit;resize:vertical;outline:none}
textarea:focus{border-color:#333;box-shadow:0 0 0 3px #0001}button{border:0;border-radius:10px;padding:12px 15px;background:#222;color:#fff;font-size:15px;cursor:pointer}

</style></head><body><div class="app">
<header><div class="title">An Interactive Working Guide to the 12 Steps of NA</div><div class="sub"></div></header>
<div class="progress"><div id="bar" class="bar"></div></div><main id="main"></main>
<div class="bottom"><button id="home" class="secondary">Home</button><button id="back" class="secondary">← Back</button><button id="next">Begin Step 6 →</button></div>
</div>
<script>
const INTRO="\"We were entirely ready to have God remove all these defects of character.\" We begin working Step Six full of the hope we have developed in the first five steps. If we have been thorough, we have also developed some humility. In Step Six, \"humility\" means that we're able to see ourselves more clearly. We've seen the exact nature of our wrongs. We've seen how we've harmed ourselves and others by acting on our defects of character. We've seen the patterns of our behavior, and we've come to understand how we are likely to act on the same defects over and over. Now we have to become entirely ready to have our defects of character removed. Becoming entirely ready won't happen in an instant. It's a long process, often taking place over the course of a whole lifetime. Immediately following an inventory, we may feel very ready indeed to have our defects removed. If we've been around awhile and are generally pretty well aware of what our defects are, and we still act on one of them, we'll naturally find that our willingness level rises. Awareness alone will never be enough to ensure our readiness, but it's the necessary first step on the path to readiness. The inventory process itself has raised our awareness about our character defects; working the Sixth Step will do so even more. To be entirely ready is to reach a spiritual state where we are not just aware of our defects; not just tired of them; not just confident that the God of our understanding will remove what should go-but all these things. In order to become entirely ready1 we'll need to address our fears about the Sixth Step. We'll also need to take a look at how our defects will be removed. The Sixth Step says that only a Higher Power can remove them, but what does that mean in practical terms? What is our responsibility in the Sixth Step? These questions, when reviewed with a sponsor, will help give us direction in working this step.";
const SECTIONS=[{"name": "Entirely Ready For What?", "reading": "If we're new in NA and this is our first experience with the Sixth Step, many of our character defects will be so blatant that our immediate reaction will likely be one of overwhelming willingness to get rid of them. We're seeing them for the first time, in all their glory, so to speak, and we want them gone - today! Once we've gotten past our initial reaction, we'll find that we probably have at least some measure of fear or uncertainty about changing. The unknown is terrifying for almost everyone. We've had the defects we're about to let go of for a long time, probably most of our lives. We probably have some fears about what our lives will be like without these defects. Some of them may seem more like vital survival skills than defects of character. We wonder if the removal of our defects will inhibit our ability to earn a living. We may find that the idea of being a \"respectable citizen\" is repulsive to us. Many of us are strongly attached to an image -we're cool, we're trendy, we're outside the bounds of polite society, and we like it that way. We may be afraid that by working the Sixth Step we'll be changed into dull conformists. Some of us may think that we're nothing but defects, and wonder what will be left of us if our defects are removed. Our fears are probably vague and unformed. If we pursue them to their logical conclusion, we're sure to find that they are unfounded. In other words, if we say them out loud, we can see them for what they are.\n\nIf we've had some previous experience with the Sixth Step, our character defects are nothing new. In fact, we may be feeling dismayed right now that we still have a certain defect, or we may be upset because we're looking at the same old defect in a new manifestation. For instance, we're still insecure. We may no longer run around indulging in a series of transparent attempts to convince others that we're big shots, but we still have the defect. The way we've been acting on it lately is far more subtle and far more insidious. We may have been unconsciously sabotaging the efforts of others so that we can look better by comparison, or trampling on someone else's desires because they don't directly serve our own needs. What's especially painful about realizations such as this in later recovery is that we've tended to think of ourselves in a better light. We're deeply ashamed of harming others. We may feel a dull fear that we're incapable of change, that one character defect or another is here to stay. We can draw some measure of comfort from the fact that we're now aware of what we've been doing and are willing to work on it. We need to maintain a sense of hope and trust that the process of recovery works even on the most firmly entrenched defects.", "count": 4}, {"name": "To Have God Remove...", "reading": "Yes, the Sixth Step specifies that only a Power greater than ourselves can remove our defects of character. However, the extent to which most of us grasp what that actually means is directly influenced by how much experience we have with the up-and-down, on- again off-again struggle and surrender associated with Step Six. The first thing most of us do about our character defects is decide not to have them. Unfortunately, this is futile - about as effective as attempting to control our using. We may have some apparent success for a time, but our defects will eventually resurface. The problem is that our defects are part of us. We will always be subject to reverting to our worst character defects in stressful situations. What we need to do in the Sixth Step is much like what we had to do in the first two steps. We have to admit that we have been defeated by an internal force that has brought nothing but pain and degradation to our lives; then, we have to admit we need help in dealing with that force. We must completely accept the fact that we cannot remove our own shortcomings, and we must prepare ourselves to ask in the Seventh Step for God to remove them for us.", "count": 5}, {"name": "Our Defects of Character", "reading": "Even after all the work we've done in the Fourth and Fifth Steps, we're still not entirely clear at this point about the nature of our defects of character. We're probably wondering where, precisely, our character defects end and our character begins within the complex structure of our personality. Why do we do the things we do? Is it someone's fault? When did we first feel this way? Why? How? Where? If we're not careful, we can become so self-obsessed that we lose sight of why we're working a Sixth Step. We need to focus our efforts. Our goal is to raise our awareness of our character defects so that we can become entirely ready to have them removed, not to analyze their origin or indulge in a bout of self-absorption. Our character defects are indicators of our basic nature. We are likely to find that we have the same basic nature as anyone else. We have needs, and we try to get them met. For instance, we need love. How we go about getting love is where our defects come into play If we lie, cheat, or harm others and degrade ourselves to get love, we are acting on defects. As defined in It Works: How and Why, our defects are basic human traits that have been distorted by our self-centeredness. With our sponsor's help, we need to list each defect we have, describe the ways in which we act on it, look at how it affects our lives, and, very importantly, find out what we're feeling when we practice it. Imagining what our life would be like without each defect will help us see that we can live without them. Some of us take practical action by finding out what the opposite spiritual principle would be for each character defect.", "count": 5}, {"name": "Spiritual Principles", "reading": "In the Sixth Step, we will focus on commitment and perseverance, willingness, faith and trust, and self-acceptance. At this point in our Sixth Step work, we should be acutely aware of our shortcomings. In fact, we're probably so aware of them that, in the course of our daily lives, we can see them coming and even stop ourselves from acting on them much of the time. At times, our awareness may fade, and we may no longer be as vigilant in watching our behavior. It takes an incredible amount of energy to monitor ourselves every second and curb every impulse to act out. We'll relax into everyday life until, all of a sudden, we'll be left feeling sick and ashamed and wondering how, after all the work we've done, we could have possibly done that again. However, we do not give up. Instead, we make a commitment to our recovery. We maintain our newly emerging principles despite our setback. We keep taking steps forward even though we've taken one or more backward. We're looking for gradual improvement, not instant faultlessness.\n\nApplying the spiritual principle of willingness means, very simply, that we are willing to act differently. It does not necessarily mean that we will act differently or even that we're capable of doing so. We can perhaps best illustrate this attitude by an example. Suppose we've been dishonest- with our families, with our employers, with our friends - in many ways, ranging from the minor to the severe. While it may seem better to become willing in \"layers,\" focusing our willingness on the worst or most destructive forms of dishonesty first, this step says that we were entirely ready to have all our defects removed. That means being willing never to be dishonest again, even in a minor way. This may seem like more than we can expect of ourselves, but we only have to do it for today. It's hard to have this kind of willingness, especially when the apparent consequences for mild dishonesty aren't so severe. We may be aware that we're not being entirely honest, but we think we're not hurting anyone and we're getting away with it, so why be concerned about it? But it's this kind of thinking that has perhaps the most severe spiritual consequences. It may turn out that no one is obviously harmed by our dishonesty, and that no one ever finds out, but the dishonesty reverberates in our spirits from then on. Even if we're not consciously aware of it, even if we sleep just fine at night, the result of acting on a defect when we have the ability not to is an impairment of our spiritual growth. If we continue being unwilling, we'll eventually paralyze our spiritual growth.\n\nThe amount of willingness we have to develop in this step requires a corresponding amount of faith and trust. We have to believe that a Higher Power is going to work in our lives to the exact degree that's necessary. Continuing with the example of dishonesty, we have to trust that our Higher Power isn't going to remove the defect of dishonesty from our lives to such a degree that we become brutally honest, incapable of remaining silent even when speaking the truth would hurt someone. As long as we get out of the way so that God can work in our lives, we'll experience the exact degree of spiritual growth we need.\n\nWith words like \"entirely\" and \"all\" playing such a prominent role in this step, it's easy to become overly self-critical and perfectionistic. We need to remember that even though our willingness must be complete, we're not going to become perfect-not today, not ever. When we act out on a defect against our will, we need to practice the principle of self- acceptance. We need to accept that while we're still capable of acting out, we're also still willing to change; with that acknowledgment, we renew our commitment to be changed. We've grown exactly as much as we were supposed to for today, and if we were perfect, we would have no further need to grow.", "count": 7}, {"name": "Moving On", "reading": "We may have had fleeting glimpses in the past of what we could become - maybe during childhood, maybe during our active addiction. We probably thought either that life didn't put us in a place where we could become what we dreamed of, or that we were just innately incapable of rising to a higher place. We may once have dreamed of money, or status, or position. In the spiritual program of Narcotics Anonymous, we're more concerned with spiritual growth. We want to think about qualities we wish we had, or about other people we know in recovery who have qualities we wish to emulate. As we work this step, we begin developing a vision of the person we'd like to become. If we have been selfish, we probably have a vision of becoming selfless, maybe by helping another addict find recovery or by some other act of selfless giving. If we've been lazy, we may see ourselves becoming productive and reaping the rewards of our efforts. If we've been dishonest, we may have a dream of the freedom that can be ours when we no longer have to spend so much time worrying about being found out. We want to get from this step a vision of ourselves and a sense of hope that we can attain that vision.\n\nThis vision can be our inspiration. Recalling it during the times when we feel despair, or when it seems to be taking a long time to reach our goals, will sustain us and help us renew our willingness. Our vision is our springboard into Step Seven, where we'll ask the God of our understanding to remove our shortcomings. Step Seven", "count": 1}];
const QUESTIONS=[{"sectionIndex": 0, "text": "Are there parts of me I like, but which might be \"defects\"? Am I afraid I'll turn into someone I don't like if those parts of my character are removed?"}, {"sectionIndex": 0, "text": "What do I think will be removed?"}, {"sectionIndex": 0, "text": "Do I still believe in the process of recovery? Do I believe I can change? How have I changed so far? What defects do I no longer have to act on?"}, {"sectionIndex": 0, "text": "Do I have any defects that I think cannot be removed? What are they? Why do I think they cannot be removed?"}, {"sectionIndex": 1, "text": "How am I trying to remove or control my own character defects? What have my attempts resulted in?"}, {"sectionIndex": 1, "text": "What is the difference between being entirely ready to have God remove my defects of character and suppressing them myself?"}, {"sectionIndex": 1, "text": "How am I increasing my trust in the God of my understanding by working this step?"}, {"sectionIndex": 1, "text": "How does my surrender deepen in this step?"}, {"sectionIndex": 1, "text": "What action can I take that shows that I am entirely ready?"}, {"sectionIndex": 2, "text": "List each defect, and give a brief definition of it."}, {"sectionIndex": 2, "text": "In what ways do I act on this defect?"}, {"sectionIndex": 2, "text": "When I act on this defect, what effect does it have on myself and others?"}, {"sectionIndex": 2, "text": "What feelings do I associate with this defect? Am I trying to suppress certain feelings by acting on certain defects?"}, {"sectionIndex": 2, "text": "What would my life be like without this behavior? Which spiritual principle can I apply instead?"}, {"sectionIndex": 3, "text": "How am I demonstrating my commitment to recovery today?"}, {"sectionIndex": 3, "text": "By working the first five steps, I have persevered in my recovery. Why is this quality so vital to the Sixth Step?"}, {"sectionIndex": 3, "text": "Am I willing to have all my defects of character removed at this time? If not, why not?"}, {"sectionIndex": 3, "text": "What have I done to show my willingness today?"}, {"sectionIndex": 3, "text": "To what degree is my fear of what I will become still present? Has it diminished since I began working this step?"}, {"sectionIndex": 3, "text": "How am I increasing my trust in the God of my understanding by working this step?"}, {"sectionIndex": 3, "text": "Do I accept myself today? What do I like about myself? What has changed since I've been working the steps?"}, {"sectionIndex": 4, "text": "What do I see myself doing with the qualities I wish to attain? What will I do with my career? What will I do in my spare time? What kind of parent, child, partner, or friend will I be? Be specific."}];
const PREFIX="step-six-complete-v1-";
const STATE="step-six-v1-resume-state";
let mode="intro",si=0,qi=0;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function cleanReading(s){return s.replace(/\s+/g," ").trim();}
function saveAnswer(){const a=document.getElementById("answer");if(a)localStorage.setItem(PREFIX+qi,a.value)}
function getState(){try{return JSON.parse(localStorage.getItem(STATE)||"null")}catch(e){return null}}
function saveState(){localStorage.setItem(STATE,JSON.stringify({mode:mode,si:si,qi:qi}))}
function hasAnswers(){return QUESTIONS.some((_,i)=>localStorage.getItem(PREFIX+i))}
function update(){document.getElementById("bar").style.width=(mode==="intro"?0:mode==="reading"?((si)/SECTIONS.length*100):((qi+1)/QUESTIONS.length*100))+"%";}

function getResumeState(){
 try{
   const raw=localStorage.getItem(STATE);
   return raw ? JSON.parse(raw) : null;
 }catch(e){ return null; }
}
function saveResumeState(){
 if(mode==="question" || mode==="reading"){
   localStorage.setItem(STATE,JSON.stringify({mode:mode,si:si,qi:qi}));
 }
}
function toc(){
 mode="toc";
 main.innerHTML='<div class="eyebrow">Narcotics Anonymous</div><h1>Table of Contents</h1>'+
   '<div class="card"><div class="reading">Choose a step to begin or continue your work. You can return here at any time.</div></div>'+
   '<div id="tocList"></div>';
 const list=document.getElementById("tocList");
 const steps=["One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve"];
 steps.forEach(function(name,idx){
   const n=idx+1;
   const b=document.createElement("button");
   b.textContent="Step "+name;
   b.style.cssText="display:block;width:100%;text-align:left;margin:10px 0;padding:16px 18px;font-size:17px";
   b.onclick=function(){window.location.href="NA_Step_"+n+"_WORKING_COPY.html"};
   list.appendChild(b);
 });
 back.disabled=true;
 next.textContent="Begin Step Six →";
 update();
}
function intro(){
 mode="intro";
  document.querySelector("header .sub").textContent="Step Six";
  document.title="An Interactive Working Guide to the 12 Steps of NA — Step Six";
 const saved=getResumeState();
 let resumeText="";
 if(saved && saved.mode!=="intro"){
   if(saved.mode==="question"){
     const q=QUESTIONS[saved.qi];
     resumeText=q.section+" — Question "+q.number+" of "+q.count;
   } else {
     resumeText=SECTIONS[saved.si].name+" — Reading";
   }
 }
 main.innerHTML=
   '<div class="eyebrow">Step 6</div><h1>Step 6</h1>'+
   '<div class="card"><div class="reading">'+esc(cleanReading(INTRO))+'</div></div>'+
   (resumeText?
     '<div class="resume" style="border:1px solid #ddd;border-radius:14px;padding:16px;background:#fafafa;margin:18px 0">'+
       '<div class="eyebrow">Continue Where You Left Off</div>'+
       '<div style="font-size:17px;line-height:1.4;margin-bottom:12px">'+esc(resumeText)+'</div>'+
       '<button id="continue">Continue Step 6 →</button>'+
     '</div>':'');
 if(saved && resumeText){
   document.getElementById("continue").onclick=function(){
     mode=saved.mode; si=saved.si; qi=saved.qi; render();
   };
 }
 back.disabled=true;
 next.textContent=resumeText?"Restart Step 6":"Begin Step 6 →";
 update();
}
function reading(){
 mode="reading";saveResumeState();const s=SECTIONS[si];
 main.innerHTML='<div class="eyebrow">Section '+(si+1)+' of '+SECTIONS.length+'</div><h1>'+esc(s.name)+'</h1><div class="card"><div class="reading">'+esc(cleanReading(s.reading))+'</div></div><button id="begin">Begin this section’s questions →</button>';
 document.getElementById("begin").onclick=function(){qi=QUESTIONS.findIndex(q=>q.sectionIndex===si);mode="question";render()};
 back.disabled=si===0;next.textContent="Questions →";update();
}
function question(){
 mode="question";saveResumeState();const q=QUESTIONS[qi],ans=localStorage.getItem(PREFIX+qi)||"";
 main.innerHTML='<div class="eyebrow">'+esc(q.section)+' • Question '+q.number+' of '+q.count+'</div><div class="question">• '+esc(q.text)+'</div><textarea id="answer" placeholder="Type your answer here...">'+esc(ans)+'</textarea><div class="status">Saved automatically on this device.</div>';
 const a=document.getElementById("answer");a.addEventListener("input",function(){localStorage.setItem(PREFIX+qi,a.value);saveState()});
 back.disabled=qi===0;next.textContent=qi===QUESTIONS.length-1?"Finish Step 6":"Save & Next →";update();
}
function render(){
  if(mode==="welcome")welcome();
  else if(mode==="toc")toc();
  else if(mode==="intro")intro();
  else if(mode==="reading")reading();
  else question();
  saveResumeState();
  update();
}
home.onclick=function(){if(mode==="question")saveAnswer();mode="intro";render()};
back.onclick=function(){
 if(mode==="question"){saveAnswer();const current=QUESTIONS[qi].sectionIndex,first=QUESTIONS.findIndex(q=>q.sectionIndex===current);if(qi===first){si=current;mode="reading"}else qi--;render()}
 else if(mode==="reading"){if(si===0)mode="intro";else si--;render()}
 else if(mode==="toc"){mode="welcome";render()}
};
next.onclick=function(){
  if(mode==="intro"){
   const saved=getResumeState();
   if(saved && next.textContent==="Restart Step 6"){
     if(confirm("Restart Step 6? Your saved answers will remain on this device.")){
       si=0;qi=0;mode="reading";render();
     }
   }else{
     si=0;qi=0;mode="reading";render();
   }
   return;
}
 if(mode==="reading"){qi=QUESTIONS.findIndex(q=>q.sectionIndex===si);mode="question";render();return}
 saveAnswer();
 if(qi<QUESTIONS.length-1){const old=QUESTIONS[qi].sectionIndex;qi++;if(QUESTIONS[qi].sectionIndex!==old){si=QUESTIONS[qi].sectionIndex;mode="reading"}render()}
 else{alert("Step 6 is complete. Your answers remain saved on this device. Moving to Step 7.");window.location.href="NA_Step_7_WORKING_COPY.html"}
};
render();
</script>
<script>
(function(){
  function reviewAnswers(){
    var overlay=document.createElement("div");
    overlay.id="reviewOverlay";
    overlay.style.cssText="position:fixed;inset:0;background:#fff;z-index:99999;overflow:auto;padding:22px 18px 110px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202124";

    var close=document.createElement("button");
    close.textContent="← Home";
    close.className="secondary";
    close.onclick=function(){overlay.remove()};
    overlay.appendChild(close);

    var h=document.createElement("h1");
    h.textContent="Step 6 — Review My Answers";
    overlay.appendChild(h);

    // Review / Share tabs for the Review My Answers page.
    var tabBar=document.createElement("div");
    tabBar.style.cssText="display:flex;gap:8px;margin:14px 0 20px;border-bottom:1px solid #ddd;padding-bottom:10px";
    var reviewTab=document.createElement("button");
    reviewTab.textContent="Review My Answers";
    reviewTab.className="secondary";
    var shareTab=document.createElement("button");
    shareTab.textContent="Share";
    shareTab.className="secondary";
    tabBar.appendChild(reviewTab); tabBar.appendChild(shareTab);
    overlay.appendChild(tabBar);

    var reviewContent=document.createElement("div");
    overlay.appendChild(reviewContent);

    var shareContent=document.createElement("div");
    shareContent.style.display="none";
    shareContent.className="card";
    var shareTitle=document.createElement("h2");
    shareTitle.textContent="Share Step 6 — My Review Answers";
    shareContent.appendChild(shareTitle);
    var shareIntro=document.createElement("p");
    shareIntro.textContent="Choose how you would like to share your saved answers with your sponsor or another person.";
    shareContent.appendChild(shareIntro);
    var shareButtons=document.createElement("div");
    shareButtons.style.cssText="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px";
    var emailBtn=document.createElement("button"); emailBtn.textContent="Email";
    var textBtn=document.createElement("button"); textBtn.textContent="Text Message";
    var clipBtn=document.createElement("button"); clipBtn.textContent="Copy to Clipboard";
    shareButtons.appendChild(emailBtn); shareButtons.appendChild(textBtn); shareButtons.appendChild(clipBtn);
    shareContent.appendChild(shareButtons);
    var shareStatus=document.createElement("div");
    shareStatus.style.cssText="margin-top:12px;color:#666";
    shareContent.appendChild(shareStatus);
    overlay.appendChild(shareContent);

    function buildReviewShareText(){
      var lines=["An Interactive Working Guide to the 12 Steps of NA","Step 6 — My Review Answers",""];
      var has=false;
      SECTIONS.forEach(function(section,si){
        var sectionHas=false;
        var sectionLines=[];
        QUESTIONS.forEach(function(q,index){
          if(q.sectionIndex===si){
            var a=localStorage.getItem(PREFIX+index)||"";
            if(a.trim()!==""){
              has=true; sectionHas=true;
              sectionLines.push("• "+q.text);
              sectionLines.push("My Answer:");
              sectionLines.push(a.trim());
              sectionLines.push("");
            }
          }
        });
        if(sectionHas){ lines.push(section.name.toUpperCase()); lines.push(""); lines=lines.concat(sectionLines); }
      });
      if(!has) lines.push("No answers have been saved yet.");
      return lines.join("\n").trim();
    }

    reviewTab.onclick=function(){ reviewContent.style.display="block"; shareContent.style.display="none"; };
    shareTab.onclick=function(){ reviewContent.style.display="none"; shareContent.style.display="block"; };
    emailBtn.onclick=function(){ window.location.href="mailto:?subject="+encodeURIComponent("NA Step 6 — My Review Answers")+"&body="+encodeURIComponent(buildReviewShareText()); };
    textBtn.onclick=function(){ window.location.href="sms:?&body="+encodeURIComponent(buildReviewShareText()); };
    clipBtn.onclick=function(){
      var txt=buildReviewShareText();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){shareStatus.textContent="Your review answers have been copied to the clipboard.";}).catch(function(){shareStatus.textContent="Clipboard access was not available on this device.";});
      } else {
        var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.left="-9999px"; document.body.appendChild(ta); ta.select();
        try{document.execCommand("copy"); shareStatus.textContent="Your review answers have been copied to the clipboard.";}catch(e){shareStatus.textContent="Clipboard access was not available on this device.";}
        document.body.removeChild(ta);
      }
    };

    var found=false;

    SECTIONS.forEach(function(section,si){
      var answered=[];
      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex===si){
          var a=localStorage.getItem(PREFIX+index)||"";
          if(a.trim()!=="") answered.push({q:q,index:index,a:a});
        }
      });

      if(answered.length){
        found=true;

          };

          reviewContent.appendChild(card);
        });

    if(!found){

<script>
(function(){
  
  function restoreAnswers(file){
    if(!file){
      alert("No backup file was selected.");
      return;
    }

    var reader=new FileReader();

    reader.onerror=function(){
      alert("Safari could not read that backup file.");
    };

    reader.onload=function(){
      try{
        var data=JSON.parse(reader.result);

        if(!data || !data.answers || typeof data.answers!=="object"){
          throw new Error("Invalid backup format");
        }

        var restored=0;
        if(data.notes && typeof data.notes==="object"){
          Object.keys(data.notes).forEach(function(si){
            if(typeof SECTIONS!=="undefined" && SECTIONS[Number(si)]){
              localStorage.setItem(NOTES_PREFIX+si,String(data.notes[si]||""));
            }
          });
        }

        Object.keys(data.answers).forEach(function(index){
          var n=Number(index);
          if(Number.isInteger(n) && typeof QUESTIONS!=="undefined" && QUESTIONS[n]){
            localStorage.setItem(PREFIX+n,String(data.answers[index]));
            restored++;
          }
        });

        if(restored===0){
          throw new Error("No matching answers");
        }

        alert(restored+" saved answer"+(restored===1?"":"s")+" restored.");
        if(typeof render==="function") render();

      }catch(e){
        alert("That file could not be restored. Please choose a Step 6 backup file created by this app.");
      }
    };

    reader.readAsText(file);
  }
  function addBackupButtons(){
    if(typeof mode==="undefined" || mode!=="intro") return;
    var nextButton=document.getElementById("next");
    if(!nextButton) return;


    if(!document.getElementById("restoreAnswersWrap")){
      var wrap=document.createElement("div");
      wrap.id="restoreAnswersWrap";
      wrap.style.cssText="margin-top:8px";

      var label=document.createElement("label");
      label.className="secondary";
      label.textContent="Restore My Answers";
      label.style.cssText="display:inline-block;cursor:pointer";

      var input=document.createElement("input");
      input.type="file";
      input.accept=".json,application/json,text/plain";
      input.style.cssText="display:block;margin-top:8px;max-width:100%";
      input.onchange=function(){
        if(input.files && input.files.length){
          restoreAnswers(input.files[0]);
        }
      };

      wrap.appendChild(label);
      wrap.appendChild(input);
      nextButton.parentNode.insertBefore(wrap,nextButton);
    }
  }
  var observer=new MutationObserver(function(){addBackupButtons()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addBackupButtons,100);
})();
</script>


<script>
(function(){
  function addCompletionSystem(){
    if(typeof SECTIONS==="undefined" || typeof QUESTIONS==="undefined") return;

    function sectionStats(si){
      var answered=0,total=0;
      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex===si){
          total++;
          if((localStorage.getItem(PREFIX+index)||"").trim()!=="") answered++;
        }
      });
      return {answered:answered,total:total,complete:total>0 && answered===total};
    }

    // Enhance the existing My Progress overlay after it is opened.
    var originalShowProgress=window.showProgress;
    if(typeof originalShowProgress!=="function" || originalShowProgress.__completionEnhanced) return;

    function enhancedProgress(){
      originalShowProgress();

      setTimeout(function(){
        var overlay=document.getElementById("progressOverlay");
        if(!overlay) return;

        var cards=overlay.querySelectorAll(".card");
        var sectionCards=[];
        cards.forEach(function(card){
          var title=card.querySelector("div");
          if(title && title.textContent && title.textContent!=="Overall Progress"){
            sectionCards.push(card);
          }
        });

        SECTIONS.forEach(function(section,si){
          var stats=sectionStats(si);
          var card=sectionCards[si];
          if(!card) return;

          var badge=card.querySelector(".completionBadge");
          if(!badge){
            badge=document.createElement("div");
            badge.className="completionBadge";
            badge.style.cssText="font-size:12px;font-weight:750;letter-spacing:.07em;margin-top:9px";
            card.appendChild(badge);
          }

          if(stats.complete){
            badge.textContent="✓ COMPLETED";
            badge.style.color="#2f6b3f";
          }else if(stats.answered>0){
            badge.textContent="IN PROGRESS";
            badge.style.color="#666";
          }else{
            badge.textContent="NOT STARTED";
            badge.style.color="#999";
          }
        });

        var allComplete=SECTIONS.every(function(_,si){return sectionStats(si).complete;});
        if(allComplete){
          var done=document.createElement("div");
          done.className="card";
          done.style.marginTop="18px";
          done.innerHTML="<strong>✓ STEP SIX COMPLETED</strong><div style='margin-top:8px;font-size:16px;line-height:1.5'>You have answered every Step 6 question.</div>";
          overlay.appendChild(done);
        }
      },0);
    }

    enhancedProgress.__completionEnhanced=true;
    window.showProgress=enhancedProgress;
  }

  var observer=new MutationObserver(function(){addCompletionSystem()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addCompletionSystem,100);
})();
</script>

<button id="shareReview" type="button" onclick="shareReview()" style="margin:10px 0;">Share</button>
<div id="sharePanel" class="share-panel">
  <strong>Share Step 6 — Review My Answers</strong>
  <div class="share-actions">
    <button type="button" onclick="shareByEmail()">Email</button>
    <button type="button" onclick="shareByText()">Text Message</button>
    <button type="button" onclick="copyReviewToClipboard()">Copy to Clipboard</button>
  </div>
  <div id="shareStatus" class="share-status"></div>
</div>

<script>
function getStepReviewText() {
  const step = 6;
  let lines = [];
  lines.push("An Interactive Working Guide to the 12 Steps of NA");
  lines.push("Step " + step + " — My Review Answers");
  lines.push("");
  const root = document.body;
  // Collect visible question/answer pairs from the current Step 6 review.
  // Prefer review containers and textarea/input values, while avoiding navigation controls.
  const fields = Array.from(root.querySelectorAll("textarea, input[type='text'], input:not([type])"));
  let q = 0;
  fields.forEach(el => {
    if (!el.offsetParent) return;
    const value = (el.value || "").trim();
    if (!value) return;
    const prev = el.closest(".question, .q, .card, .section, div");
    let label = "";
    if (prev) {
      const heading = prev.querySelector("h1,h2,h3,h4,strong,label");
      if (heading) label = heading.textContent.trim();
    }
    if (!label) {
      q++;
      label = "Answer " + q;
    }
    lines.push(label + ":");
    lines.push(value);
    lines.push("");
  });
  // If the review page has generated text, include it as a fallback.
  if (lines.length <= 4) {
    const review = document.querySelector("#review, .review, [id*='review']");
    if (review) {
      const clone = review.cloneNode(true);
      clone.querySelectorAll("button, script, style").forEach(x => x.remove());
      const body = clone.innerText.trim();
      if (body) lines.push(body);
    }
  }
  return lines.join("\n").trim();
}

function shareReview() {
  const panel = document.getElementById("sharePanel");
  if (panel) panel.classList.toggle("show");
}

function shareByEmail() {
  const body = encodeURIComponent(getStepReviewText());
  window.location.href = "mailto:?subject=" + encodeURIComponent("NA Step 6 — My Review Answers") + "&body=" + body;
}

function shareByText() {
  const body = encodeURIComponent(getStepReviewText());
  // sms: works across common iOS/Android configurations; the user selects the recipient.
  window.location.href = "sms:?&body=" + body;
}

async function copyReviewToClipboard() {
  const text = getStepReviewText();
  try {
    await navigator.clipboard.writeText(text);
    const status = document.getElementById("shareStatus");
    if (status) status.textContent = "Review answers copied to the clipboard.";
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      const status = document.getElementById("shareStatus");
      if (status) status.textContent = "Review answers copied to the clipboard.";
    } finally {
      document.body.removeChild(ta);
    }
  }
}
</script>
