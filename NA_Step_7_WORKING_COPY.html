</style></head><body><div class="app">
<header><div class="title">An Interactive Working Guide to the 12 Steps of NA</div><div class="sub"></div></header>
<div class="progress"><div id="bar" class="bar"></div></div><main id="main"></main>
<div class="bottom"><button id="home" class="secondary">Home</button><button id="back" class="secondary">← Back</button><button id="next">Begin Step 7 →</button></div>
</div>
<script>
const INTRO="\"We humbly asked Him to remove our shortcomings.\" Though each of the Twelve Steps is a separate process unto itself, they all blend together to some degree as their parts interact with one another - aspects of Step One fusing into Step Two, components of Step Four meshing into the following steps. Perhaps the finest line between two steps is the one between Steps Six and Seven. At first glance, Step Seven may seem almost an afterthought to Step Six. We spent a great deal of time and effort raising our awareness of our character defects in Step Six and getting to the point where we were entirely ready to have them removed; now all we need to do is ask, right? Not exactly. There's much more to this step than just filing a request with our Higher Power and waiting for a response. There's spiritual preparation. There's the need to develop an understanding about what \"humbly\" means in this context. There's the need to find a way of asking that fits into our individual spiritual paths. And there's the need to practice spiritual principles in the place of character defects.";
const SECTIONS=[{"name": "Preparing To Work Step Seven", "reading": "We've already done much of the spiritual preparation we'll need to begin Step Seven. It's important that we draw the connection between the work we've done and the results that work has produced. The previous steps have all served to sow the seeds of humility in our spirits. In this step, those seeds take root and grow. Many of us have difficulty with the concept of humility, and while we began addressing this issue in Step Six, it merits attention in Step Seven, too. We need to understand what humility is for ~s and how its presence is revealed in our lives. We should not confuse humility with humiliation. When we are humiliated, we are ashamed; we feel worthless. Humility is almost the complete opposite of this feeling. Through working the steps, we've been stripping away layers of denial, ego, and self- centeredness. We have also been building a more positive self-image and practicing spiritual principles. Before, we couldn't see our strengths because the good, healthy part of us was hidden behind our disease. Now we can. That is humility. Some examples of how humility is often revealed may help us understand this concept. We started out in recovery with fixed ideas. Since we've been in recovery, everything we believed in the past has been challenged. We've been barraged with new ideas. For instance, if we believed we were in control, just the fact that we've wound up in NA admitting our powerlessness was probably enough to change our outlook. Because of our addiction, we failed to learn the lessons that life itself would have taught us about how much control one individual has. Through our abstinence and the working of the first six steps, we have learned a great deal about how to live. Many of us came to NA with a certain \"street\" mentality. The only way we knew to get what we wanted was by approaching it indirectly and manipulating people. We didn't realize that we could just be forthright and have the same chance, if not better, of fulfilling our needs. We spent years learning to blank our facial expressions, hide our compassion, and harden ourselves. By the time we arrived in NA, we were very good at it-so good, in fact, that novice addicts were probably looking to our example the same way we looked to older addicts when we first started using. We learned to suppress all humanity and became, in many cases, completely inhuman. Removing ourselves from the arena in which such games are played exposed us to new ideas. We learned that it was okay to have feelings and to show them. We found out that the rules of the street only made sense on the street; in the real world, they were crazy and often dangerous. We became softer, more vulnerable. We no longer mistook kindness for weakness. Changing these attitudes has a dramatic effect. Oftentimes, it even changes our physical appearance. Knotted brows and jaws relax into smiles. Tears flow freely out, uncovering our drowning spirit. Many of us arrived in NA convinced that we were victims of bad luck, unfavorable circumstances, and conspiracies to thwart our good intentions. We believed we were good people, but profoundly misunderstood. We justified any harm we caused as self- defense, if we were capable of realizing that we caused harm at all. Feelings of self-pity went hand-in-hand with that attitude. We reveled in our suffering, and we secretly knew that the payoff for our pain was never, ever having to look at our part in anything. But the first six steps get us to begin to do just that-we look at our part in things. Once we thought that certain situations happened to us; now we see how those situations were really created by us. We become aware of all the opportunities we've wasted. We stop blaming other people for our lot in life. We begin to see that where we've ended up has been determined mostly by the choices we've made. Humility is a sense of our own humanness. If this is our first experience with the Seventh Step, this may be the point when we first feel a sense of compassion for ourselves. It's deeply moving to realize for the first time that we're truly just human and trying our best. We make decisions, both good and bad, and hope things turn out okay. With this knowledge about who we are, we also realize that just as we're doing our best, so are other people. We feel a real connection with others, knowing that we're all subject to the same insecurities and failings and that we all have dreams for the future. Now we need to acknowledge our own humility and explore how it makes itself known in our everyday lives.", "count": 5}, {"name": "Asking To Have Our Shortcomings Removed", "reading": "So how do we ask the God of our understanding to remove our shortcomings? The answer is likely to depend a great deal on what kind of understanding we have of God. There are many, many different ways to understand God, so many that we couldn't possibly provide examples in this guide of how each person's individual spiritual path would influence his or her Seventh Step work. Suffice it to say that our step work should reflect our own spiritual paths. As individuals, we might pick a particular personal routine or ritual as our way of asking our Higher Power to remove our shortcomings. For the purposes of this guide, we will call that prayer.\" The word \"prayer is widely accepted in our fellowship as a description of the way we communicate with our Higher Power. The tone of asking is captured in the word \"humbly.\" Coming from the place in ourselves that is most honest, the place that's closest to our spiritual center, we ask to have our shortcomings removed.", "count": 2}, {"name": "Getting Out Of The Way", "reading": "Most of us realize that we probably need to do something more in this step than just pray for our shortcomings to be removed. We need to take some action that will invite the God of our understanding to work in our lives. We can't ask God to remove a shortcoming, then hang on to it with all our might. The more distance we keep between ourselves and our Higher Power, the less we will feel that Power's presence. We have to maintain the awareness of ourselves that we gained in the Sixth Step, and add to it an awareness of God working in our lives.", "count": 4}, {"name": "Spiritual Principles", "reading": "In the Seventh Step, we will focus on surrender, trust and faith, patience, and humility. In the Seventh Step, we take our surrender to a deeper level. What began in Step One with an acknowledgment of our addiction now includes an acknowledgment of the shortcomings that go along with our addiction. We also take our Second Step surrender to a deeper level. We come to believe that our Higher Power can do more than help us stay clean. We look to that Power to relieve us of our shortcomings as well. As time goes by, we place more and more of our trust in a Higher Power and in the process of recovery.", "count": 5}, {"name": "Moving On", "reading": "At this point, we may wonder how we're supposed to be feeling. We've asked the God of our understanding to remove our shortcomings; we've faithfully practiced the principles of our program to the best of our ability; but we may still find ourselves acting out before we've had a chance to think, and always struggling with our defects. Sure, we're no longer using, and many of the outside circumstances of our lives have probably gotten better - our relationships are more stable, perhaps - but have we changed? Have we become better people? In time, we'll find that God has worked in our lives. We may even be startled by the level of maturity or spirituality we've demonstrated in handling a situation that in years past would have had us acting very unspiritual. One day, we'll realize that some of the ways we used to act have become as alien as spiritual principles were when we first started practicing them. After such a revelation, we may begin thinking about the person we were when we first came to NA and how little we resemble that person now.", "count": 5}];
const QUESTIONS=[{"sectionIndex": 0, "text": "Which of my attitudes have changed since I've been in recovery? Where has the overblown been deflated, and where has the healthy part of me been uncovered?"}, {"sectionIndex": 0, "text": "How does humility affect my recovery?"}, {"sectionIndex": 0, "text": "How does being aware of my own humility help when working this step?"}, {"sectionIndex": 0, "text": "How has my understanding of a Higher Power grown in the previous steps? How has my relationship with that Power developed?"}, {"sectionIndex": 0, "text": "How has my work on the previous steps made me ready to work the Seventh Step?"}, {"sectionIndex": 1, "text": "How will I ask the God of my understanding to remove my shortcomings?"}, {"sectionIndex": 1, "text": "Can other recovering addicts help me figure out how I'm going to ask? Have I asked them to share their experience, strength, and hope with me? Have I asked my sponsor for guidance?"}, {"sectionIndex": 2, "text": "How does the spiritual principle of surrender apply to getting out of the way so a Higher Power can work in our lives?"}, {"sectionIndex": 2, "text": "What might be the benefits of allowing a Higher Power to work in my life?"}, {"sectionIndex": 2, "text": "How do I feel, knowing that a Higher Power is caring for me and working in my life?"}, {"sectionIndex": 2, "text": "Have I accepted my powerlessness over my shortcomings as well as my addiction?"}, {"sectionIndex": 3, "text": "How has my surrender deepened?"}, {"sectionIndex": 3, "text": "Do I believe that my Higher Power will remove my shortcomings or grant me freedom from the compulsion to act on them? Do I believe that I'll be a better person as a result of working this step?"}, {"sectionIndex": 3, "text": "How does my faith in the God of my understanding become stronger as a result of working this step?"}, {"sectionIndex": 3, "text": "Where have I had opportunities for growth lately? What did I make of them?"}, {"sectionIndex": 3, "text": "Do I believe that only my Higher Power can remove my shortcomings? Or have I been trying to do it myself?"}, {"sectionIndex": 4, "text": "Have I become impatient that my shortcomings haven't been removed right away, as soon as I asked? Or am I confident that they will be removed in God's time?"}, {"sectionIndex": 4, "text": "Has my sense of perspective been out of proportion lately? Have I begun thinking of myself as more significant or more powerful than I really am?"}, {"sectionIndex": 4, "text": "Have there been times when I've been able to refrain from acting on a character defect and practice a spiritual principle instead? Do I recognize this as God working in my life?"}, {"sectionIndex": 4, "text": "Which shortcomings have been removed from my life or diminished in their power over me?"}, {"sectionIndex": 4, "text": "Why does the Seventh Step foster a sense of serenity?"}];
const PREFIX="step-seven-v1-";
const STATE="step-seven-v1-resume-state";
let mode="intro",si=0,qi=0;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function cleanReading(s){return s.replace(/\s+/g," ").trim();}
function saveAnswer(){const a=document.getElementById("answer");if(a)localStorage.setItem(PREFIX+qi,a.value)}
function getState(){try{return JSON.parse(localStorage.getItem(STATE)||"null")}catch(e){return null}}
function saveState(){localStorage.setItem(STATE,JSON.stringify({mode:mode,si:si,qi:qi}))}
function hasAnswers(){return QUESTIONS.some((_,i)=>localStorage.getItem(PREFIX+i))}
function update(){document.getElementById("bar").style.width=(mode==="intro"?0:mode==="reading"?((si)/SECTIONS.length*100):((qi+1)/QUESTIONS.length*100))+"%";}

function getResumeState(){
 try{
   const raw=localStorage.getItem(STATE);
   return raw ? JSON.parse(raw) : null;
 }catch(e){ return null; }
}
function saveResumeState(){
 if(mode==="question" || mode==="reading"){
   localStorage.setItem(STATE,JSON.stringify({mode:mode,si:si,qi:qi}));
 }
}
function toc(){
 mode="toc";
 main.innerHTML='<div class="eyebrow">Narcotics Anonymous</div><h1>Table of Contents</h1>'+
   '<div class="card"><div class="reading">Choose a step to begin or continue your work. You can return here at any time.</div></div>'+
   '<div id="tocList"></div>';
 const list=document.getElementById("tocList");
 const steps=["One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve"];
 steps.forEach(function(name,idx){
   const n=idx+1;
   const b=document.createElement("button");
   b.textContent="Step "+name;
   b.style.cssText="display:block;width:100%;text-align:left;margin:10px 0;padding:16px 18px;font-size:17px";
   b.onclick=function(){window.location.href="NA_Step_"+n+"_WORKING_COPY.html"};
   list.appendChild(b);
 });
 back.disabled=true;
 next.textContent="Begin Step Seven →";
 update();
}
function intro(){
 mode="intro";
  document.querySelector("header .sub").textContent="Step Seven";
  document.title="An Interactive Working Guide to the 12 Steps of NA — Step Seven";
 const saved=getResumeState();
 let resumeText="";
 if(saved && saved.mode!=="intro"){
   if(saved.mode==="question"){
     const q=QUESTIONS[saved.qi];
     const first=QUESTIONS.findIndex(x=>x.sectionIndex===saved.si); resumeText=SECTIONS[q.sectionIndex].name+" — Question "+(saved.qi-first+1)+" of "+SECTIONS[q.sectionIndex].count;
   } else {
     resumeText=SECTIONS[saved.si].name+" — Reading";
   }
 }
 main.innerHTML=
   '<div class="eyebrow">Step 7</div><h1>Step 7</h1>'+
   '<div class="card"><div class="reading">'+esc(cleanReading(INTRO))+'</div></div>'+
   (resumeText?
     '<div class="resume" style="border:1px solid #ddd;border-radius:14px;padding:16px;background:#fafafa;margin:18px 0">'+
       '<div class="eyebrow">Continue Where You Left Off</div>'+
       '<div style="font-size:17px;line-height:1.4;margin-bottom:12px">'+esc(resumeText)+'</div>'+
       '<button id="continue">Continue Step 7 →</button>'+
     '</div>':'');
 if(saved && resumeText){
   document.getElementById("continue").onclick=function(){
     mode=saved.mode; si=saved.si; qi=saved.qi; render();
   };
 }
 back.disabled=true;
 next.textContent=resumeText?"Restart Step 7":"Begin Step 7 →";
 update();
}
function reading(){
 mode="reading";saveResumeState();const s=SECTIONS[si];
 main.innerHTML='<div class="eyebrow">Section '+(si+1)+' of '+SECTIONS.length+'</div><h1>'+esc(s.name)+'</h1><div class="card"><div class="reading">'+esc(cleanReading(s.reading))+'</div></div><button id="begin">Begin this section’s questions →</button>';
 document.getElementById("begin").onclick=function(){qi=QUESTIONS.findIndex(q=>q.sectionIndex===si);mode="question";render()};
 back.disabled=si===0;next.textContent="Questions →";update();
}
function question(){
 mode="question";saveResumeState();const q=QUESTIONS[qi],ans=localStorage.getItem(PREFIX+qi)||"";
 const sec=SECTIONS[q.sectionIndex]; const first=QUESTIONS.findIndex(x=>x.sectionIndex===q.sectionIndex); const num=qi-first+1; main.innerHTML='<div class="eyebrow">'+esc(sec.name)+' • Question '+num+' of '+sec.count+'</div><div class="question">• '+esc(q.text)+'</div><textarea id="answer" placeholder="Type your answer here...">'+esc(ans)+'</textarea><div class="status">Saved automatically on this device.</div>';
 const a=document.getElementById("answer");a.addEventListener("input",function(){localStorage.setItem(PREFIX+qi,a.value);saveState()});
 back.disabled=qi===0;next.textContent=qi===QUESTIONS.length-1?"Finish Step 7":"Save & Next →";update();
}
function render(){
  if(mode==="welcome")welcome();
  else if(mode==="toc")toc();
  else if(mode==="intro")intro();
  else if(mode==="reading")reading();
  else question();
  saveResumeState();
  update();
}
home.onclick=function(){if(mode==="question")saveAnswer();mode="intro";render()};
back.onclick=function(){
 if(mode==="question"){saveAnswer();const current=QUESTIONS[qi].sectionIndex,first=QUESTIONS.findIndex(q=>q.sectionIndex===current);if(qi===first){si=current;mode="reading"}else qi--;render()}
 else if(mode==="reading"){if(si===0)mode="intro";else si--;render()}
 else if(mode==="toc"){mode="welcome";render()}
};
next.onclick=function(){
  if(mode==="intro"){
   const saved=getResumeState();
   if(saved && next.textContent==="Restart Step 7"){
     if(confirm("Restart Step 7? Your saved answers will remain on this device.")){
       si=0;qi=0;mode="reading";render();
     }
   }else{
     si=0;qi=0;mode="reading";render();
   }
   return;
}
 if(mode==="reading"){qi=QUESTIONS.findIndex(q=>q.sectionIndex===si);mode="question";render();return}
 saveAnswer();
 if(qi<QUESTIONS.length-1){const old=QUESTIONS[qi].sectionIndex;qi++;if(QUESTIONS[qi].sectionIndex!==old){si=QUESTIONS[qi].sectionIndex;mode="reading"}render()}
 else{alert("Step 7 is complete. Your answers remain saved on this device. Moving to Step 8.");window.location.href="NA_Step_8_WORKING_COPY.html"}
};
render();
</script>
<script>
(function(){
  function reviewAnswers(){
    var overlay=document.createElement("div");
    overlay.id="reviewOverlay";
    overlay.style.cssText="position:fixed;inset:0;background:#fff;z-index:99999;overflow:auto;padding:22px 18px 110px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202124";

    var close=document.createElement("button");
    close.textContent="← Home";
    close.className="secondary";
    close.onclick=function(){overlay.remove()};
    overlay.appendChild(close);

    var h=document.createElement("h1");
    h.textContent="Step 7 — Review My Answers";
    overlay.appendChild(h);

    // Review / Share tabs for the Review My Answers page.
    var tabBar=document.createElement("div");
    tabBar.style.cssText="display:flex;gap:8px;margin:14px 0 20px;border-bottom:1px solid #ddd;padding-bottom:10px";
    var reviewTab=document.createElement("button");
    reviewTab.textContent="Review My Answers";
    reviewTab.className="secondary";
    var shareTab=document.createElement("button");
    shareTab.textContent="Share";
    shareTab.className="secondary";
    tabBar.appendChild(reviewTab); tabBar.appendChild(shareTab);
    overlay.appendChild(tabBar);

    var reviewContent=document.createElement("div");
    overlay.appendChild(reviewContent);

    var shareContent=document.createElement("div");
    shareContent.style.display="none";
    shareContent.className="card";
    var shareTitle=document.createElement("h2");
    shareTitle.textContent="Share Step 7 — My Review Answers";
    shareContent.appendChild(shareTitle);
    var shareIntro=document.createElement("p");
    shareIntro.textContent="Choose how you would like to share your saved answers with your sponsor or another person.";
    shareContent.appendChild(shareIntro);
    var shareButtons=document.createElement("div");
    shareButtons.style.cssText="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px";
    var emailBtn=document.createElement("button"); emailBtn.textContent="Email";
    var textBtn=document.createElement("button"); textBtn.textContent="Text Message";
    var clipBtn=document.createElement("button"); clipBtn.textContent="Copy to Clipboard";
    shareButtons.appendChild(emailBtn); shareButtons.appendChild(textBtn); shareButtons.appendChild(clipBtn);
    shareContent.appendChild(shareButtons);
    var shareStatus=document.createElement("div");
    shareStatus.style.cssText="margin-top:12px;color:#666";
    shareContent.appendChild(shareStatus);
    overlay.appendChild(shareContent);

    function buildReviewShareText(){
      var lines=["An Interactive Working Guide to the 12 Steps of NA","Step 7 — My Review Answers",""];
      var has=false;
      SECTIONS.forEach(function(section,si){
        var sectionHas=false;
        var sectionLines=[];
        QUESTIONS.forEach(function(q,index){
          if(q.sectionIndex===si){
            var a=localStorage.getItem(PREFIX+index)||"";
            if(a.trim()!==""){
              has=true; sectionHas=true;
              sectionLines.push("• "+q.text);
              sectionLines.push("My Answer:");
              sectionLines.push(a.trim());
              sectionLines.push("");
            }
          }
        });
        if(sectionHas){ lines.push(section.name.toUpperCase()); lines.push(""); lines=lines.concat(sectionLines); }
      });
      if(!has) lines.push("No answers have been saved yet.");
      return lines.join("\n").trim();
    }

    reviewTab.onclick=function(){ reviewContent.style.display="block"; shareContent.style.display="none"; };
    shareTab.onclick=function(){ reviewContent.style.display="none"; shareContent.style.display="block"; };
    emailBtn.onclick=function(){ window.location.href="mailto:?subject="+encodeURIComponent("NA Step 7 — My Review Answers")+"&body="+encodeURIComponent(buildReviewShareText()); };
    textBtn.onclick=function(){ window.location.href="sms:?&body="+encodeURIComponent(buildReviewShareText()); };
    clipBtn.onclick=function(){
      var txt=buildReviewShareText();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){shareStatus.textContent="Your review answers have been copied to the clipboard.";}).catch(function(){shareStatus.textContent="Clipboard access was not available on this device.";});
      } else {
        var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.left="-9999px"; document.body.appendChild(ta); ta.select();

          var a=localStorage.getItem(PREFIX+index)||"";

            si=item.q.sectionIndex;

            render();
          };

          reviewContent.appendChild(card);
        });
      }
    });

    if(!found){
      var empty=document.createElement("div");

      empty.textContent="You have not saved any answers yet.";

  var observer=new MutationObserver(function(){addButton()});

<script>
(function(){
  
  function restoreAnswers(file){
    if(!file){
      alert("No backup file was selected.");
      return;
    }

    var reader=new FileReader();

    reader.onerror=function(){
      alert("Safari could not read that backup file.");
    };

    reader.onload=function(){
      try{
        var data=JSON.parse(reader.result);

        if(!data || !data.answers || typeof data.answers!=="object"){
          throw new Error("Invalid backup format");
        }

        var restored=0;
        if(data.notes && typeof data.notes==="object"){
          Object.keys(data.notes).forEach(function(si){
            if(typeof SECTIONS!=="undefined" && SECTIONS[Number(si)]){
              localStorage.setItem(NOTES_PREFIX+si,String(data.notes[si]||""));
            }
          });
        }

        Object.keys(data.answers).forEach(function(index){
          var n=Number(index);
          if(Number.isInteger(n) && typeof QUESTIONS!=="undefined" && QUESTIONS[n]){
            localStorage.setItem(PREFIX+n,String(data.answers[index]));
            restored++;
          }
        });

        if(restored===0){
          throw new Error("No matching answers");
        }

        alert(restored+" saved answer"+(restored===1?"":"s")+" restored.");
        if(typeof render==="function") render();

      }catch(e){
        alert("That file could not be restored. Please choose a Step 7 backup file created by this app.");
      }
    };

    reader.readAsText(file);
  }
  function addBackupButtons(){
    if(typeof mode==="undefined" || mode!=="intro") return;
    var nextButton=document.getElementById("next");
    if(!nextButton) return;


    if(!document.getElementById("restoreAnswersWrap")){
      var wrap=document.createElement("div");
      wrap.id="restoreAnswersWrap";
      wrap.style.cssText="margin-top:8px";

      var label=document.createElement("label");
      label.className="secondary";
      label.textContent="Restore My Answers";
      label.style.cssText="display:inline-block;cursor:pointer";

      var input=document.createElement("input");
      input.type="file";
      input.accept=".json,application/json,text/plain";
      input.style.cssText="display:block;margin-top:8px;max-width:100%";
      input.onchange=function(){
        if(input.files && input.files.length){
          restoreAnswers(input.files[0]);
        }
      };

      wrap.appendChild(label);
      wrap.appendChild(input);
      nextButton.parentNode.insertBefore(wrap,nextButton);
    }
  }
  var observer=new MutationObserver(function(){addBackupButtons()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addBackupButtons,100);
})();
</script>


<script>
(function(){
  function addCompletionSystem(){
    if(typeof SECTIONS==="undefined" || typeof QUESTIONS==="undefined") return;

    function sectionStats(si){
      var answered=0,total=0;
      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex===si){
          total++;
          if((localStorage.getItem(PREFIX+index)||"").trim()!=="") answered++;
        }
      });
      return {answered:answered,total:total,complete:total>0 && answered===total};
    }

    // Enhance the existing My Progress overlay after it is opened.
    var originalShowProgress=window.showProgress;
    if(typeof originalShowProgress!=="function" || originalShowProgress.__completionEnhanced) return;

    function enhancedProgress(){
      originalShowProgress();

      setTimeout(function(){
        var overlay=document.getElementById("progressOverlay");
        if(!overlay) return;

        var cards=overlay.querySelectorAll(".card");
        var sectionCards=[];
        cards.forEach(function(card){
          var title=card.querySelector("div");
          if(title && title.textContent && title.textContent!=="Overall Progress"){
            sectionCards.push(card);
          }
        });

        SECTIONS.forEach(function(section,si){
          var stats=sectionStats(si);
          var card=sectionCards[si];
          if(!card) return;

          var badge=card.querySelector(".completionBadge");
          if(!badge){
            badge=document.createElement("div");
            badge.className="completionBadge";
            badge.style.cssText="font-size:12px;font-weight:750;letter-spacing:.07em;margin-top:9px";
            card.appendChild(badge);
          }

          if(stats.complete){
            badge.textContent="✓ COMPLETED";
            badge.style.color="#2f6b3f";
          }else if(stats.answered>0){
            badge.textContent="IN PROGRESS";
            badge.style.color="#666";
          }else{
            badge.textContent="NOT STARTED";
            badge.style.color="#999";
          }
        });

        var allComplete=SECTIONS.every(function(_,si){return sectionStats(si).complete;});
        if(allComplete){
          var done=document.createElement("div");
          done.className="card";
          done.style.marginTop="18px";
          done.innerHTML="<strong>✓ STEP SEVEN COMPLETED</strong><div style='margin-top:8px;font-size:16px;line-height:1.5'>You have answered every Step 7 question.</div>";
          overlay.appendChild(done);
        }
      },0);
    }

    enhancedProgress.__completionEnhanced=true;
    window.showProgress=enhancedProgress;
  }

  var observer=new MutationObserver(function(){addCompletionSystem()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addCompletionSystem,100);
})();
</script>

<script>
(function(){
  function buildSummary(){
    var overlay=document.createElement("div");
    overlay.id="summaryOverlay";
    overlay.style.cssText="position:fixed;inset:0;background:#fff;z-index:99995;overflow:auto;padding:22px 18px 110px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202124";

    var close=document.createElement("button");
    close.textContent="← Home";

    close.onclick=function(){overlay.remove()};
    overlay.appendChild(close);

    var title=document.createElement("h1");
    title.textContent="Step 7 — Summary";
    overlay.appendChild(title);

    var answered=0;
    var total=QUESTIONS.length;

    SECTIONS.forEach(function(section,si){
      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex===si && (localStorage.getItem(PREFIX+index)||"").trim()!=="") answered++;
      });
    });

    var completed=answered===total && total>0;

    var status=document.createElement("div");
    status.className="card";
    status.innerHTML="<strong>"+(completed?"✓ STEP SEVEN COMPLETED":"STEP SEVEN IN PROGRESS")+
      "</strong><div style='margin-top:8px;font-size:16px'>"+answered+" of "+total+" questions answered.</div>";
    overlay.appendChild(status);

    var date=document.createElement("div");
    date.className="card";
    date.innerHTML="<strong>Summary Date</strong><div style='margin-top:8px'>"+
      new Date().toLocaleDateString()+"</div>";

    overlay.appendChild(date);

    // Share button directly on the Step Summary.
    var summaryShareCard=document.createElement("div");
    summaryShareCard.id="summaryShareCard";
    summaryShareCard.className="card";
    summaryShareCard.style.cssText="margin-top:16px";

    var shareHeading=document.createElement("strong");
    shareHeading.textContent="Share My Answers";
    shareHeading.style.display="block";
    shareHeading.style.marginBottom="8px";
    summaryShareCard.appendChild(shareHeading);

    var shareHelp=document.createElement("div");
    shareHelp.textContent="Share your saved answers by email, text message, or copy them to the clipboard.";
    shareHelp.style.cssText="font-size:15px;line-height:1.45;margin-bottom:12px";
    summaryShareCard.appendChild(shareHelp);

    var summaryShareActions=document.createElement("div");
    summaryShareActions.style.cssText="display:flex;flex-wrap:wrap;gap:8px";

    function buildSummaryShareText(){
      var lines=["An Interactive Working Guide to the 12 Steps of NA","Step 7 — My Review Answers",""];
      var any=false;
      SECTIONS.forEach(function(section,si){
        var sectionLines=[];
        QUESTIONS.forEach(function(q,index){
          if(q.sectionIndex!==si) return;
          var a=(localStorage.getItem(PREFIX+index)||"").trim();
          if(a){
            any=true;
            sectionLines.push("• "+q.text);
            sectionLines.push("My Answer:");
            sectionLines.push(a);
            sectionLines.push("");
          }
        });
        if(sectionLines.length){
          lines.push(section.name.toUpperCase());
          lines.push("");
          lines=lines.concat(sectionLines);
        }
      });
      if(!any) lines.push("No answers have been saved yet.");
      return lines.join("\n").trim();
    }

    var summaryEmail=document.createElement("button");
    summaryEmail.className="secondary";
    summaryEmail.textContent="Email";
    summaryEmail.onclick=function(){
      window.location.href="mailto:?subject="+encodeURIComponent("NA Step 7 — My Review Answers")+"&body="+encodeURIComponent(buildSummaryShareText());
    };

    var summaryText=document.createElement("button");
    summaryText.className="secondary";
    summaryText.textContent="Text Message";
    summaryText.onclick=function(){
      window.location.href="sms:?&body="+encodeURIComponent(buildSummaryShareText());
    };

    var summaryCopy=document.createElement("button");
    summaryCopy.className="secondary";
    summaryCopy.textContent="Copy to Clipboard";
    summaryCopy.onclick=function(){
      var txt=buildSummaryShareText();
      function ok(){summaryShareStatus.textContent="Your review answers have been copied to the clipboard.";}
      function fail(){summaryShareStatus.textContent="Clipboard access was not available on this device.";}
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(ok).catch(function(){
          var ta=document.createElement("textarea");
          ta.value=txt; ta.style.position="fixed"; ta.style.left="-9999px";
          document.body.appendChild(ta); ta.select();
          try{document.execCommand("copy"); ok();}catch(e){fail();}
          document.body.removeChild(ta);
        });
      }else{
        var ta=document.createElement("textarea");
        ta.value=txt; ta.style.position="fixed"; ta.style.left="-9999px";
        document.body.appendChild(ta); ta.select();
        try{document.execCommand("copy"); ok();}catch(e){fail();}
        document.body.removeChild(ta);
      }
    };

    summaryShareActions.appendChild(summaryEmail);
    summaryShareActions.appendChild(summaryText);
    summaryShareActions.appendChild(summaryCopy);
    summaryShareCard.appendChild(summaryShareActions);

    var summaryShareStatus=document.createElement("div");
    summaryShareStatus.style.cssText="margin-top:9px;color:#666;font-size:14px";
    summaryShareCard.appendChild(summaryShareStatus);

    overlay.appendChild(summaryShareCard);

    SECTIONS.forEach(function(section,si){
      var card=document.createElement("div");
      card.className="card";

      var heading=document.createElement("div");
      heading.style.cssText="font-size:19px;font-weight:700;margin-bottom:12px";
      heading.textContent=section.name;
      card.appendChild(heading);

      var hasContent=false;

      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex!==si) return;
        var a=(localStorage.getItem(PREFIX+index)||"").trim();
        if(!a) return;

        hasContent=true;

        var qbox=document.createElement("div");
        qbox.style.cssText="font-weight:700;margin-top:14px";
        qbox.textContent="• "+q.text;
        card.appendChild(qbox);

        var abox=document.createElement("div");
        abox.style.cssText="white-space:pre-line;margin-top:7px;padding:10px;border-left:3px solid #ddd;line-height:1.5";
        abox.textContent=a;
        card.appendChild(abox);
      });

      var note=localStorage.getItem("step7Notes_"+si)||"";
      if(note.trim()){
        hasContent=true;
        var nh=document.createElement("div");
        nh.style.cssText="font-weight:700;margin-top:20px";
        nh.textContent="My Notes";
        card.appendChild(nh);

        var nb=document.createElement("div");
        nb.style.cssText="white-space:pre-line;margin-top:7px;padding:10px;border-left:3px solid #ddd;line-height:1.5";
        nb.textContent=note;
        card.appendChild(nb);
      }

      if(hasContent) overlay.appendChild(card);
    });

    var print=document.createElement("button");
    print.className="secondary";
    print.textContent="Print / Save as PDF";
    print.style.marginTop="18px";
    print.onclick=function(){window.print()};
    overlay.appendChild(print);

    document.body.appendChild(overlay);
  }

  function addSummaryButton(){
    if(document.getElementById("summaryButton")) return;
    if(typeof mode==="undefined" || mode!=="intro") return;

    var nextButton=document.getElementById("next");
    if(!nextButton) return;

    var b=document.createElement("button");
    b.id="summaryButton";
    b.className="secondary";
    b.textContent="Step 7 Summary";
    b.onclick=buildSummary;
    nextButton.parentNode.insertBefore(b,nextButton);
  }

  var observer=new MutationObserver(function(){addSummaryButton()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addSummaryButton,100);
})();
</script>


<button id="shareReview" type="button" onclick="shareReview()" style="margin:10px 0;">Share</button>
<div id="sharePanel" class="share-panel">
  <strong>Share Step 7 — Review My Answers</strong>
  <div class="share-actions">
    <button type="button" onclick="shareByEmail()">Email</button>
    <button type="button" onclick="shareByText()">Text Message</button>
    <button type="button" onclick="copyReviewToClipboard()">Copy to Clipboard</button>
  </div>
  <div id="shareStatus" class="share-status"></div>
</div>

<script>
function getStepReviewText() {
  const step = 7;
  let lines = [];
  lines.push("An Interactive Working Guide to the 12 Steps of NA");
  lines.push("Step " + step + " — My Review Answers");
  lines.push("");
  const root = document.body;
  // Collect visible question/answer pairs from the current Step 7 review.
  // Prefer review containers and textarea/input values, while avoiding navigation controls.
  const fields = Array.from(root.querySelectorAll("textarea, input[type='text'], input:not([type])"));
  let q = 0;
  fields.forEach(el => {
    if (!el.offsetParent) return;
    const value = (el.value || "").trim();
    if (!value) return;
    const prev = el.closest(".question, .q, .card, .section, div");
    let label = "";
    if (prev) {
      const heading = prev.querySelector("h1,h2,h3,h4,strong,label");
      if (heading) label = heading.textContent.trim();
    }
    if (!label) {
      q++;
      label = "Answer " + q;
    }
    lines.push(label + ":");
    lines.push(value);
    lines.push("");
  });
  // If the review page has generated text, include it as a fallback.
  if (lines.length <= 4) {
    const review = document.querySelector("#review, .review, [id*='review']");
    if (review) {
      const clone = review.cloneNode(true);
      clone.querySelectorAll("button, script, style").forEach(x => x.remove());
      const body = clone.innerText.trim();
      if (body) lines.push(body);
    }
  }
  return lines.join("\n").trim();
}

function shareReview() {
  const panel = document.getElementById("sharePanel");
  if (panel) panel.classList.toggle("show");
}

function shareByEmail() {
  const body = encodeURIComponent(getStepReviewText());
  window.location.href = "mailto:?subject=" + encodeURIComponent("NA Step 7 — My Review Answers") + "&body=" + body;
}

function shareByText() {
  const body = encodeURIComponent(getStepReviewText());
  // sms: works across common iOS/Android configurations; the user selects the recipient.
  window.location.href = "sms:?&body=" + body;
}

async function copyReviewToClipboard() {
  const text = getStepReviewText();
  try {
    await navigator.clipboard.writeText(text);
    const status = document.getElementById("shareStatus");
    if (status) status.textContent = "Review answers copied to the clipboard.";
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      const status = document.getElementById("shareStatus");
      if (status) status.textContent = "Review answers copied to the clipboard.";
    } finally {
      document.body.removeChild(ta);
    }
  }
}
</script>

<script>
(function(){
  const STEP_NO = (document.title.match(/Step (\\d+)/i)||[])[1] || (document.body.innerText.match(/Step (\\d+)/i)||[])[1] || "";
  const ANSWER_PREFIX = (typeof PREFIX !== "undefined") ? PREFIX : "";
  const NOTES_PREFIX_LOCAL = (typeof NOTES_PREFIX !== "undefined") ? NOTES_PREFIX : ("step"+STEP_NO+"Notes_");
  const STATE_KEY_LOCAL = (typeof STATE !== "undefined") ? STATE : "";
  const STEP_KEYS = {
    1:{prefix:"step-one-complete-v4-",notes:"stepOneNotes_",state:"step-one-v4-resume-state"},
    2:{prefix:"step-two-complete-v1-",notes:"stepOneNotes_",state:"step-two-v1-resume-state"},
    3:{prefix:"step-three-complete-v1-",notes:"stepOneNotes_",state:"step-three-v1-resume-state"},
    4:{prefix:"step-four-complete-v1-",notes:"stepOneNotes_",state:"step-four-v1-resume-state"},
    5:{prefix:"step-five-complete-v1-",notes:"stepOneNotes_",state:"step-five-v1-resume-state"},
    6:{prefix:"step-six-complete-v1-",notes:"stepOneNotes_",state:"step-six-v1-resume-state"},
    7:{prefix:"step-seven-v1-",notes:"step7Notes_",state:"step-seven-v1-resume-state"},
    8:{prefix:"step-eight-v1-",notes:"step8Notes_",state:"step-eight-v1-resume-state"},
    9:{prefix:"step-nine-v1-",notes:"step9Notes_",state:"step-nine-v1-resume-state"},
    10:{prefix:"step-ten-v1-",notes:"step10Notes_",state:"step-ten-v1-resume-state"},
    11:{prefix:"step-eleven-v1-",notes:"step11Notes_",state:"step-eleven-v1-resume-state"},
    12:{prefix:"step-twelve-v1-",notes:"step12Notes_",state:"step-twelve-v1-resume-state"}
  };
  function collect(){
    const data={format:"NA-Step-Working-Guide-Backup",version:1,created:new Date().toISOString(),steps:{}};
    for(let n=1;n<=12;n++){
      const cfg=STEP_KEYS[n], answers={}, notes={};
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k && k.indexOf(cfg.prefix)===0) answers[k.slice(cfg.prefix.length)]=localStorage.getItem(k);
        if(k && k.indexOf(cfg.notes)===0) notes[k.slice(cfg.notes.length)]=localStorage.getItem(k);
      }
      data.steps[n]={answers,notes,state:localStorage.getItem(cfg.state)};
    }
    return data;
  }
  function download(){
    const blob=new Blob([JSON.stringify(collect(),null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="NA-Step-Working-Guide-Backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  function restore(file){
    const reader=new FileReader();
    reader.onerror=()=>alert("The backup file could not be read.");
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        if(data.format!=="NA-Step-Working-Guide-Backup" || !data.steps) throw new Error();
        let restored=0;
        for(let n=1;n<=12;n++){
          const cfg=STEP_KEYS[n], s=data.steps[n]||data.steps[String(n)];
          if(!s) continue;
          if(s.answers) Object.keys(s.answers).forEach(k=>{localStorage.setItem(cfg.prefix+k,String(s.answers[k]??""));restored++;});
          if(s.notes) Object.keys(s.notes).forEach(k=>localStorage.setItem(cfg.notes+k,String(s.notes[k]??"")));
          if(s.state) localStorage.setItem(cfg.state,String(s.state));
        }
        if(!restored) throw new Error();
        alert("Backup restored successfully. "+restored+" answer entries were restored across the workbook.");
        if(typeof render==="function") render();
      }catch(e){ alert("That file is not a valid NA Step Working Guide backup."); }
    };
    reader.readAsText(file);
  }
  function addPanel(){
    if(typeof mode==="undefined" || mode!=="intro" || document.getElementById("backupPanel")) return;
    const next=document.getElementById("next"); if(!next) return;
    const wrap=document.createElement("div"); wrap.id="backupPanel";
    wrap.style.cssText="margin:18px 0 8px;padding:16px;border:1px solid #ddd;border-radius:14px;background:#f7f7f8;text-align:left";
    wrap.innerHTML='<div style="font-size:18px;font-weight:700;margin-bottom:6px">Backup & Restore</div><div style="font-size:14px;line-height:1.45;margin-bottom:12px">Your answers save automatically on this device. Create a backup file if you want to keep a copy or move your work to another device.</div>';
    const exp=document.createElement("button"); exp.className="secondary"; exp.textContent="Export My Answers"; exp.style.margin="4px 6px 4px 0"; exp.onclick=download;
    const label=document.createElement("label"); label.textContent="Restore My Answers"; label.style.cssText="display:inline-block;border-radius:10px;padding:12px 15px;background:#222;color:#fff;font-size:15px;cursor:pointer;margin:4px 0";
    const input=document.createElement("input"); input.type="file"; input.accept=".json,application/json,text/plain"; input.style.display="none"; input.onchange=()=>{if(input.files&&input.files[0]) restore(input.files[0]);};
    label.appendChild(input); wrap.appendChild(exp); wrap.appendChild(label); next.parentNode.insertBefore(wrap,next);
  }
  const old=document.createElement('style'); old.textContent='#restoreAnswersWrap{display:none!important}'; document.head.appendChild(old);
  new MutationObserver(addPanel).observe(document.body,{childList:true,subtree:true}); setTimeout(addPanel,100);
})();
</script>

<script id="naCompactNav">
(function(){
  function txt(el){return (el.innerText||el.textContent||"").trim().replace(/\s+/g," ");}
  function setup(){
    var bottom=document.querySelector(".bottom");
    if(!bottom)return;
    var home=document.getElementById("home"), back=document.getElementById("back"), next=document.getElementById("next");
    if(!home||!back||!next)return;

    var drawer=document.getElementById("naToolsDrawer");
    if(!drawer){
      drawer=document.createElement("div");
      drawer.id="naToolsDrawer";
      drawer.innerHTML='<div class="tools-title">Step Tools</div>';
      document.body.appendChild(drawer);
    }
    var tools=document.getElementById("mobileToolsButton");
    if(!tools){
      tools=document.createElement("button");
      tools.id="mobileToolsButton";
      tools.type="button";
      tools.className="secondary";
      tools.textContent="Tools";
      tools.onclick=function(e){e.stopPropagation();drawer.classList.toggle("open");};
    }
    if(tools.parentNode!==bottom) bottom.insertBefore(tools,next);

    var primary=[home,back,tools,next];
    Array.prototype.slice.call(bottom.children).forEach(function(el){
      if(primary.indexOf(el)!==-1)return;
      el.classList.add("tool-item");
      drawer.appendChild(el);
    });

    var panel=document.getElementById("backupPanel");
    if(panel && panel.parentNode!==drawer){
      drawer.appendChild(panel);
    }
  }
  function run(){setup();}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run);else run();
  [100,300,700,1200].forEach(function(ms){setTimeout(run,ms);});
  new MutationObserver(run).observe(document.body,{childList:true,subtree:true});
  document.addEventListener("click",function(e){
    var drawer=document.getElementById("naToolsDrawer"),tools=document.getElementById("mobileToolsButton");
    if(drawer&&drawer.classList.contains("open")&&!drawer.contains(e.target)&&e.target!==tools)drawer.classList.remove("open");
  });
})();
</script>
