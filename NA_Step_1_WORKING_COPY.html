<script>
const WELCOME_PREFACE='The idea for this piece of literature came from the Narcotics Anonymous Fellowship itself. Beginning in the early 1980s, we began receiving Twelve Step guides and step worksheets along with requests that we develop a standard set of guides for the NA Fellowship to use in working through the Twelve Steps. Fellowship demand propelled this project up the NA World Service Conference Literature Committee\'s priority wordlists, and finally resulted in the World Service Conference directing the WSCLC to go ahead with the project at WSC\'95.\n\nThe working title for this project for many years was the "Step Writing Guides." However, we recognized that the word "writing" imposed a limitation on members who may be unable to write or may choose not to use writing as the means for working the Twelve Steps. Therefore, the title became the Step Working Guides.\n\nEach chapter includes both narrative and questions. The narrative is meant to provoke thought about the questions, but is not meant to be comprehensive. There is a difference in "voice" between the narrative and the questions. The narrative is written in the "we" voice in order to promote unity about what we all have in common: our addiction and recovery. The questions are written in the individual "I" voice so that each member using these guides can personalize the work. The Step Working Guides is a companion piece to It Works: How and Why. Thorough discussion of each of the Twelve Steps is contained in that work. Additional information about NA recovery can be found in other NA literature. If we find that any of the terms used in this book are unfamiliar, we should feel free to make use of a dictionary.\n\nThese guides are meant to be used by NA members at any stage of recovery, whether it\'s our first time through the steps or we\'ve been living with the steps as our guiding force for many years. This book is intentionally written to be relevant to newcomers and to help more experienced members develop a deeper understanding of the Twelve Steps. As NA grows in numbers, in diversity, and in strength and longevity of clean time, we need literature that will continue to serve the needs of the fellowship.\n\nHowever, as open and inclusive as we tried to be when writing these guides, we realized that we would never be able to write something that captured every member\'s experience with the steps. This book contains guides to working the Twelve Steps toward recovery; it does not contain recovery itself. Recovery is ultimately found in each member\'s personal experience with working the steps. You can add to these guides, delete from them, or use them as they are. It\'s your choice. There\'s probably only one inappropriate way to use these guides: alone. We can\'t overemphasize the importance of working with a sponsor in working the steps. In our fellowship, a sponsor is considered, first and foremost, a guide through the Twelve Steps. If you haven\'t yet asked someone to sponsor you, please do so before beginning these guides.\n\nMerely reading all the available information about any of the Twelve Steps will never be sufficient to bring about a true change in our lives and freedom from our disease. It\'s our goal to make the steps part of who we are. To do that, we have to work them. Hence, the Step Working Guides.\n\nLike every piece of NA literature, this was written by addicts for addicts. We hope that every member who uses this book will be encouraged and inspired. We are grateful to have been given the opportunity to participate in this project. Thank you for allowing us to be of service.\n\nWSC Literature Committee';
const INTRO="“We admitted we were powerless over our addiction, that our lives had become unmanageable.”\n\nA “first” of anything is a beginning, and so it is with the steps: The First Step is the beginning of the recovery process. The healing starts here; we can't go any further until we've worked this step.\n\nSome NA members “feel” their way through the First Step by intuition; others choose to work Step One in a more systematic fashion. Our reasons for formally working Step One will vary from member to member. It may be that we're new to recovery, and we've just fought—and lost—an exhausting battle with drugs. It may be that we've been around awhile, abstinent from drugs, but we've discovered that our disease has become active in some other area of our lives, forcing us to face our powerlessness and the unmanageability of our lives once again. Not every act of growth is motivated by pain; it may just be time to cycle through the steps again, thus beginning the next stage of our never-ending journey of recovery.\n\nSome of us find a measure of comfort in realizing that a disease, not a moral failing, has caused us to reach this bottom. Others don't really care what the cause has been—we just want out!\n\nWhatever the case, it's time to do some step work: to engage in some concrete activity that will help us find more freedom from our addiction, whatever shape it is currently taking. Our hope is to internalize the principles of Step One, to deepen our surrender, to make the principles of acceptance, humility, willingness, honesty, and open-mindedness a fundamental part of who we are.\n\nFirst, we must arrive at a point of surrender. There are many different ways to do this. For some of us, the road we traveled getting to the First Step was more than enough to convince us that unconditional surrender was our only option. Others start this process even though we're not entirely convinced that we're addicts or that we've really hit bottom. Only in working the First Step do we truly come to realize that we are addicts, that we have hit bottom, and that we must surrender.\n\nBefore we begin working the First Step, we must become abstinent—whatever it takes. If we're new in Narcotics Anonymous and our First Step is primarily about looking at the effects of drug addiction in our lives, we need to get clean. If we've been clean awhile and our First Step is about our powerlessness over some other behavior that's made our lives unmanageable, we need to find a way to stop the behavior so that our surrender isn't clouded by continued acting out.";
const SECTIONS=[{"name": "The Disease of Addiction", "reading": "What makes us addicts is the disease of addiction—not the drugs, not our behavior, but our disease. There is something within us that makes us unable to control our use of drugs. This same “something” also makes us prone to obsession and compulsion in other areas of our lives. How can we tell when our disease is active? When we become trapped in obsessive, compulsive, self-centered routines, endless loops that lead nowhere but to physical, mental, spiritual, and emotional decay.\n\nOur addiction can manifest itself in a variety of ways. When we first come to Narcotics Anonymous, our problem will, of course, be drugs. Later on, we may find out that addiction is wreaking havoc in our lives in any number of ways.\n\nWhat is the specific way in which my addiction has been manifesting itself most recently?", "count": 7}, {"name": "Denial", "reading": "Denial is the part of our disease that tells us we don't have a disease. When we are in denial, we are unable to see the reality of our addiction. We minimize its effect. We blame others, citing the too-high expectations of families, friends, and employers. We compare ourselves with other addicts whose addiction seems “worse” than our own. We may blame one particular drug. If we have been abstinent from drugs for some time, we might compare the current manifestation of our addiction with our drug use, rationalizing that nothing we do today could possibly be as bad as that was! One of the easiest ways to tell that we are in denial is when we find ourselves giving plausible but untrue reasons for our behavior.", "count": 7}, {"name": "Hitting Bottom: Despair and Isolation", "reading": "Our addiction finally brings us to a place where we can no longer deny the nature of our problem. All the lies, all the rationalizations, all the illusions fall away as we stand face-to-face with what our lives have become. We realize we've been living without hope. We find we've become friendless or so completely disconnected that our relationships are a sham, a parody of love and intimacy. Though it may seem that all is lost when we find ourselves in this state, the truth is that we must pass through this place before we can embark upon our journey of recovery.", "count": 3}, {"name": "Powerlessness", "reading": "As addicts, we react to the word “powerless” in a variety of ways. Some of us recognize that a more accurate description of our situation simply could not exist, and admit our powerlessness with a sense of relief. Others recoil at the word, connecting it with weakness or believing it to indicate some kind of character deficiency. Understanding powerlessness—and how admitting our own powerlessness is essential to our recovery—will help us get over any negative feelings we may have about the concept.\n\nWe are powerless when the driving force in our life is beyond our control. Our addiction certainly qualifies as such an uncontrollable, driving force. We cannot moderate or control our drug use, even when it is causing us to lose the things that matter most to us. We cannot stop, even when to continue will surely result in irreparable physical damage. We find ourselves doing things that we would never do if it weren't for our addiction; things that make us shudder with shame when we think of them. We may even decide that we don't want to use, that we aren't going to use, and realize we are simply unable to stop when the opportunity presents itself.\n\nWe may have tried to abstain from drug use—perhaps with some success—for a period of time without a program, only to find that our untreated addiction eventually takes us right back to where we were before. In order to work the First Step, we need to prove our own individual powerlessness to ourselves on a deep level.", "count": 7}, {"name": "Unmanageability", "reading": "The First Step asks us to admit two things: one, that we are powerless over our addiction; and two, that our lives have become unmanageable. Actually, we would be hard pressed to admit one and not the other. Our unmanageability is the outward evidence of our powerlessness. There are two general types of unmanageability: outward unmanageability, the kind that can be seen by others; and inner, or personal, unmanageability.\n\nOutward unmanageability is often identified by such things as arrests, job losses, and family problems. Some of our members have been incarcerated. Some have never been able to sustain any kind of relationship for more than a few months. Some of us have been cut off from our families, asked never again to contact them.\n\nInner or personal unmanageability is often identified by unhealthy or untrue belief systems about ourselves, the world we live in, and the people in our lives. We may believe we're worthless. We may believe that the world revolves around us—not just that it should, but that it does. We may believe that it isn't really our job to take care of ourselves; someone else should do that. We may believe that the responsibilities the average person takes on as a matter of course are just too large a burden for us to bear. We may over or under-react to events in our lives. Emotional volatility is often one of the most obvious ways in which we can identify personal unmanageability.", "count": 15}, {"name": "Reservations", "reading": "Reservations are places in our program that we have reserved for relapse. They may be built around the idea that we can retain a small measure of control, something like, “Okay, I accept that I can't control my using, but I can still sell drugs, can't I?” Or we may think we can remain friends with the people we used with or bought drugs from. We may think that certain parts of the program don't apply to us. We may think there's something we just can't face clean—a serious illness, for instance, or the death of a loved one—and plan to use if it ever happens. We may think that after we've accomplished some goal, made a certain amount of money, or been clean for a certain number of years, then we'll be able to control our using. Reservations are usually tucked away in the back of our minds; we are not fully conscious of them. It is essential that we expose any reservations we may have and cancel them, right here, right now.", "count": 5}, {"name": "Surrender", "reading": "There's a huge difference between resignation and surrender. Resignation is what we feel when we've realized we're addicts but haven't yet accepted recovery as the solution to our problem. Many of us found ourselves at this point long before coming to Narcotics Anonymous. We may have thought that it was our destiny to be addicts, to live and die in our addiction. Surrender, on the other hand, is what happens after we've accepted the First Step as something that is true for us and have accepted that recovery is the solution. We don't want our lives to be the way they have been. We don't want to keep feeling the way we've been feeling.", "count": 5}, {"name": "Spiritual Principles", "reading": "In the First Step, we will focus on honesty, open-mindedness, willingness, humility, and acceptance.\n\nThe practice of the principle of honesty from the First Step starts with admitting the truth about our addiction, and continues with the practice of honesty on a daily basis. When we say “I'm an addict” in a meeting, it may be the first truly honest thing we've said in a long time. We begin to be able to be honest with ourselves and, consequently, with other people.\n\nPracticing the principle of open-mindedness found in Step One mostly involves being ready to believe that there might be another way to live and being willing to try that way. It doesn't matter that we can't see every detail of what that way might be, or that it may be totally unlike anything we've heard about before; what matters is that we don't limit ourselves or our thinking. Sometimes we may hear NA members saying things that sound totally crazy to us, things like “surrender to win” or suggestions to pray for someone we resent. We demonstrate open-mindedness when we don't reject these things without having tried them.\n\nThe principle of willingness contained in the First Step can be practiced in a variety of ways. When we first begin to think about recovery, many of us either don't really believe it's possible for us or just don't understand how it will work, but we go ahead with the First Step anyway—and that's our first experience with willingness. Taking any action that will help our recovery shows willingness: going to meetings early and staying late, helping set up meetings, getting other NA members' phone numbers and calling them.\n\nThe principle of humility, so central to the First Step, is expressed most purely in our surrender. Humility is most easily identified as an acceptance of who we truly are—neither worse nor better than we believed we were when we were using, just human.\n\nTo practice the principle of acceptance, we must do more than merely admit that we're addicts. When we accept our addiction, we feel a profound inner change that is underscored by a rising sense of hope. We also begin to feel a sense of peace. We come to terms with our addiction, with our recovery, and with the meaning those two realities will come to have in our lives. We don't dread a future of meeting attendance, sponsor contact, and step work; instead, we begin to see recovery as a precious gift, and the work connected with it as no more trouble than other routines of life.", "count": 14}, {"name": "Moving On", "reading": "As we get ready to go on to Step Two, we'll probably find ourselves wondering if we've worked Step One well enough. Are we sure it's time to move on? Have we spent as much time as others may have spent on this step? Have we truly gained an understanding of this step?\n\nMany of us have found it helpful to write about our understanding of each step as we prepare to move on.\n\nWe've come to a place where we see the results of our old way of life and accept that a new way is called for, but we probably don't yet see how rich with possibilities the life of recovery is. It may be enough just to have freedom from active addiction right now, but we will soon find that the void we have been filling with drugs or other obsessive and compulsive behaviors begs to be filled. Working the rest of the steps will fill that void.", "count": 3}];
const QUESTIONS=[{"sectionIndex": 0, "section": "The Disease of Addiction", "number": 1, "count": 7, "text": "What does “the disease of addiction” mean to me?"}, {"sectionIndex": 0, "section": "The Disease of Addiction", "number": 2, "count": 7, "text": "Has my disease been active recently? In what way?"}, {"sectionIndex": 0, "section": "The Disease of Addiction", "number": 3, "count": 7, "text": "What is it like when I'm obsessed with something? Does my thinking follow a pattern? Describe."}, {"sectionIndex": 0, "section": "The Disease of Addiction", "number": 4, "count": 7, "text": "When a thought occurs to me, do I immediately act on it without considering the consequences? In what other ways do I behave compulsively?"}, {"sectionIndex": 0, "section": "The Disease of Addiction", "number": 5, "count": 7, "text": "How does the self-centered part of my disease affect my life and the lives of those around me?"}, {"sectionIndex": 0, "section": "The Disease of Addiction", "number": 6, "count": 7, "text": "How has my disease affected me physically? Mentally? Spiritually? Emotionally?"}, {"sectionIndex": 0, "section": "The Disease of Addiction", "number": 7, "count": 7, "text": "Have I been obsessed with a person, place, or thing? If so, how has that gotten in the way of my relationships with others? How else have I been affected mentally, physically, spiritually, and emotionally by this obsession?"}, {"sectionIndex": 1, "section": "Denial", "number": 1, "count": 7, "text": "Have I given plausible but untrue reasons for my behavior? What have they been?"}, {"sectionIndex": 1, "section": "Denial", "number": 2, "count": 7, "text": "Have I compulsively acted on an obsession, and then acted as if I had actually planned to act that way? When were those times?"}, {"sectionIndex": 1, "section": "Denial", "number": 3, "count": 7, "text": "How have I blamed other people for my behavior?"}, {"sectionIndex": 1, "section": "Denial", "number": 4, "count": 7, "text": "How have I compared my addiction with others' addiction? Is my addiction “bad enough” if I don't compare it to anyone else's?"}, {"sectionIndex": 1, "section": "Denial", "number": 5, "count": 7, "text": "Am I comparing a current manifestation of my addiction to the way my life was before I got clean? Am I plagued by the idea that I should know better?"}, {"sectionIndex": 1, "section": "Denial", "number": 6, "count": 7, "text": "Have I been thinking that I have enough information about addiction and recovery to get my behavior under control before it gets out of hand?"}, {"sectionIndex": 1, "section": "Denial", "number": 7, "count": 7, "text": "Am I avoiding action because I'm afraid I will be ashamed when I face the results of my addiction? Am I avoiding action because I'm worried about what others will think?"}, {"sectionIndex": 2, "section": "Hitting Bottom: Despair and Isolation", "number": 1, "count": 3, "text": "What crisis brought me to recovery?"}, {"sectionIndex": 2, "section": "Hitting Bottom: Despair and Isolation", "number": 2, "count": 3, "text": "What situation led me to formally work Step One?"}, {"sectionIndex": 2, "section": "Hitting Bottom: Despair and Isolation", "number": 3, "count": 3, "text": "When did I first recognize my addiction as a problem? Did I try to correct it? If so, how? If not, why not?"}, {"sectionIndex": 3, "section": "Powerlessness", "number": 1, "count": 7, "text": "Over what, exactly, am I powerless?"}, {"sectionIndex": 3, "section": "Powerlessness", "number": 2, "count": 7, "text": "I've done things while acting out on my addiction that I would never do when focusing on recovery. What were they?"}, {"sectionIndex": 3, "section": "Powerlessness", "number": 3, "count": 7, "text": "What things have I done to maintain my addiction that went completely against all my beliefs and values?"}, {"sectionIndex": 3, "section": "Powerlessness", "number": 4, "count": 7, "text": "How does my personality change when I'm acting out on my addiction? (For example: Do I become arrogant? Self-centered? Mean-tempered? Passive to the point where I can't protect myself? Manipulative? Whiny?)"}, {"sectionIndex": 3, "section": "Powerlessness", "number": 5, "count": 7, "text": "Do I manipulate other people to maintain my addiction? How?"}, {"sectionIndex": 3, "section": "Powerlessness", "number": 6, "count": 7, "text": "Have I tried to quit using and found that I couldn't? Have I quit using on my own and found that my life was so painful without drugs that my abstinence didn't last very long? What were these times like?"}, {"sectionIndex": 3, "section": "Powerlessness", "number": 7, "count": 7, "text": "How has my addiction caused me to hurt myself or others?"}, {"sectionIndex": 4, "section": "Unmanageability", "number": 1, "count": 15, "text": "What does unmanageability mean to me?"}, {"sectionIndex": 4, "section": "Unmanageability", "number": 2, "count": 15, "text": "Have I ever been arrested or had legal trouble as a result of my addiction? Have I ever done anything I could have been arrested for if only I was caught? What have those things been?"}, {"sectionIndex": 4, "section": "Unmanageability", "number": 3, "count": 15, "text": "What trouble have I had at work or school because of my addiction? What trouble have I had with my family as a result of my addiction?"}, {"sectionIndex": 4, "section": "Unmanageability", "number": 4, "count": 15, "text": "What trouble have I had with my friends as a result of my addiction?"}, {"sectionIndex": 4, "section": "Unmanageability", "number": 5, "count": 15, "text": "Do I insist on having my own way? What effect has my insistence had on my relationships?"}, {"sectionIndex": 4, "section": "Unmanageability", "number": 6, "count": 15, "text": "Do I consider the needs of others? What effect has my lack of consideration had on my relationships?"}, {"sectionIndex": 4, "section": "Unmanageability", "number": 7, "count": 15, "text": "Do I accept responsibility for my life and my actions? Am I able to carry out my daily responsibilities without becoming overwhelmed? How has this affected my life?"}, {"sectionIndex": 4, "section": "Unmanageability", "number": 8, "count": 15, "text": "Do I fall apart the minute things don't go according to plan? How has this affected my life?"}, {"sectionIndex": 4, "section": "Unmanageability", "number": 9, "count": 15, "text": "Do I treat every challenge as a personal insult? How has this affected my life?"}, {"sectionIndex": 4, "section": "Unmanageability", "number": 10, "count": 15, "text": "Do I maintain a crisis mentality, responding to every situation with panic? How has this affected my life?"}, {"sectionIndex": 4, "section": "Unmanageability", "number": 11, "count": 15, "text": "Do I ignore signs that something may be seriously wrong with my health or with my children, thinking things will work out somehow? Describe."}, {"sectionIndex": 4, "section": "Unmanageability", "number": 12, "count": 15, "text": "When in real danger, have I ever been either indifferent to that danger or somehow unable to protect myself as a result of my addiction? Describe."}, {"sectionIndex": 4, "section": "Unmanageability", "number": 13, "count": 15, "text": "Have I ever harmed someone as a result of my addiction? Describe."}, {"sectionIndex": 4, "section": "Unmanageability", "number": 14, "count": 15, "text": "Do I have temper tantrums or react to my feelings in other ways that lower my self-respect or sense of dignity? Describe."}, {"sectionIndex": 4, "section": "Unmanageability", "number": 15, "count": 15, "text": "Did I take drugs or act out on my addiction to change or suppress my feelings? What was I trying to change or suppress?"}, {"sectionIndex": 5, "section": "Reservations", "number": 1, "count": 5, "text": "Have I accepted the full measure of my disease?"}, {"sectionIndex": 5, "section": "Reservations", "number": 2, "count": 5, "text": "Do I think I can still associate with the people connected with my addiction? Can I still go to <script>
(function(){
  function reviewAnswers(){
    var overlay=document.createElement("div");
    overlay.id="reviewOverlay";
    overlay.style.cssText="position:fixed;inset:0;background:#fff;z-index:99999;overflow:auto;padding:22px 18px 110px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202124";

    var close=document.createElement("button");

    close.onclick=function(){overlay.remove()};

    var h=document.createElement("h1");

    var shareTab=document.createElement("button");

    shareTab.className="secondary";
    tabBar.appendChild(reviewTab); tabBar.appendChild(shareTab);
    overlay.appendChild(tabBar);

    var reviewContent=document.createElement("div");
    overlay.appendChild(reviewContent);

    var shareContent=document.createElement("div");
    shareContent.style.display="none";
    shareContent.className="card";
    var shareTitle=document.createElement("h2");
    shareTitle.textContent="Share Step 1 — My Review Answers";
    shareContent.appendChild(shareTitle);
    var shareIntro=document.createElement("p");
    shareIntro.textContent="Choose how you would like to share your saved answers with your sponsor or another person.";
    shareContent.appendChild(shareIntro);
    var shareButtons=document.createElement("div");
    shareButtons.style.cssText="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px";
    var emailBtn=document.createElement("button"); emailBtn.textContent="Email";
    var textBtn=document.createElement("button"); textBtn.textContent="Text Message";
    var clipBtn=document.createElement("button"); clipBtn.textContent="Copy to Clipboard";
    shareButtons.appendChild(emailBtn); shareButtons.appendChild(textBtn); shareButtons.appendChild(clipBtn);
    shareContent.appendChild(shareButtons);
    var shareStatus=document.createElement("div");
    shareStatus.style.cssText="margin-top:12px;color:#666";
    shareContent.appendChild(shareStatus);
    overlay.appendChild(shareContent);

    function buildReviewShareText(){
      var lines=["An Interactive Working Guide to the 12 Steps of NA","Step 1 — My Review Answers",""];
      var has=false;
      SECTIONS.forEach(function(section,si){
        var sectionHas=false;
        var sectionLines=[];
        QUESTIONS.forEach(function(q,index){
          if(q.sectionIndex===si){
            var a=localStorage.getItem(PREFIX+index)||"";
            if(a.trim()!==""){
              has=true; sectionHas=true;
              sectionLines.push("• "+q.text);
              sectionLines.push("My Answer:");
              sectionLines.push(a.trim());
              sectionLines.push("");
            }
          }
        });
        if(sectionHas){ lines.push(section.name.toUpperCase()); lines.push(""); lines=lines.concat(sectionLines); }
      });
      if(!has) lines.push("No answers have been saved yet.");
      return lines.join("\n").trim();
    }

    reviewTab.onclick=function(){ reviewContent.style.display="block"; shareContent.style.display="none"; };
    shareTab.onclick=function(){ reviewContent.style.display="none"; shareContent.style.display="block"; };
    emailBtn.onclick=function(){ window.location.href="mailto:?subject="+encodeURIComponent("NA Step 1 — My Review Answers")+"&body="+encodeURIComponent(buildReviewShareText()); };
    textBtn.onclick=function(){ window.location.href="sms:?&body="+encodeURIComponent(buildReviewShareText()); };
    clipBtn.onclick=function(){
      var txt=buildReviewShareText();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){shareStatus.textContent="Your review answers have been copied to the clipboard.";}).catch(function(){shareStatus.textContent="Clipboard access was not available on this device.";});
      } else {
        var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.left="-9999px"; document.body.appendChild(ta); ta.select();
        try{document.execCommand("copy"); shareStatus.textContent="Your review answers have been copied to the clipboard.";}catch(e){shareStatus.textContent="Clipboard access was not available on this device.";}
        document.body.removeChild(ta);

    var found=false;

    SECTIONS.forEach(function(section,si){
      var answered=[];
      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex===si){
          var a=localStorage.getItem(PREFIX+index)||"";
          if(a.trim()!=="") answered.push({q:q,index:index,a:a});
        }
      });

      if(answered.length){
        found=true;
        var sh=document.createElement("div");
        sh.className="eyebrow";
        sh.style.marginTop="28px";
        sh.textContent=section.name;
        reviewContent.appendChild(sh);

        answered.forEach(function(item){
          var card=document.createElement("div");
          card.className="card";

          var q=document.createElement("div");
          q.className="question";
          q.textContent="• "+item.q.text;

          var label=document.createElement("div");
          label.className="status";
          label.textContent="MY ANSWER";
          label.style.cssText="font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#666;font-weight:750;margin:10px 0 7px";
          card.appendChild(label);

          var ans=document.createElement("div");
          ans.style.cssText="white-space:pre-line;font-size:17px;line-height:1.55;border-top:1px solid #ddd;padding-top:10px";
          ans.textContent=item.a;
          card.appendChild(ans);

          var edit=document.createElement("button");
          edit.className="secondary";

          edit.style.marginTop="14px";
          edit.onclick=function(){

            qi=item.index;
            si=item.q.sectionIndex;
            mode="question";
            render();
          };
          card.appendChild(edit);

          reviewContent.appendChild(card);
        });
      }
    });

    if(!found){

      empty.className="card";
      empty.textContent="You have not saved any answers yet.";
      reviewContent.appendChild(empty);
    }

    document.body.appendChild(overlay);
  }

  function addButton(){
    if(document.getElementById("reviewAnswersButton")) return;
    if(typeof mode==="undefined" || mode!=="intro") return;

    var buttons=document.querySelectorAll(".bottom button");

    b.onclick=reviewAnswers;

    nextButton.parentNode.insertBefore(b,nextButton);
  }

  // The existing app calls render() dynamically, so observe the Home screen.
  var observer=new MutationObserver(function(){addButton()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addButton,100);
})();
</script>


<script>
(function(){
  function showProgress(){
    var overlay=document.createElement("div");
    overlay.id="progressOverlay";
    overlay.style.cssText="position:fixed;inset:0;background:#fff;z-index:99998;overflow:auto;padding:22px 18px 110px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202124";

    var close=document.createElement("button");
    close.textContent="← Home";
    close.className="secondary";
    close.onclick=function(){overlay.remove()};
    overlay.appendChild(close);

    var h=document.createElement("h1");
    h.textContent="My Progress";
    overlay.appendChild(h);

    var totalAnswered=0, totalQuestions=QUESTIONS.length;

    SECTIONS.forEach(function(section,si){
      var count=0,total=0;
      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex===si){
          total++;
          if((localStorage.getItem(PREFIX+index)||"").trim()!=="") count++;
        }
      });
      totalAnswered+=count;

      var card=document.createElement("div");
      card.className="card";

      var title=document.createElement("div");
      title.style.cssText="font-size:19px;font-weight:700;margin-bottom:8px";
      title.textContent=section.name;
      card.appendChild(title);

      var status=document.createElement("div");
      status.className="status";
      status.textContent=count+" / "+total+" questions answered";
      card.appendChild(status);

      var bar=document.createElement("div");
      bar.style.cssText="height:7px;background:#eee;border-radius:6px;margin-top:12px;overflow:hidden";
      var fill=document.createElement("div");
      fill.style.cssText="height:100%;background:#444;width:"+((count/total)*100)+"%";
      bar.appendChild(fill);
      card.appendChild(bar);

      card.onclick=function(){
        overlay.remove();
        si = si;
        mode="reading";
        render();
      };
      overlay.appendChild(card);
    });

    var summary=document.createElement("div");
    summary.className="card";
    summary.style.marginTop="24px";
    summary.innerHTML="<strong>Overall Progress</strong><div style='font-size:17px;margin-top:8px'>"+
      totalAnswered+" / "+totalQuestions+" questions answered</div>";
    overlay.insertBefore(summary, overlay.children[2]);

    document.body.appendChild(overlay);
  }

  function addProgressButton(){
    if(document.getElementById("progressAnswersButton")) return;
    if(typeof mode==="undefined" || mode!=="intro") return;
    var nextButton=document.getElementById("next");
    if(!nextButton) return;

    var b=document.createElement("button");
    b.id="progressAnswersButton";
    b.className="secondary";
    b.textContent="My Progress";
    b.onclick=showProgress;
    nextButton.parentNode.insertBefore(b,nextButton);
  }

  var observer=new MutationObserver(addProgressButton);
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addProgressButton,100);
})();
</script>

<script>
(function(){
  
  function restoreAnswers(file){
    if(!file){
      alert("No backup file was selected.");
      return;
    }

    var reader=new FileReader();

    reader.onerror=function(){
      alert("Safari could not read that backup file.");
    };

    reader.onload=function(){
      try{
        var data=JSON.parse(reader.result);

        if(!data || !data.answers || typeof data.answers!=="object"){
          throw new Error("Invalid backup format");
        }

        var restored=0;
        if(data.notes && typeof data.notes==="object"){
          Object.keys(data.notes).forEach(function(si){
            if(typeof SECTIONS!=="undefined" && SECTIONS[Number(si)]){
              localStorage.setItem(NOTES_PREFIX+si,String(data.notes[si]||""));
            }
          });
        }

        Object.keys(data.answers).forEach(function(index){
          var n=Number(index);
          if(Number.isInteger(n) && typeof QUESTIONS!=="undefined" && QUESTIONS[n]){
            localStorage.setItem(PREFIX+n,String(data.answers[index]));
            restored++;
          }
        });

        if(restored===0){
          throw new Error("No matching answers");
        }

        alert(restored+" saved answer"+(restored===1?"":"s")+" restored.");
        if(typeof render==="function") render();

      }catch(e){
        alert("That file could not be restored. Please choose a Step One backup file created by this app.");
      }
    };

    reader.readAsText(file);
  }
  function addBackupButtons(){
    if(typeof mode==="undefined" || mode!=="intro") return;
    var nextButton=document.getElementById("next");
    if(!nextButton) return;


    if(!document.getElementById("restoreAnswersWrap")){
      var wrap=document.createElement("div");
      wrap.id="restoreAnswersWrap";
      wrap.style.cssText="margin-top:8px";

      var label=document.createElement("label");
      label.className="secondary";
      label.textContent="Restore My Answers";
      label.style.cssText="display:inline-block;cursor:pointer";

      var input=document.createElement("input");
      input.type="file";
      input.accept=".json,application/json,text/plain";
      input.style.cssText="display:block;margin-top:8px;max-width:100%";
      input.onchange=function(){
        if(input.files && input.files.length){
          restoreAnswers(input.files[0]);
        }
      };

      wrap.appendChild(label);
      wrap.appendChild(input);
      nextButton.parentNode.insertBefore(wrap,nextButton);
    }
  }
  var observer=new MutationObserver(function(){addBackupButtons()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addBackupButtons,100);
})();
</script>


<script>
(function(){
  function addCompletionSystem(){
    if(typeof SECTIONS==="undefined" || typeof QUESTIONS==="undefined") return;

    function sectionStats(si){
      var answered=0,total=0;
      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex===si){
          total++;
          if((localStorage.getItem(PREFIX+index)||"").trim()!=="") answered++;
        }
      });
      return {answered:answered,total:total,complete:total>0 && answered===total};
    }

    // Enhance the existing My Progress overlay after it is opened.
    var originalShowProgress=window.showProgress;
    if(typeof originalShowProgress!=="function" || originalShowProgress.__completionEnhanced) return;

    function enhancedProgress(){
      originalShowProgress();

      setTimeout(function(){
        var overlay=document.getElementById("progressOverlay");
        if(!overlay) return;

        var cards=overlay.querySelectorAll(".card");
        var sectionCards=[];
        cards.forEach(function(card){
          var title=card.querySelector("div");
          if(title && title.textContent && title.textContent!=="Overall Progress"){
            sectionCards.push(card);
          }
        });

        SECTIONS.forEach(function(section,si){
          var stats=sectionStats(si);
          var card=sectionCards[si];
          if(!card) return;

          var badge=card.querySelector(".completionBadge");
          if(!badge){
            badge=document.createElement("div");
            badge.className="completionBadge";
            badge.style.cssText="font-size:12px;font-weight:750;letter-spacing:.07em;margin-top:9px";
            card.appendChild(badge);
          }

          if(stats.complete){
            badge.textContent="✓ COMPLETED";
            badge.style.color="#2f6b3f";
          }else if(stats.answered>0){
            badge.textContent="IN PROGRESS";
            badge.style.color="#666";
          }else{
            badge.textContent="NOT STARTED";
            badge.style.color="#999";
          }
        });

        var allComplete=SECTIONS.every(function(_,si){return sectionStats(si).complete;});
        if(allComplete){
          var done=document.createElement("div");
          done.className="card";
          done.style.marginTop="18px";
          done.innerHTML="<strong>✓ STEP ONE COMPLETED</strong><div style='margin-top:8px;font-size:16px;line-height:1.5'>You have answered every Step One question.</div>";
          overlay.appendChild(done);
        }
      },0);
    }

    enhancedProgress.__completionEnhanced=true;
    window.showProgress=enhancedProgress;
  }

  var observer=new MutationObserver(function(){addCompletionSystem()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addCompletionSystem,100);
})();
</script>

        QUESTIONS.forEach(function(q,index){

<script>
function getStepReviewText() {
  const step = 1;
  let lines = [];
  lines.push("An Interactive Working Guide to the 12 Steps of NA");
  lines.push("Step " + step + " — My Review Answers");
  lines.push("");
  const root = document.body;
  // Collect visible question/answer pairs from the current Step 1 review.
  // Prefer review containers and textarea/input values, while avoiding navigation controls.
  const fields = Array.from(root.querySelectorAll("textarea, input[type='text'], input:not([type])"));
  let q = 0;
  fields.forEach(el => {
    if (!el.offsetParent) return;
    const value = (el.value || "").trim();
    if (!value) return;
    const prev = el.closest(".question, .q, .card, .section, div");
    let label = "";
    if (prev) {
      const heading = prev.querySelector("h1,h2,h3,h4,strong,label");
      if (heading) label = heading.textContent.trim();
    }
    if (!label) {
      q++;
      label = "Answer " + q;
    }
    lines.push(label + ":");
    lines.push(value);
    lines.push("");
  });
  // If the review page has generated text, include it as a fallback.
  if (lines.length <= 4) {
    const review = document.querySelector("#review, .review, [id*='review']");
    if (review) {
      const clone = review.cloneNode(true);
      clone.querySelectorAll("button, script, style").forEach(x => x.remove());
      const body = clone.innerText.trim();
      if (body) lines.push(body);
    }
  }
  return lines.join("\n").trim();
}

function shareReview() {
  const panel = document.getElementById("sharePanel");
  if (panel) panel.classList.toggle("show");
}

function shareByEmail() {
  const body = encodeURIComponent(getStepReviewText());
  window.location.href = "mailto:?subject=" + encodeURIComponent("NA Step 1 — My Review Answers") + "&body=" + body;
}

function shareByText() {
  const body = encodeURIComponent(getStepReviewText());
  // sms: works across common iOS/Android configurations; the user selects the recipient.
  window.location.href = "sms:?&body=" + body;
}

async function copyReviewToClipboard() {
  const text = getStepReviewText();
  try {
    await navigator.clipboard.writeText(text);
    const status = document.getElementById("shareStatus");
    if (status) status.textContent = "Review answers copied to the clipboard.";
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      const status = document.getElementById("shareStatus");
      if (status) status.textContent = "Review answers copied to the clipboard.";
    } finally {
      document.body.removeChild(ta);
    }
  }
}
</script>

<script>
(function(){
  const STEP_NO = (document.title.match(/Step (\\d+)/i)||[])[1] || (document.body.innerText.match(/Step (\\d+)/i)||[])[1] || "";
  const ANSWER_PREFIX = (typeof PREFIX !== "undefined") ? PREFIX : "";
  const NOTES_PREFIX_LOCAL = (typeof NOTES_PREFIX !== "undefined") ? NOTES_PREFIX : ("step"+STEP_NO+"Notes_");
  const STATE_KEY_LOCAL = (typeof STATE !== "undefined") ? STATE : "";
  const STEP_KEYS = {
    1:{prefix:"step-one-complete-v4-",notes:"stepOneNotes_",state:"step-one-v4-resume-state"},
    2:{prefix:"step-two-complete-v1-",notes:"stepOneNotes_",state:"step-two-v1-resume-state"},
    3:{prefix:"step-three-complete-v1-",notes:"stepOneNotes_",state:"step-three-v1-resume-state"},
    4:{prefix:"step-four-complete-v1-",notes:"stepOneNotes_",state:"step-four-v1-resume-state"},
    5:{prefix:"step-five-complete-v1-",notes:"stepOneNotes_",state:"step-five-v1-resume-state"},
    6:{prefix:"step-six-complete-v1-",notes:"stepOneNotes_",state:"step-six-v1-resume-state"},
    7:{prefix:"step-seven-v1-",notes:"step7Notes_",state:"step-seven-v1-resume-state"},
    8:{prefix:"step-eight-v1-",notes:"step8Notes_",state:"step-eight-v1-resume-state"},
    9:{prefix:"step-nine-v1-",notes:"step9Notes_",state:"step-nine-v1-resume-state"},
    10:{prefix:"step-ten-v1-",notes:"step10Notes_",state:"step-ten-v1-resume-state"},
    11:{prefix:"step-eleven-v1-",notes:"step11Notes_",state:"step-eleven-v1-resume-state"},
    12:{prefix:"step-twelve-v1-",notes:"step12Notes_",state:"step-twelve-v1-resume-state"}
  };
  function collect(){
    const data={format:"NA-Step-Working-Guide-Backup",version:1,created:new Date().toISOString(),steps:{}};
    for(let n=1;n<=12;n++){
      const cfg=STEP_KEYS[n], answers={}, notes={};
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k && k.indexOf(cfg.prefix)===0) answers[k.slice(cfg.prefix.length)]=localStorage.getItem(k);
        if(k && k.indexOf(cfg.notes)===0) notes[k.slice(cfg.notes.length)]=localStorage.getItem(k);
      }
      data.steps[n]={answers,notes,state:localStorage.getItem(cfg.state)};
    }
    return data;
  }
  function download(){
    const blob=new Blob([JSON.stringify(collect(),null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="NA-Step-Working-Guide-Backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  function restore(file){
    const reader=new FileReader();
    reader.onerror=()=>alert("The backup file could not be read.");
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        if(data.format!=="NA-Step-Working-Guide-Backup" || !data.steps) throw new Error();
        let restored=0;
        for(let n=1;n<=12;n++){
          const cfg=STEP_KEYS[n], s=data.steps[n]||data.steps[String(n)];
          if(!s) continue;
          if(s.answers) Object.keys(s.answers).forEach(k=>{localStorage.setItem(cfg.prefix+k,String(s.answers[k]??""));restored++;});
          if(s.notes) Object.keys(s.notes).forEach(k=>localStorage.setItem(cfg.notes+k,String(s.notes[k]??"")));
          if(s.state) localStorage.setItem(cfg.state,String(s.state));
        }
        if(!restored) throw new Error();
        alert("Backup restored successfully. "+restored+" answer entries were restored across the workbook.");
        if(typeof render==="function") render();
      }catch(e){ alert("That file is not a valid NA Step Working Guide backup."); }
    };
    reader.readAsText(file);
  }
  function addPanel(){
    if(typeof mode==="undefined" || mode!=="intro" || document.getElementById("backupPanel")) return;
    const next=document.getElementById("next"); if(!next) return;
    const wrap=document.createElement("div"); wrap.id="backupPanel";
    wrap.style.cssText="margin:18px 0 8px;padding:16px;border:1px solid #ddd;border-radius:14px;background:#f7f7f8;text-align:left";
    wrap.innerHTML='<div style="font-size:18px;font-weight:700;margin-bottom:6px">Backup & Restore</div><div style="font-size:14px;line-height:1.45;margin-bottom:12px">Your answers save automatically on this device. Create a backup file if you want to keep a copy or move your work to another device.</div>';
    const exp=document.createElement("button"); exp.className="secondary"; exp.textContent="Export My Answers"; exp.style.margin="4px 6px 4px 0"; exp.onclick=download;
    const label=document.createElement("label"); label.textContent="Restore My Answers"; label.style.cssText="display:inline-block;border-radius:10px;padding:12px 15px;background:#222;color:#fff;font-size:15px;cursor:pointer;margin:4px 0";
    const input=document.createElement("input"); input.type="file"; input.accept=".json,application/json,text/plain"; input.style.display="none"; input.onchange=()=>{if(input.files&&input.files[0]) restore(input.files[0]);};
    label.appendChild(input); wrap.appendChild(exp); wrap.appendChild(label); next.parentNode.insertBefore(wrap,next);
  }
  const old=document.createElement('style'); old.textContent='#restoreAnswersWrap{display:none!important}'; document.head.appendChild(old);
  new MutationObserver(addPanel).observe(document.body,{childList:true,subtree:true}); setTimeout(addPanel,100);
})();
</script>

<script id="naCompactNav">
(function(){
  function txt(el){return (el.innerText||el.textContent||"").trim().replace(/\s+/g," ");}
  function setup(){
    var bottom=document.querySelector(".bottom");
    if(!bottom)return;
    var home=document.getElementById("home"), back=document.getElementById("back"), next=document.getElementById("next");
    if(!home||!back||!next)return;

    var drawer=document.getElementById("naToolsDrawer");
    if(!drawer){
      drawer=document.createElement("div");
      drawer.id="naToolsDrawer";
      drawer.innerHTML='<div class="tools-title">Step Tools</div>';
      document.body.appendChild(drawer);
    }
    var tools=document.getElementById("mobileToolsButton");
    if(!tools){
      tools=document.createElement("button");
      tools.id="mobileToolsButton";
      tools.type="button";
      tools.className="secondary";
      tools.textContent="Tools";
      tools.onclick=function(e){e.stopPropagation();drawer.classList.toggle("open");};
    }
    if(tools.parentNode!==bottom) bottom.insertBefore(tools,next);

    var primary=[home,back,tools,next];
    Array.prototype.slice.call(bottom.children).forEach(function(el){
      if(primary.indexOf(el)!==-1)return;
      el.classList.add("tool-item");
      drawer.appendChild(el);
    });

    var panel=document.getElementById("backupPanel");
    if(panel && panel.parentNode!==drawer){
      drawer.appendChild(panel);
    }
  }
  function run(){setup();}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run);else run();
  [100,300,700,1200].forEach(function(ms){setTimeout(run,ms);});
  new MutationObserver(run).observe(document.body,{childList:true,subtree:true});
  document.addEventListener("click",function(e){
    var drawer=document.getElementById("naToolsDrawer"),tools=document.getElementById("mobileToolsButton");
    if(drawer&&drawer.classList.contains("open")&&!drawer.contains(e.target)&&e.target!==tools)drawer.classList.remove("open");
  });
})();
</script>
