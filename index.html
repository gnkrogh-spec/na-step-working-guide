<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><link rel="manifest" href="./manifest.webmanifest">
<title>NA Step Guide</title>
<style>html,body{margin:0;height:100%;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}iframe{display:block;width:100%;height:100%;border:0;background:#fff}
@media (max-width: 600px){
  main{padding-bottom:190px}
  .bottom{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    justify-content:stretch;
  }
  .bottom button{width:100%;min-height:44px}
  .bottom #next{grid-column:1 / -1}
}

/* NA App — compact navigation design target */
.bottom{
  position:fixed !important;
  z-index:10000 !important;
  left:0 !important; right:0 !important; bottom:0 !important;
  height:48px !important;
  min-height:48px !important;
  max-height:48px !important;
  padding:4px 10px !important;
  background:rgba(255,255,255,.97) !important;
  border-top:1px solid #ddd !important;
  display:flex !important;
  align-items:center !important;
  justify-content:space-between !important;
  gap:8px !important;
  box-sizing:border-box !important;
}
.bottom > button{
  flex:1 1 0 !important;
  width:auto !important;
  min-width:0 !important;
  height:38px !important;
  min-height:38px !important;
  max-height:38px !important;
  margin:0 !important;
  padding:3px 8px !important;
  border-radius:7px !important;
  font-size:13px !important;
  line-height:1.05 !important;
}
#mobileToolsButton{background:#e8e9ec !important;color:#222 !important}
#naToolsDrawer{
  position:fixed !important;
  left:10px !important; right:10px !important; bottom:56px !important;
  z-index:10001 !important;
  max-height:65vh !important;
  overflow:auto !important;
  background:#fff !important;
  border:1px solid #d5d5d5 !important;
  border-radius:14px !important;
  box-shadow:0 8px 30px rgba(0,0,0,.18) !important;
  padding:14px !important;
  display:none;
}
#naToolsDrawer.open{display:block !important}
#naToolsDrawer .tools-title{
  font-size:18px !important;font-weight:700 !important;margin:0 0 8px !important;
}
#naToolsDrawer .tool-item{
  display:block !important;width:100% !important;
  margin:6px 0 !important;padding:9px 10px !important;
  min-height:40px !important;font-size:14px !important;
}
#naToolsDrawer #backupPanel{
  display:block !important;margin:10px 0 0 !important;padding:14px !important;
}
@media(max-width:600px){
  .bottom{height:42px !important;min-height:42px !important;max-height:42px !important;padding:3px 6px !important;gap:4px !important}
  .bottom > button{height:34px !important;min-height:34px !important;max-height:34px !important;padding:2px 5px !important;font-size:11px !important;border-radius:6px !important}
  #naToolsDrawer{left:6px !important;right:6px !important;bottom:48px !important;padding:10px !important}
  #naToolsDrawer .tools-title{font-size:16px !important}
  main{padding-bottom:58px !important}
}

</style>
</head><body><iframe src="./NA_Step_1_WORKING_COPY.html" title="NA Step Working Guide"></iframe>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>

<script id="naCompactNav">
(function(){
  function txt(el){return (el.innerText||el.textContent||"").trim().replace(/\s+/g," ");}
  function setup(){
    var bottom=document.querySelector(".bottom");
    if(!bottom)return;
    var home=document.getElementById("home"), back=document.getElementById("back"), next=document.getElementById("next");
    if(!home||!back||!next)return;

    var drawer=document.getElementById("naToolsDrawer");
    if(!drawer){
      drawer=document.createElement("div");
      drawer.id="naToolsDrawer";
      drawer.innerHTML='<div class="tools-title">Step Tools</div>';
      document.body.appendChild(drawer);
    }
    var tools=document.getElementById("mobileToolsButton");
    if(!tools){
      tools=document.createElement("button");
      tools.id="mobileToolsButton";
      tools.type="button";
      tools.className="secondary";
      tools.textContent="Tools";
      tools.onclick=function(e){e.stopPropagation();drawer.classList.toggle("open");};
    }
    if(tools.parentNode!==bottom) bottom.insertBefore(tools,next);

    var primary=[home,back,tools,next];
    Array.prototype.slice.call(bottom.children).forEach(function(el){
      if(primary.indexOf(el)!==-1)return;
      el.classList.add("tool-item");
      drawer.appendChild(el);
    });

    var panel=document.getElementById("backupPanel");
    if(panel && panel.parentNode!==drawer){
      drawer.appendChild(panel);
    }
  }
  function run(){setup();}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run);else run();
  [100,300,700,1200].forEach(function(ms){setTimeout(run,ms);});
  new MutationObserver(run).observe(document.body,{childList:true,subtree:true});
  document.addEventListener("click",function(e){
    var drawer=document.getElementById("naToolsDrawer"),tools=document.getElementById("mobileToolsButton");
    if(drawer&&drawer.classList.contains("open")&&!drawer.contains(e.target)&&e.target!==tools)drawer.classList.remove("open");
  });
})();
</script>

</body></html>
