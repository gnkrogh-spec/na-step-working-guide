</style></head><body><div class="app">
<header><div class="title">An Interactive Working Guide to the 12 Steps of NA</div><div class="sub"></div></header>
<div class="progress"><div id="bar" class="bar"></div></div><main id="main"></main>
<div class="bottom"><button id="home" class="secondary">Home</button><button id="back" class="secondary">← Back</button><button id="next">Begin Step 5 →</button></div>
</div>
<script>
const INTRO="“We admitted to God, to ourselves, and to another human being the exact nature of our wrongs.\" Our Basic Text tells us that \"Step Five is not simply a reading of Step Four.\" Yet we know that reading our Fourth Step to another human being is certainly part of Step Five. So what's the rest, the part that's more than simply a reading? It's the admission we make-to God, to ourselves, and to another human being-that brings about the spiritual growth connected with this step. We've had some experience with making admissions already. We've admitted we have a disease; we've admitted we need help; we've admitted there's a Power that could help us. Drawing on our experience with these admissions will help us in Step Five. Many of us finished our Fourth Step with a sense of relief, thinking that the really hard part was over, only to realize that we still had the Fifth Step to do. That's when the fear set in. Some of us were afraid that our sponsor would reject or judge us. Others hesitated because we didn't want to bother our sponsor with so much. We weren't sure we trusted our sponsor to keep our secrets. We may have been concerned about what the inventory might reveal. There might be something hidden from us that our sponsor would spot immediately - and it probably wouldn't be anything good. Some of us were afraid of having to re-feel old feelings, and wondered if there was really any benefit to stirring up the past. Some of us felt that as long as we hadn't actually spoken our inventories out loud, the contents wouldn't be quite real. If we consider all our feelings about the Fifth Step, we may find that we are also motivated to continue this process by a desire for more recovery. We think about the people we know who have worked this step. We're struck by their genuineness and by their ability to connect with others. They aren't always talking about themselves. They're asking about others, and they're truly interested in knowing the answer. And if we ask them how they learned so much about relationships with others, they'll probably tell us that they began learning when they worked Step Five. Many of us, having worked the Fourth and Fifth Steps before, knew that this process always resulted in change-in other words, we'd have to stop behaving the same old way! We may not have been entirely sure we wanted that. On the other hand, many of us knew we had to change, but were afraid we couldn't. Two things we need to begin working Step Five are courage and a sense of trust in the process of recovery. If we have both these things, we'll be able to work through more specific fears and go through with the admissions we need to make in this step.";
const SECTIONS=[{"name": "Facing Fears", "reading": "Any of the fears we've talked about here might be ours, or we might have other fears that plague us. It's essential that we know what our fears are and move forward in spite of them so that we're able to continue with our recovery.\n\nNo matter what our fears stem from, most of our members have done pretty much the same things to deal with them: We pray for courage and willingness, read the section from It Works: How and Why on the Fifth Step, and seek reassurance from other members. Many of us have had the experience of going to step study meetings and finding that, coincidentally, the topic always seems to be Step Four or Five. If we make the effort to share what we're going through, we're sure to get the support we need from other members. Calling upon the spiritual resources we have developed through working the previous steps will allow us to proceed with our Fifth Step.", "count": 4}, {"name": "Admitted To God", "reading": "The chapter on Step Five in It Works: How and Wzy answers the question about why we must admit the exact nature of our wrongs to God in addition to admitting them to ourselves and another human being. In NA, we experience a way of life where the spiritual meets the everyday, where the ordinary meets the extraordinary. When we admit the exact nature of our wrongs to the God of our understanding, our admission becomes more meaningful. How we make our admission to the God of our understanding depends on the specifics of our understanding. Some make a formal admission to God apart from the admissions we make to ourselves and another human being. Others acknowledge or invite the presence of a Higher Power in some way before going over the inventory with their sponsor. Those of us whose Higher Power is the spiritual principles of recovery or the power of the NA Fellowship may have to explore different methods of working this portion of the Fifth Step. Our sponsor can help with this process. Whatever we do is okay as long as we are aware that we are also making our admission to a Higher Power.", "count": 2}, {"name": "To Ourselves", "reading": "When we were using, most of us probably had people telling us we had a drug problem and should get some help. Their comments didn't really matter to us. Or even if they did matter, it wasn't enough to stop us from using. Not until we admitted our addiction to ourselves and surrendered to the NA program were we able to stop using. It's just the same with the admission we make in the Fifth Step. We can have everyone from our spouse to our employer to our sponsor telling us what we're doing that's working against us, but until we admit to our own innermost selves the exact nature of our wrongs, we're not likely to have the willingness or the ability to choose another way.", "count": 2}, {"name": "And To Another Human Being", "reading": "As addicts, one of the biggest problems we have is telling the difference between our responsibility and the responsibilities of others. We blame ourselves for catastrophes over which we have no control. Conversely, we're often in complete denial about how we have hurt ourselves and others. We overdramatize minor troubles, and we shrug off major problems we really should be taking a look at. If were not sure what the exact nature of our wrongs is when we begin our Fifth Step, we'll know by the time we finish-because of making our admissions to another human being. What we can't see, our listener can, and he or she will help us sort out what we need to accept as our responsibility and what we don't. Most of us asked someone to be our sponsor before we began formally working the steps, and have been developing a relationship with that person ever since. For most of us, our sponsor will be the \"another human being\" we choose to hear our Fifth Step He or she will help us separate the things that were not our responsibility from the things that were. The relationship we have been building with our sponsor will give us the trust we need to have in him or her. The therapeutic value of one addict helping another is often powerfully demonstrated when our sponsor shares details from his or her own inventory as we share ours. This goes a long way toward reassuring us that we are not unique. The trust we must have in the person who is to hear our Fifth Step goes beyond simply being assured that he or she will keep our confidences. We need to trust that our listener can respond appropriately to what we are sharing. One of the primary reasons that so many of us find ourselves choosing our sponsor as the person who will listen to our Fifth Step is because he or she understands what we're doing and therefore knows just what kind of support we need during this process. Also, if our sponsor is our listener, it will help promote continuity when we work the following steps. Still, if for any reason we choose someone else to hear our Fifth Step admission, his or her \"qualifications\" are the same ones we would look for in our sponsor: an ability to be supportive without minimizing our responsibility, someone who can provide a steadying influence if we begin to feel overwhelmed during our Fifth Step - in short, someone with compassion, integrity, and insight.\n\nFor most of us, developing an honest relationship is something new. We're very good at running away from relationships the first time someone tells us a painful truth. We're also good at having polite, distant interactions with no real depth. The Fifth Step helps us to develop honest relationships. We tell the truth about who we are - then, the hard part: we listen to the response. Most of us have been terrified of having a relationship like this. The Fifth Step gives us a unique opportunity to try such a relationship in a safe context. We can be pretty much assured that we won't be judged.", "count": 5}, {"name": "The Exact Nature of Our Wrongs", "reading": "Another way to ensure that our Fifth Step is \"not simply a reading of Step Four\" is to focus on what we are supposed to be admitting: the exact nature of our wrongs. There is a diversity of experience in our fellowship about what, precisely, is \"the exact nature of our wrongs. Most of us agree that, in working Step Five, we should be focusing our attention on what's behind the patterns of our addiction and the reasons we acted out in the ways we did. Identifying the exact nature of our wrongs is often something that happens while we're sharing our inventory. Sometimes the repetition of the same type of situation will reveal the exact nature of that situation. Why do we, for example, keep choosing to involve ourselves with people who don't have our best interests at heart? Why do we keep approaching every relationship we have as though our very lives depended on having the upper hand? Why do we feel threatened by new experiences, and so keep avoiding them? Finding the common thread in our own patterns will lead us right to the exact nature of our wrongs. At some point in this process, we will probably begin calling certain patterns of behavior our \"character defects.\" Though it won't be until the Sixth Step that we begin an in-depth examination of how each one of our defects plays a role in keeping us sick, it certainly won't hurt to allow this knowledge to begin forming in us now.", "count": 2}, {"name": "Spiritual Principles", "reading": "In the Fifth Step, we will focus on trust, courage, self-honesty, and commitment. Practicing the spiritual principle of trust is essential if we are to get through the Fifth Step. As mentioned above, we will probably have some experience with our sponsor that allows us to trust him or her enough to go ahead with this step; but what about the more profound issues that arise when we wonder if working this step will really do any good? We have to trust a process as well as another person. The connection between the Fifth Step and our spiritual development isn't always clear to us. This doesn't mean that the connection is any less real, but it may make it harder for us to trust the process.\n\nCourage is one principle we'll have to practice just to get started on this step. We'll probably need to continue drawing on our courage periodically throughout our work on this step. When we replace the phone on its hook just as we are about to call our sponsor for an appointment to make our admissions, we're feeling fear and we need to practice courage. When we're sharing our inventory and we see a paragraph that we just can't tell anyone about, we need to face that moment of fear with courage and go ahead with sharing all of our inventory. When we've just shared something excruciatingly painful, and our feelings of vulnerability are so overwhelming that we want to shut down before we hear what our sponsor has to say, we're at a defining moment in our recovery and we need to choose the courageous path. Doing so will influence the future course of our lives. Each time we feel fear, we remind ourselves that giving in to it has rarely had anything but negative consequences in our lives, and doing so this time won't be any different. Such a reminder should be sufficient to motivate us to gather our courage.\n\nPracticing the principle of self-honesty is essential when we admit to ourselves the exact nature of our wrongs. Just as we mustn't disassociate ourselves from our emotions simply because we're afraid of our listener's response, so we can't afford to shut down our own reactions. We must allow ourselves to experience the natural and human reaction to the subject under discussion: our lives as addicts. Our lives have been sad. We've missed out on a lot because of our addiction. We've hurt people we loved because of our addiction. These realizations are painful. However, if we pay close attention, we'll probably recognize another feeling that's beginning to form in the wake of the pain: hope. We've finally stopped using over our feelings, running away from our feelings, and shutting down because of our feelings; now, for the first time, we have a chance to walk through our feelings, even the painful ones, with courage. Doing so will, in the long run, make us feel better about ourselves. This is one of the paradoxes that we often find in recovery. What begins in pain ends in joy and serenity.\n\nThe principle of commitment is demonstrated by the action we take in this step. Many of us have made so-called \"commitments\" in our lives, commitments to which we had no intention of sticking to in tough times; our \"commitments\" were made solely for the sake of convenience. With each step we've taken in the program of NA, we've deepened our real, practical commitment to the program. Getting a sponsor, working the steps, finding a home group and going to its meetings - each one of these actions demonstrates that we're committed to our recovery in a practical, meaningful way.", "count": 8}, {"name": "Moving On", "reading": "One of the many benefits we get from working Step Five is a sense of self-acceptance. We clearly recognize who we are today, and accept ourselves without reservation. Just because we're lacking in certain areas doesn't mean we're worthless. We begin to see that we have both assets and defects. We're capable of great good - and of inflicting great harm. There are aspects of our personalities that make us very special. Our experiences, even the negative ones, have often contributed to the development of the very best parts of us. For the first time, we're able to acknowledge that we're okay just as we are, right at this moment. But accepting ourselves as we are today doesn't mean we can relax and stop striving for improvement. True self-acceptance includes accepting what we're lacking. It wouldn't be self-acceptance if we believed we had no further growing to do - it would be denial. So we acknowledge what we're lacking, and we make a commitment to work on it. If we want to be more compassionate, we work on it by practicing the principle of compassion. If we want to be better educated, we take the time to learn. If we want to have more friends, we take the time to develop our relationships.\n\nAs we finish Step Five, we may feel a sense of relief; we've unburdened ourselves by sharing what we previously had put a lot of energy into hiding or suppressing. It is true that our \"defects... die in the light of exposure.\" Exposure to the light brings a sense of freedom that we feel no matter what the outer circumstances of our lives may be like. All of our relationships begin to change as a result of working this step. We especially need to acknowledge how much our relationship with ourselves, with a Higher Power, and with other people have changed:\n\nAlong with a sense of relief, our weariness with our character defects has probably reached a peak. This will translate easily into a state of being entirely ready-just what we need to begin Step Six! Step Six", "count": 5}];
const QUESTIONS=[{"sectionIndex": 0, "text": "What reservations do I have about working the Fifth Step?"}, {"sectionIndex": 0, "text": "Do I have any fears at this point? What are they?"}, {"sectionIndex": 0, "text": "What am I doing to work through my fears about doing a Fifth Step?"}, {"sectionIndex": 0, "text": "How has working the first four steps prepared me to work the Fifth Step?"}, {"sectionIndex": 1, "text": "How will I include the God of my understanding in my Fifth Step?"}, {"sectionIndex": 1, "text": "How is my Third Step decision reaffirmed by working the Fifth Step?"}, {"sectionIndex": 2, "text": "Can I acknowledge and accept the exact nature of my wrongs?"}, {"sectionIndex": 2, "text": "How will making this admission change the direction of my life?"}, {"sectionIndex": 3, "text": "What qualities does my listener have that are attractive to me?"}, {"sectionIndex": 3, "text": "How will his or her possession of these qualities help me make my admissions more effectively?"}, {"sectionIndex": 3, "text": "Am I willing to trust the person who is to hear my Fifth Step?"}, {"sectionIndex": 3, "text": "What do I expect from that person?"}, {"sectionIndex": 3, "text": "How will working the Fifth Step help me begin to develop new ways of having relationships?"}, {"sectionIndex": 4, "text": "How does the exact nature of my wrongs differ from my actions?"}, {"sectionIndex": 4, "text": "Why do I need to admit the exact nature of my wrongs, and not just the wrongs themselves?"}, {"sectionIndex": 5, "text": "Do I believe that working the Fifth Step will somehow make my life better? How?"}, {"sectionIndex": 5, "text": "What are some of the ways in which I can find the courage I need to work this step?"}, {"sectionIndex": 5, "text": "How does practicing the principle of courage in working this step affect my whole recovery?"}, {"sectionIndex": 5, "text": "Have I set a time and place for my Fifth Step? When and where?"}, {"sectionIndex": 5, "text": "How have I avoided self-honesty in the past? What am I doing to practice it now?"}, {"sectionIndex": 5, "text": "How is a more realistic view of myself connected to humility?"}, {"sectionIndex": 5, "text": "How does practicing the principle of self-honesty help me accept myself?"}, {"sectionIndex": 5, "text": "How does sharing my inventory with my sponsor further my commitment to the NA program?"}, {"sectionIndex": 6, "text": "How has working Step Five increased my humility and self-acceptance?"}, {"sectionIndex": 6, "text": "How has my relationship with a Higher Power changed as a result of working the Fifth Step?"}, {"sectionIndex": 6, "text": "How has my relationship with my sponsor changed as a result of working the Fifth Step?"}, {"sectionIndex": 6, "text": "How has my view of myself changed as a result of working this step?"}, {"sectionIndex": 6, "text": "To what extent have I developed love and compassion for myself and others?"}];
const PREFIX="step-five-complete-v1-";
const STATE="step-five-v1-resume-state";
let mode="intro",si=0,qi=0;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function cleanReading(s){return s.replace(/\s+/g," ").trim();}
function saveAnswer(){const a=document.getElementById("answer");if(a)localStorage.setItem(PREFIX+qi,a.value)}
function getState(){try{return JSON.parse(localStorage.getItem(STATE)||"null")}catch(e){return null}}
function saveState(){localStorage.setItem(STATE,JSON.stringify({mode:mode,si:si,qi:qi}))}
function hasAnswers(){return QUESTIONS.some((_,i)=>localStorage.getItem(PREFIX+i))}
function update(){document.getElementById("bar").style.width=(mode==="intro"?0:mode==="reading"?((si)/SECTIONS.length*100):((qi+1)/QUESTIONS.length*100))+"%";}

function getResumeState(){
 try{
   const raw=localStorage.getItem(STATE);
   return raw ? JSON.parse(raw) : null;
 }catch(e){ return null; }
}
function saveResumeState(){
 if(mode==="question" || mode==="reading"){
   localStorage.setItem(STATE,JSON.stringify({mode:mode,si:si,qi:qi}));
 }
}
function toc(){
 mode="toc";
 main.innerHTML='<div class="eyebrow">Narcotics Anonymous</div><h1>Table of Contents</h1>'+
   '<div class="card"><div class="reading">Choose a step to begin or continue your work. You can return here at any time.</div></div>'+
   '<div id="tocList"></div>';
 const list=document.getElementById("tocList");
 const steps=["One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve"];
 steps.forEach(function(name,idx){
   const n=idx+1;
   const b=document.createElement("button");
   b.textContent="Step "+name;
   b.style.cssText="display:block;width:100%;text-align:left;margin:10px 0;padding:16px 18px;font-size:17px";
   b.onclick=function(){window.location.href="NA_Step_"+n+"_WORKING_COPY.html"};
   list.appendChild(b);
 });
 back.disabled=true;
 next.textContent="Begin Step Five →";
 update();
}
function intro(){
 mode="intro";
  document.querySelector("header .sub").textContent="Step Five";
  document.title="An Interactive Working Guide to the 12 Steps of NA — Step Five";
 const saved=getResumeState();
 let resumeText="";
 if(saved && saved.mode!=="intro"){
   if(saved.mode==="question"){
     const q=QUESTIONS[saved.qi];
     resumeText=q.section+" — Question "+q.number+" of "+q.count;
   } else {
     resumeText=SECTIONS[saved.si].name+" — Reading";
   }
 }
 main.innerHTML=
   '<div class="eyebrow">Step 5</div><h1>Step 5</h1>'+
   '<div class="card"><div class="reading">'+esc(cleanReading(INTRO))+'</div></div>'+
   (resumeText?
     '<div class="resume" style="border:1px solid #ddd;border-radius:14px;padding:16px;background:#fafafa;margin:18px 0">'+
       '<div class="eyebrow">Continue Where You Left Off</div>'+
       '<div style="font-size:17px;line-height:1.4;margin-bottom:12px">'+esc(resumeText)+'</div>'+
       '<button id="continue">Continue Step 5 →</button>'+
     '</div>':'');
 if(saved && resumeText){
   document.getElementById("continue").onclick=function(){
     mode=saved.mode; si=saved.si; qi=saved.qi; render();
   };
 }
 back.disabled=true;
 next.textContent=resumeText?"Restart Step 5":"Begin Step 5 →";
 update();
}
function reading(){
 mode="reading";saveResumeState();const s=SECTIONS[si];
 main.innerHTML='<div class="eyebrow">Section '+(si+1)+' of '+SECTIONS.length+'</div><h1>'+esc(s.name)+'</h1><div class="card"><div class="reading">'+esc(cleanReading(s.reading))+'</div></div><button id="begin">Begin this section’s questions →</button>';
 document.getElementById("begin").onclick=function(){qi=QUESTIONS.findIndex(q=>q.sectionIndex===si);mode="question";render()};
 back.disabled=si===0;next.textContent="Questions →";update();
}
function question(){
 mode="question";saveResumeState();const q=QUESTIONS[qi],ans=localStorage.getItem(PREFIX+qi)||"";
 main.innerHTML='<div class="eyebrow">'+esc(q.section)+' • Question '+q.number+' of '+q.count+'</div><div class="question">• '+esc(q.text)+'</div><textarea id="answer" placeholder="Type your answer here...">'+esc(ans)+'</textarea><div class="status">Saved automatically on this device.</div>';
 const a=document.getElementById("answer");a.addEventListener("input",function(){localStorage.setItem(PREFIX+qi,a.value);saveState()});
 back.disabled=qi===0;next.textContent=qi===QUESTIONS.length-1?"Finish Step 5":"Save & Next →";update();
}
function render(){
  if(mode==="welcome")welcome();
  else if(mode==="toc")toc();
  else if(mode==="intro")intro();
  else if(mode==="reading")reading();
  else question();
  saveResumeState();
  update();
}
home.onclick=function(){if(mode==="question")saveAnswer();mode="intro";render()};
back.onclick=function(){
 if(mode==="question"){saveAnswer();const current=QUESTIONS[qi].sectionIndex,first=QUESTIONS.findIndex(q=>q.sectionIndex===current);if(qi===first){si=current;mode="reading"}else qi--;render()}
 else if(mode==="reading"){if(si===0)mode="intro";else si--;render()}
 else if(mode==="toc"){mode="welcome";render()}
};
next.onclick=function(){
  if(mode==="intro"){
   const saved=getResumeState();
   if(saved && next.textContent==="Restart Step 5"){
     if(confirm("Restart Step 5? Your saved answers will remain on this device.")){
       si=0;qi=0;mode="reading";render();
     }
   }else{
     si=0;qi=0;mode="reading";render();
   }
   return;
}
 if(mode==="reading"){qi=QUESTIONS.findIndex(q=>q.sectionIndex===si);mode="question";render();return}
 saveAnswer();
 if(qi<QUESTIONS.length-1){const old=QUESTIONS[qi].sectionIndex;qi++;if(QUESTIONS[qi].sectionIndex!==old){si=QUESTIONS[qi].sectionIndex;mode="reading"}render()}
 else{alert("Step 5 is complete. Your answers remain saved on this device. Moving to Step 6.");window.location.href="NA_Step_6_WORKING_COPY.html"}
};
render();
</script>
<script>
(function(){
  function reviewAnswers(){
    var overlay=document.createElement("div");
    overlay.id="reviewOverlay";
    overlay.style.cssText="position:fixed;inset:0;background:#fff;z-index:99999;overflow:auto;padding:22px 18px 110px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202124";

    var close=document.createElement("button");
    close.textContent="← Home";
    close.className="secondary";
    close.onclick=function(){overlay.remove()};
    overlay.appendChild(close);

    var h=document.createElement("h1");
    h.textContent="Step 5 — Review My Answers";
    overlay.appendChild(h);

    // Review / Share tabs for the Review My Answers page.
    var tabBar=document.createElement("div");
    tabBar.style.cssText="display:flex;gap:8px;margin:14px 0 20px;border-bottom:1px solid #ddd;padding-bottom:10px";
    var reviewTab=document.createElement("button");
    reviewTab.textContent="Review My Answers";
    reviewTab.className="secondary";
    var shareTab=document.createElement("button");
    shareTab.textContent="Share";
    shareTab.className="secondary";
    tabBar.appendChild(reviewTab); tabBar.appendChild(shareTab);
    overlay.appendChild(tabBar);

    var reviewContent=document.createElement("div");
    overlay.appendChild(reviewContent);

    var shareContent=document.createElement("div");
    shareContent.style.display="none";
    shareContent.className="card";
    var shareTitle=document.createElement("h2");
    shareTitle.textContent="Share Step 5 — My Review Answers";
    shareContent.appendChild(shareTitle);
    var shareIntro=document.createElement("p");
    shareIntro.textContent="Choose how you would like to share your saved answers with your sponsor or another person.";
    shareContent.appendChild(shareIntro);
    var shareButtons=document.createElement("div");
    shareButtons.style.cssText="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px";
    var emailBtn=document.createElement("button"); emailBtn.textContent="Email";
    var textBtn=document.createElement("button"); textBtn.textContent="Text Message";
    var clipBtn=document.createElement("button"); clipBtn.textContent="Copy to Clipboard";
    shareButtons.appendChild(emailBtn); shareButtons.appendChild(textBtn); shareButtons.appendChild(clipBtn);
    shareContent.appendChild(shareButtons);
    var shareStatus=document.createElement("div");
    shareStatus.style.cssText="margin-top:12px;color:#666";
    shareContent.appendChild(shareStatus);
    overlay.appendChild(shareContent);

    function buildReviewShareText(){
      var lines=["An Interactive Working Guide to the 12 Steps of NA","Step 5 — My Review Answers",""];
      var has=false;
      SECTIONS.forEach(function(section,si){
        var sectionHas=false;
        var sectionLines=[];
        QUESTIONS.forEach(function(q,index){
          if(q.sectionIndex===si){
            var a=localStorage.getItem(PREFIX+index)||"";
            if(a.trim()!==""){
              has=true; sectionHas=true;
              sectionLines.push("• "+q.text);
              sectionLines.push("My Answer:");
              sectionLines.push(a.trim());
              sectionLines.push("");
            }
          }
        });
        if(sectionHas){ lines.push(section.name.toUpperCase()); lines.push(""); lines=lines.concat(sectionLines); }
      });
      if(!has) lines.push("No answers have been saved yet.");
      return lines.join("\n").trim();
    }

    reviewTab.onclick=function(){ reviewContent.style.display="block"; shareContent.style.display="none"; };
    shareTab.onclick=function(){ reviewContent.style.display="none"; shareContent.style.display="block"; };
    emailBtn.onclick=function(){ window.location.href="mailto:?subject="+encodeURIComponent("NA Step 5 — My Review Answers")+"&body="+encodeURIComponent(buildReviewShareText()); };
    textBtn.onclick=function(){ window.location.href="sms:?&body="+encodeURIComponent(buildReviewShareText()); };
    clipBtn.onclick=function(){
      var txt=buildReviewShareText();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){shareStatus.textContent="Your review answers have been copied to the clipboard.";}).catch(function(){shareStatus.textContent="Clipboard access was not available on this device.";});
      } else {
        var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.left="-9999px"; document.body.appendChild(ta); ta.select();
        try{document.execCommand("copy"); shareStatus.textContent="Your review answers have been copied to the clipboard.";}catch(e){shareStatus.textContent="Clipboard access was not available on this device.";}
        document.body.removeChild(ta);
      }
    };

    var found=false;

    SECTIONS.forEach(function(section,si){
      var answered=[];
      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex===si){
          var a=localStorage.getItem(PREFIX+index)||"";
          if(a.trim()!=="") answered.push({q:q,index:index,a:a});
        }
      });

      if(answered.length){
        found=true;
        var sh=document.createElement("div");
        sh.className="eyebrow";
        sh.style.marginTop="28px";
        sh.textContent=section.name;
        reviewContent.appendChild(sh);

        answered.forEach(function(item){
          var card=document.createElement("div");
          card.className="card";

          var q=document.createElement("div");
          q.className="question";
          q.textContent="• "+item.q.text;
          card.appendChild(q);

          var label=document.createElement("div");
          label.className="status";
          label.textContent="MY ANSWER";
          label.style.cssText="font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#666;font-weight:750;margin:10px 0 7px";
          card.appendChild(label);

          var ans=document.createElement("div");
          ans.style.cssText="white-space:pre-line;font-size:17px;line-height:1.55;border-top:1px solid #ddd;padding-top:10px";
          ans.textContent=item.a;
          card.appendChild(ans);

          var edit=document.createElement("button");
          edit.className="secondary";
          edit.textContent="Edit Answer";
          edit.style.marginTop="14px";
          edit.onclick=function(){
            overlay.remove();
            qi=item.index;
            si=item.q.sectionIndex;
            mode="question";
            render();
          };
          card.appendChild(edit);

          reviewContent.appendChild(card);
        });
      }
    });

    if(!found){
      var empty=document.createElement("div");
      empty.className="card";
      empty.textContent="You have not saved any answers yet.";
      reviewContent.appendChild(empty);
    }

    document.body.appendChild(overlay);
  }

  function addButton(){
    if(document.getElementById("reviewAnswersButton")) return;
    if(typeof mode==="undefined" || mode!=="intro") return;

    var buttons=document.querySelectorAll(".bottom button");
    var nextButton=document.getElementById("next");
    if(!nextButton) return;

    var b=document.createElement("button");
    b.id="reviewAnswersButton";
    b.className="secondary";
    b.textContent="Step 5 — Review My Answers";
    b.onclick=reviewAnswers;

    nextButton.parentNode.insertBefore(b,nextButton);
  }

  // The existing app calls render() dynamically, so observe the Home screen.
  var observer=new MutationObserver(function(){addButton()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addButton,100);
})();
</script>


<script>
(function(){
  function showProgress(){
    var overlay=document.createElement("div");
    overlay.id="progressOverlay";
    overlay.style.cssText="position:fixed;inset:0;background:#fff;z-index:99998;overflow:auto;padding:22px 18px 110px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202124";

    var close=document.createElement("button");
    close.textContent="← Home";
    close.className="secondary";
    close.onclick=function(){overlay.remove()};
    overlay.appendChild(close);

    var h=document.createElement("h1");
    h.textContent="My Progress";
    overlay.appendChild(h);

    var totalAnswered=0, totalQuestions=QUESTIONS.length;

    SECTIONS.forEach(function(section,si){
      var count=0,total=0;
      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex===si){
          total++;
          if((localStorage.getItem(PREFIX+index)||"").trim()!=="") count++;
        }
      });
      totalAnswered+=count;

      var card=document.createElement("div");
      card.className="card";

      var title=document.createElement("div");
      title.style.cssText="font-size:19px;font-weight:700;margin-bottom:8px";
      title.textContent=section.name;
      card.appendChild(title);

      var status=document.createElement("div");
      status.className="status";
      status.textContent=count+" / "+total+" questions answered";
      card.appendChild(status);

      var bar=document.createElement("div");
      bar.style.cssText="height:7px;background:#eee;border-radius:6px;margin-top:12px;overflow:hidden";
      var fill=document.createElement("div");
      fill.style.cssText="height:100%;background:#444;width:"+((count/total)*100)+"%";
      bar.appendChild(fill);
      card.appendChild(bar);

      card.onclick=function(){
        overlay.remove();
        si = si;
        mode="reading";
        render();
      };
      overlay.appendChild(card);
    });

    var summary=document.createElement("div");
    summary.className="card";
    summary.style.marginTop="24px";
    summary.innerHTML="<strong>Overall Progress</strong><div style='font-size:17px;margin-top:8px'>"+
      totalAnswered+" / "+totalQuestions+" questions answered</div>";
    overlay.insertBefore(summary, overlay.children[2]);

    document.body.appendChild(overlay);
  }

  function addProgressButton(){
    if(document.getElementById("progressAnswersButton")) return;
    if(typeof mode==="undefined" || mode!=="intro") return;
    var nextButton=document.getElementById("next");
    if(!nextButton) return;

    var b=document.createElement("button");
    b.id="progressAnswersButton";
    b.className="secondary";
    b.textContent="My Progress";
    b.onclick=showProgress;
    nextButton.parentNode.insertBefore(b,nextButton);
  }

  var observer=new MutationObserver(addProgressButton);
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addProgressButton,100);
})();
</script>

<script>
(function(){
  
  function restoreAnswers(file){
    if(!file){
      alert("No backup file was selected.");
      return;
    }

    var reader=new FileReader();

    reader.onerror=function(){
      alert("Safari could not read that backup file.");
    };

    reader.onload=function(){
      try{
        var data=JSON.parse(reader.result);

        if(!data || !data.answers || typeof data.answers!=="object"){
          throw new Error("Invalid backup format");
        }

        var restored=0;
        if(data.notes && typeof data.notes==="object"){
          Object.keys(data.notes).forEach(function(si){
            if(typeof SECTIONS!=="undefined" && SECTIONS[Number(si)]){
              localStorage.setItem(NOTES_PREFIX+si,String(data.notes[si]||""));
            }
          });
        }

        Object.keys(data.answers).forEach(function(index){
          var n=Number(index);
          if(Number.isInteger(n) && typeof QUESTIONS!=="undefined" && QUESTIONS[n]){
            localStorage.setItem(PREFIX+n,String(data.answers[index]));
            restored++;
          }
        });

        if(restored===0){
          throw new Error("No matching answers");
        }

        alert(restored+" saved answer"+(restored===1?"":"s")+" restored.");
        if(typeof render==="function") render();

      }catch(e){
        alert("That file could not be restored. Please choose a Step 5 backup file created by this app.");
      }
    };

    reader.readAsText(file);
  }
  function addBackupButtons(){
    if(typeof mode==="undefined" || mode!=="intro") return;
    var nextButton=document.getElementById("next");
    if(!nextButton) return;


    if(!document.getElementById("restoreAnswersWrap")){
      var wrap=document.createElement("div");
      wrap.id="restoreAnswersWrap";
      wrap.style.cssText="margin-top:8px";

      var label=document.createElement("label");
      label.className="secondary";
      label.textContent="Restore My Answers";
      label.style.cssText="display:inline-block;cursor:pointer";

      var input=document.createElement("input");
      input.type="file";
      input.accept=".json,application/json,text/plain";
      input.style.cssText="display:block;margin-top:8px;max-width:100%";
      input.onchange=function(){
        if(input.files && input.files.length){
          restoreAnswers(input.files[0]);
        }
      };

      wrap.appendChild(label);
      wrap.appendChild(input);
      nextButton.parentNode.insertBefore(wrap,nextButton);
    }
  }
  var observer=new MutationObserver(function(){addBackupButtons()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addBackupButtons,100);
})();
</script>


<script>
(function(){
  function addCompletionSystem(){
    if(typeof SECTIONS==="undefined" || typeof QUESTIONS==="undefined") return;

    function sectionStats(si){
      var answered=0,total=0;
      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex===si){
          total++;
          if((localStorage.getItem(PREFIX+index)||"").trim()!=="") answered++;
        }
      });
      return {answered:answered,total:total,complete:total>0 && answered===total};
    }

    // Enhance the existing My Progress overlay after it is opened.
    var originalShowProgress=window.showProgress;
    if(typeof originalShowProgress!=="function" || originalShowProgress.__completionEnhanced) return;

    function enhancedProgress(){
      originalShowProgress();

      setTimeout(function(){
        var overlay=document.getElementById("progressOverlay");
        if(!overlay) return;

        var cards=overlay.querySelectorAll(".card");
        var sectionCards=[];
        cards.forEach(function(card){
          var title=card.querySelector("div");
          if(title && title.textContent && title.textContent!=="Overall Progress"){
            sectionCards.push(card);
          }
        });

        SECTIONS.forEach(function(section,si){
          var stats=sectionStats(si);
          var card=sectionCards[si];
          if(!card) return;

          var badge=card.querySelector(".completionBadge");
          if(!badge){
            badge=document.createElement("div");
            badge.className="completionBadge";
            badge.style.cssText="font-size:12px;font-weight:750;letter-spacing:.07em;margin-top:9px";
            card.appendChild(badge);
          }

          if(stats.complete){
            badge.textContent="✓ COMPLETED";
            badge.style.color="#2f6b3f";
          }else if(stats.answered>0){
            badge.textContent="IN PROGRESS";
            badge.style.color="#666";
          }else{
            badge.textContent="NOT STARTED";
            badge.style.color="#999";
          }
        });

        var allComplete=SECTIONS.every(function(_,si){return sectionStats(si).complete;});
        if(allComplete){
          var done=document.createElement("div");
          done.className="card";
          done.style.marginTop="18px";
          done.innerHTML="<strong>✓ STEP FIVE COMPLETED</strong><div style='margin-top:8px;font-size:16px;line-height:1.5'>You have answered every Step 5 question.</div>";
          overlay.appendChild(done);
        }
      },0);
    }

    enhancedProgress.__completionEnhanced=true;
    window.showProgress=enhancedProgress;
  }

  var observer=new MutationObserver(function(){addCompletionSystem()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addCompletionSystem,100);
})();
</script>


<script>
(function(){
  var NOTES_PREFIX="stepOneNotes_";

  function getNotes(si){
    return localStorage.getItem(NOTES_PREFIX+si)||"";
  }

  function saveNote(si,text){
    localStorage.setItem(NOTES_PREFIX+si,text);
  }

  function showNotes(){
    var overlay=document.createElement("div");
    overlay.id="notesOverlay";
    overlay.style.cssText="position:fixed;inset:0;background:#fff;z-index:99996;overflow:auto;padding:22px 18px 110px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202124";

    var close=document.createElement("button");
    close.textContent="← Home";
    close.className="secondary";
    close.onclick=function(){overlay.remove()};
    overlay.appendChild(close);

    var h=document.createElement("h1");
    h.textContent="My Step 5 Notes";
    overlay.appendChild(h);

    var intro=document.createElement("div");
    intro.className="reading";
    intro.textContent="Use these notes for thoughts, reflections, or anything you want to remember while working through each section.";
    overlay.appendChild(intro);

    SECTIONS.forEach(function(section,si){
      var card=document.createElement("div");
      card.className="card";

      var title=document.createElement("div");
      title.style.cssText="font-size:19px;font-weight:700;margin-bottom:10px";
      title.textContent=section.name;
      card.appendChild(title);

      var textarea=document.createElement("textarea");
      textarea.style.cssText="width:100%;min-height:130px;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:8px;font:16px/1.5 inherit;resize:vertical";
      textarea.placeholder="Write your notes for this section here...";
      textarea.value=getNotes(si);
      card.appendChild(textarea);

      var saved=document.createElement("div");
      saved.style.cssText="font-size:13px;color:#666;margin-top:8px;min-height:18px";
      card.appendChild(saved);

      var button=document.createElement("button");
      button.className="secondary";

        saveNote(si,textarea.value);
        saved.textContent="Saved.";
        setTimeout(function(){saved.textContent=""},1800);
      };
      card.appendChild(button);

      overlay.appendChild(card);
    });

    document.body.appendChild(overlay);
  }

  function addNotesButton(){
    if(document.getElementById("notesButton")) return;
    if(typeof mode==="undefined" || mode!=="intro") return;

    var nextButton=document.getElementById("next");
    if(!nextButton) return;

    var b=document.createElement("button");
    b.id="notesButton";
    b.className="secondary";
    b.textContent="My Step 5 Notes";
    b.onclick=showNotes;
    nextButton.parentNode.insertBefore(b,nextButton);
  }

  var observer=new MutationObserver(function(){addNotesButton()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addNotesButton,100);

<script>
(function(){
  function buildSummary(){
    var overlay=document.createElement("div");
    overlay.id="summaryOverlay";
    overlay.style.cssText="position:fixed;inset:0;background:#fff;z-index:99995;overflow:auto;padding:22px 18px 110px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202124";

    var close=document.createElement("button");
    close.textContent="← Home";
    close.className="secondary";
    close.onclick=function(){overlay.remove()};
    overlay.appendChild(close);

    var title=document.createElement("h1");
    title.textContent="Step 5 — Summary";
    overlay.appendChild(title);

    var answered=0;
    var total=QUESTIONS.length;

    SECTIONS.forEach(function(section,si){
      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex===si && (localStorage.getItem(PREFIX+index)||"").trim()!=="") answered++;
      });
    });

    var completed=answered===total && total>0;

    var status=document.createElement("div");
    status.className="card";
    status.innerHTML="<strong>"+(completed?"✓ STEP FIVE COMPLETED":"STEP FIVE IN PROGRESS")+
      "</strong><div style='margin-top:8px;font-size:16px'>"+answered+" of "+total+" questions answered.</div>";
    overlay.appendChild(status);

    var date=document.createElement("div");
    date.className="card";
    date.innerHTML="<strong>Summary Date</strong><div style='margin-top:8px'>"+
      new Date().toLocaleDateString()+"</div>";

    overlay.appendChild(date);

    // Share button directly on the Step Summary.
    var summaryShareCard=document.createElement("div");
    summaryShareCard.id="summaryShareCard";
    summaryShareCard.className="card";
    summaryShareCard.style.cssText="margin-top:16px";

    var shareHeading=document.createElement("strong");
    shareHeading.textContent="Share My Answers";
    shareHeading.style.display="block";
    shareHeading.style.marginBottom="8px";
    summaryShareCard.appendChild(shareHeading);

    var shareHelp=document.createElement("div");
    shareHelp.textContent="Share your saved answers by email, text message, or copy them to the clipboard.";
    shareHelp.style.cssText="font-size:15px;line-height:1.45;margin-bottom:12px";
    summaryShareCard.appendChild(shareHelp);

    var summaryShareActions=document.createElement("div");
    summaryShareActions.style.cssText="display:flex;flex-wrap:wrap;gap:8px";

    function buildSummaryShareText(){
      var lines=["An Interactive Working Guide to the 12 Steps of NA","Step 5 — My Review Answers",""];
      var any=false;
      SECTIONS.forEach(function(section,si){
        var sectionLines=[];
        QUESTIONS.forEach(function(q,index){
          if(q.sectionIndex!==si) return;
          var a=(localStorage.getItem(PREFIX+index)||"").trim();
          if(a){
            any=true;
            sectionLines.push("• "+q.text);
            sectionLines.push("My Answer:");
            sectionLines.push(a);
            sectionLines.push("");
          }
        });
        if(sectionLines.length){
          lines.push(section.name.toUpperCase());
          lines.push("");
          lines=lines.concat(sectionLines);
        }
      });
      if(!any) lines.push("No answers have been saved yet.");
      return lines.join("\n").trim();
    }

    var summaryEmail=document.createElement("button");
    summaryEmail.className="secondary";
    summaryEmail.textContent="Email";
    summaryEmail.onclick=function(){
      window.location.href="mailto:?subject="+encodeURIComponent("NA Step 5 — My Review Answers")+"&body="+encodeURIComponent(buildSummaryShareText());
    };

    var summaryText=document.createElement("button");
    summaryText.className="secondary";
    summaryText.textContent="Text Message";
    summaryText.onclick=function(){
      window.location.href="sms:?&body="+encodeURIComponent(buildSummaryShareText());
    };

    var summaryCopy=document.createElement("button");
    summaryCopy.className="secondary";
    summaryCopy.textContent="Copy to Clipboard";
    summaryCopy.onclick=function(){
      var txt=buildSummaryShareText();
      function ok(){summaryShareStatus.textContent="Your review answers have been copied to the clipboard.";}
      function fail(){summaryShareStatus.textContent="Clipboard access was not available on this device.";}
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(ok).catch(function(){
          var ta=document.createElement("textarea");
          ta.value=txt; ta.style.position="fixed"; ta.style.left="-9999px";
          document.body.appendChild(ta); ta.select();
          try{document.execCommand("copy"); ok();}catch(e){fail();}
          document.body.removeChild(ta);
        });
      }else{
        var ta=document.createElement("textarea");
        ta.value=txt; ta.style.position="fixed"; ta.style.left="-9999px";
        document.body.appendChild(ta); ta.select();
        try{document.execCommand("copy"); ok();}catch(e){fail();}
        document.body.removeChild(ta);
      }
    };

    summaryShareActions.appendChild(summaryEmail);
    summaryShareActions.appendChild(summaryText);
    summaryShareActions.appendChild(summaryCopy);
    summaryShareCard.appendChild(summaryShareActions);

    var summaryShareStatus=document.createElement("div");
    summaryShareStatus.style.cssText="margin-top:9px;color:#666;font-size:14px";
    summaryShareCard.appendChild(summaryShareStatus);

    overlay.appendChild(summaryShareCard);

    SECTIONS.forEach(function(section,si){
      var card=document.createElement("div");
      card.className="card";

      var heading=document.createElement("div");
      heading.style.cssText="font-size:19px;font-weight:700;margin-bottom:12px";
      heading.textContent=section.name;
      card.appendChild(heading);

      var hasContent=false;

      QUESTIONS.forEach(function(q,index){
        if(q.sectionIndex!==si) return;
        var a=(localStorage.getItem(PREFIX+index)||"").trim();
        if(!a) return;

        hasContent=true;

        var qbox=document.createElement("div");
        qbox.style.cssText="font-weight:700;margin-top:14px";
        qbox.textContent="• "+q.text;
        card.appendChild(qbox);

        var abox=document.createElement("div");
        abox.style.cssText="white-space:pre-line;margin-top:7px;padding:10px;border-left:3px solid #ddd;line-height:1.5";
        abox.textContent=a;
        card.appendChild(abox);
      });

      var note=localStorage.getItem("stepOneNotes_"+si)||"";
      if(note.trim()){
        hasContent=true;
        var nh=document.createElement("div");
        nh.style.cssText="font-weight:700;margin-top:20px";
        nh.textContent="My Notes";
        card.appendChild(nh);

        var nb=document.createElement("div");
        nb.style.cssText="white-space:pre-line;margin-top:7px;padding:10px;border-left:3px solid #ddd;line-height:1.5";
        nb.textContent=note;
        card.appendChild(nb);
      }

      if(hasContent) overlay.appendChild(card);
    });

    var print=document.createElement("button");
    print.className="secondary";
    print.textContent="Print / Save as PDF";
    print.style.marginTop="18px";
    print.onclick=function(){window.print()};
    overlay.appendChild(print);

    document.body.appendChild(overlay);
  }

  function addSummaryButton(){
    if(document.getElementById("summaryButton")) return;
    if(typeof mode==="undefined" || mode!=="intro") return;

    var nextButton=document.getElementById("next");
    if(!nextButton) return;

    var b=document.createElement("button");
    b.id="summaryButton";
    b.className="secondary";
    b.textContent="Step 5 Summary";
    b.onclick=buildSummary;
    nextButton.parentNode.insertBefore(b,nextButton);
  }

  var observer=new MutationObserver(function(){addSummaryButton()});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(addSummaryButton,100);
})();
</script>


<button id="shareReview" type="button" onclick="shareReview()" style="margin:10px 0;">Share</button>
<div id="sharePanel" class="share-panel">
  <strong>Share Step 5 — Review My Answers</strong>
  <div class="share-actions">
    <button type="button" onclick="shareByEmail()">Email</button>
    <button type="button" onclick="shareByText()">Text Message</button>
    <button type="button" onclick="copyReviewToClipboard()">Copy to Clipboard</button>
  </div>
  <div id="shareStatus" class="share-status"></div>
</div>

<script>
function getStepReviewText() {
  const step = 5;
  let lines = [];
  lines.push("An Interactive Working Guide to the 12 Steps of NA");
  lines.push("Step " + step + " — My Review Answers");
  lines.push("");
  const root = document.body;
  // Collect visible question/answer pairs from the current Step 5 review.
  // Prefer review containers and textarea/input values, while avoiding navigation controls.
  const fields = Array.from(root.querySelectorAll("textarea, input[type='text'], input:not([type])"));
  let q = 0;
  fields.forEach(el => {
    if (!el.offsetParent) return;
    const value = (el.value || "").trim();
    if (!value) return;
    const prev = el.closest(".question, .q, .card, .section, div");
    let label = "";
    if (prev) {
      const heading = prev.querySelector("h1,h2,h3,h4,strong,label");
      if (heading) label = heading.textContent.trim();
    }
    if (!label) {
      q++;
      label = "Answer " + q;
    }
    lines.push(label + ":");
    lines.push(value);
    lines.push("");
  });
  // If the review page has generated text, include it as a fallback.
  if (lines.length <= 4) {
    const review = document.querySelector("#review, .review, [id*='review']");
    if (review) {
      const clone = review.cloneNode(true);
      clone.querySelectorAll("button, script, style").forEach(x => x.remove());
      const body = clone.innerText.trim();
      if (body) lines.push(body);
    }
  }
  return lines.join("\n").trim();
}

function shareReview() {
  const panel = document.getElementById("sharePanel");
  if (panel) panel.classList.toggle("show");
}

function shareByEmail() {
  const body = encodeURIComponent(getStepReviewText());
  window.location.href = "mailto:?subject=" + encodeURIComponent("NA Step 5 — My Review Answers") + "&body=" + body;
}

function shareByText() {
  const body = encodeURIComponent(getStepReviewText());
  // sms: works across common iOS/Android configurations; the user selects the recipient.
  window.location.href = "sms:?&body=" + body;
}

async function copyReviewToClipboard() {
  const text = getStepReviewText();
  try {
    await navigator.clipboard.writeText(text);
    const status = document.getElementById("shareStatus");
    if (status) status.textContent = "Review answers copied to the clipboard.";
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      const status = document.getElementById("shareStatus");
      if (status) status.textContent = "Review answers copied to the clipboard.";
    } finally {
      document.body.removeChild(ta);
    }
  }
}
</script>

<script>
(function(){
  const STEP_NO = (document.title.match(/Step (\\d+)/i)||[])[1] || (document.body.innerText.match(/Step (\\d+)/i)||[])[1] || "";
  const ANSWER_PREFIX = (typeof PREFIX !== "undefined") ? PREFIX : "";
  const NOTES_PREFIX_LOCAL = (typeof NOTES_PREFIX !== "undefined") ? NOTES_PREFIX : ("step"+STEP_NO+"Notes_");
  const STATE_KEY_LOCAL = (typeof STATE !== "undefined") ? STATE : "";
  const STEP_KEYS = {
    1:{prefix:"step-one-complete-v4-",notes:"stepOneNotes_",state:"step-one-v4-resume-state"},
    2:{prefix:"step-two-complete-v1-",notes:"stepOneNotes_",state:"step-two-v1-resume-state"},
    3:{prefix:"step-three-complete-v1-",notes:"stepOneNotes_",state:"step-three-v1-resume-state"},
    4:{prefix:"step-four-complete-v1-",notes:"stepOneNotes_",state:"step-four-v1-resume-state"},
    5:{prefix:"step-five-complete-v1-",notes:"stepOneNotes_",state:"step-five-v1-resume-state"},
    6:{prefix:"step-six-complete-v1-",notes:"stepOneNotes_",state:"step-six-v1-resume-state"},
    7:{prefix:"step-seven-v1-",notes:"step7Notes_",state:"step-seven-v1-resume-state"},
    8:{prefix:"step-eight-v1-",notes:"step8Notes_",state:"step-eight-v1-resume-state"},
    9:{prefix:"step-nine-v1-",notes:"step9Notes_",state:"step-nine-v1-resume-state"},
    10:{prefix:"step-ten-v1-",notes:"step10Notes_",state:"step-ten-v1-resume-state"},
    11:{prefix:"step-eleven-v1-",notes:"step11Notes_",state:"step-eleven-v1-resume-state"},
    12:{prefix:"step-twelve-v1-",notes:"step12Notes_",state:"step-twelve-v1-resume-state"}
  };
  function collect(){
    const data={format:"NA-Step-Working-Guide-Backup",version:1,created:new Date().toISOString(),steps:{}};
    for(let n=1;n<=12;n++){
      const cfg=STEP_KEYS[n], answers={}, notes={};
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k && k.indexOf(cfg.prefix)===0) answers[k.slice(cfg.prefix.length)]=localStorage.getItem(k);
        if(k && k.indexOf(cfg.notes)===0) notes[k.slice(cfg.notes.length)]=localStorage.getItem(k);
      }
      data.steps[n]={answers,notes,state:localStorage.getItem(cfg.state)};
    }
    return data;
  }
  function download(){
    const blob=new Blob([JSON.stringify(collect(),null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="NA-Step-Working-Guide-Backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  function restore(file){
    const reader=new FileReader();
    reader.onerror=()=>alert("The backup file could not be read.");
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        if(data.format!=="NA-Step-Working-Guide-Backup" || !data.steps) throw new Error();
        let restored=0;
        for(let n=1;n<=12;n++){
          const cfg=STEP_KEYS[n], s=data.steps[n]||data.steps[String(n)];
          if(!s) continue;
          if(s.answers) Object.keys(s.answers).forEach(k=>{localStorage.setItem(cfg.prefix+k,String(s.answers[k]??""));restored++;});
          if(s.notes) Object.keys(s.notes).forEach(k=>localStorage.setItem(cfg.notes+k,String(s.notes[k]??"")));
          if(s.state) localStorage.setItem(cfg.state,String(s.state));
        }
        if(!restored) throw new Error();
        alert("Backup restored successfully. "+restored+" answer entries were restored across the workbook.");
        if(typeof render==="function") render();
      }catch(e){ alert("That file is not a valid NA Step Working Guide backup."); }
    };
    reader.readAsText(file);
  }
  function addPanel(){
    if(typeof mode==="undefined" || mode!=="intro" || document.getElementById("backupPanel")) return;
    const next=document.getElementById("next"); if(!next) return;
    const wrap=document.createElement("div"); wrap.id="backupPanel";
    wrap.style.cssText="margin:18px 0 8px;padding:16px;border:1px solid #ddd;border-radius:14px;background:#f7f7f8;text-align:left";
    wrap.innerHTML='<div style="font-size:18px;font-weight:700;margin-bottom:6px">Backup & Restore</div><div style="font-size:14px;line-height:1.45;margin-bottom:12px">Your answers save automatically on this device. Create a backup file if you want to keep a copy or move your work to another device.</div>';
    const exp=document.createElement("button"); exp.className="secondary"; exp.textContent="Export My Answers"; exp.style.margin="4px 6px 4px 0"; exp.onclick=download;
    const label=document.createElement("label"); label.textContent="Restore My Answers"; label.style.cssText="display:inline-block;border-radius:10px;padding:12px 15px;background:#222;color:#fff;font-size:15px;cursor:pointer;margin:4px 0";
    const input=document.createElement("input"); input.type="file"; input.accept=".json,application/json,text/plain"; input.style.display="none"; input.onchange=()=>{if(input.files&&input.files[0]) restore(input.files[0]);};
    label.appendChild(input); wrap.appendChild(exp); wrap.appendChild(label); next.parentNode.insertBefore(wrap,next);
  }
  const old=document.createElement('style'); old.textContent='#restoreAnswersWrap{display:none!important}'; document.head.appendChild(old);
  new MutationObserver(addPanel).observe(document.body,{childList:true,subtree:true}); setTimeout(addPanel,100);
})();
</script>

<script id="naCompactNav">
(function(){
  function txt(el){return (el.innerText||el.textContent||"").trim().replace(/\s+/g," ");}
  function setup(){
    var bottom=document.querySelector(".bottom");
    if(!bottom)return;
    var home=document.getElementById("home"), back=document.getElementById("back"), next=document.getElementById("next");
    if(!home||!back||!next)return;

    var drawer=document.getElementById("naToolsDrawer");
    if(!drawer){
      drawer=document.createElement("div");
      drawer.id="naToolsDrawer";
      drawer.innerHTML='<div class="tools-title">Step Tools</div>';
      document.body.appendChild(drawer);
    }
    var tools=document.getElementById("mobileToolsButton");
    if(!tools){
      tools=document.createElement("button");
      tools.id="mobileToolsButton";
      tools.type="button";
      tools.className="secondary";
      tools.textContent="Tools";
      tools.onclick=function(e){e.stopPropagation();drawer.classList.toggle("open");};
    }
    if(tools.parentNode!==bottom) bottom.insertBefore(tools,next);

    var primary=[home,back,tools,next];
    Array.prototype.slice.call(bottom.children).forEach(function(el){
      if(primary.indexOf(el)!==-1)return;
      el.classList.add("tool-item");
      drawer.appendChild(el);
    });

    var panel=document.getElementById("backupPanel");
    if(panel && panel.parentNode!==drawer){
      drawer.appendChild(panel);
    }
  }
  function run(){setup();}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run);else run();
  [100,300,700,1200].forEach(function(ms){setTimeout(run,ms);});
  new MutationObserver(run).observe(document.body,{childList:true,subtree:true});
  document.addEventListener("click",function(e){
    var drawer=document.getElementById("naToolsDrawer"),tools=document.getElementById("mobileToolsButton");
    if(drawer&&drawer.classList.contains("open")&&!drawer.contains(e.target)&&e.target!==tools)drawer.classList.remove("open");
  });
})();
</script>
